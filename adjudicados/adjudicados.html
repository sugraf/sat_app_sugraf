<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10263B">
  <title>Mis Avisos Asignados - Sugraf Digital Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#10263B;
      --navy-dark:#0a1826;
      --navy-light:#173654;
      --green:#006858;
      --green-dark:#004d40;
      --green-soft:rgba(0,104,88,0.15);
      --grey:#B6BEC4;
      --ink:#f4f8fc;
      --muted:#a9bcd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html{ scroll-behavior:smooth; }
    body {
        font-family: 'Montserrat', sans-serif;
        font-weight:400;
        background-color: var(--navy);
        background-image:
          radial-gradient(900px circle at 15% -5%, rgba(0,104,88,0.28) 0%, transparent 55%),
          radial-gradient(900px circle at 90% 10%, rgba(182,190,196,0.10) 0%, transparent 55%),
          radial-gradient(1200px circle at 50% 120%, rgba(0,104,88,0.12) 0%, transparent 60%);
        background-attachment: fixed;
        color: var(--ink);
        min-height: 100vh;
    }
    h1, h2, h3 { font-family: 'Montserrat', sans-serif; font-weight:700; letter-spacing:-0.01em; }

    .topbar {
      background:#ffffff;
      height:64px;
      display:flex;
      align-items:center;
      padding:0 24px;
      justify-content:space-between;
      box-shadow:0 1px 0 rgba(16,38,59,0.08), 0 4px 16px rgba(16,38,59,0.04);
      position:sticky; top:0; z-index:100;
    }
    .topbar-left{ display:flex; align-items:center; gap:16px; height:100%; }
    .topbar img{ height:35px; object-fit:contain; display:block; }

    .btn-back{
      display:flex; align-items:center; gap:6px;
      color:#4a5a72; text-decoration:none; font-weight:600; font-size:0.85rem;
      padding:8px 14px; border-radius:10px; border:1px solid #e2e8f0;
      transition:background 0.15s, border-color 0.15s;
    }
    .btn-back:hover{ background:#f1f5f8; border-color:#cbd5e1; }

    .topbar-right { color:#4a5a72; font-size:13px; font-weight:600; display:flex; align-items:center; gap:9px; }
    .dot { width:8px; height:8px; background:var(--green); border-radius:50%; box-shadow:0 0 0 4px var(--green-soft); }

    .dropdown { position:relative; display:inline-block; cursor:pointer; }
    .dropdown-trigger{ display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:10px; transition:background 0.15s; }
    .dropdown-trigger:hover{ background:#f1f5f8; }
    .chev{ font-size:9px; color:#94a3b8; transition:transform 0.15s; }
    .dropdown-content {
      display:none; position:absolute; right:0; background:#ffffff;
      min-width:170px; box-shadow:0 12px 28px rgba(16,38,59,0.18);
      z-index:1; border-radius:12px; overflow:hidden; margin-top:10px;
      border:1px solid #eef2f5;
    }
    .dropdown-content a {
      color:#ef4444; padding:13px 16px; text-decoration:none; display:flex;
      align-items:center; gap:8px; font-weight:600; font-size:0.88rem;
    }
    .dropdown-content a:hover { background:#fef2f2; }
    .show { display:block; animation:dropIn 0.15s ease; }
    @keyframes dropIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }

    .container { max-width:960px; margin:0 auto; padding:20px; }
    .header-title{ text-align:center; margin:44px 0 34px; }
    .eyebrow{
      display:inline-flex; align-items:center; gap:7px; background:var(--green-soft);
      border:1px solid rgba(0,104,88,0.35); color:#7fd9c7; font-size:0.7rem; font-weight:700;
      letter-spacing:0.12em; text-transform:uppercase; padding:6px 14px; border-radius:999px; margin-bottom:16px;
    }
    .eyebrow .dot-sm{ width:6px; height:6px; background:#2fd9b8; border-radius:50%; }
    .header-title h2 { font-size:2rem; color:var(--ink); margin-bottom:8px; border:none; padding:0; }
    .header-title p{ color:var(--muted); font-size:0.95rem; }

    #master-panel{ margin-bottom:30px; }
    .master-intro{ font-size:0.78rem; color:var(--muted); margin-bottom:12px; font-weight:600; letter-spacing:0.04em; }
    .master-tab {
      position:relative; overflow:hidden;
      background:linear-gradient(160deg, var(--navy-light) 0%, var(--navy) 100%);
      color:#fff; border:1px solid rgba(182,190,196,0.14);
      padding:13px 18px; border-radius:14px; flex:1; min-width:150px; cursor:pointer;
      font-weight:600; font-family:'Montserrat', sans-serif; font-size:0.92rem;
      transition:transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      display:flex; justify-content:center; align-items:center; gap:8px;
    }
    .master-tab:hover{ border-color:rgba(0,104,88,0.55); transform:translateY(-2px); }
    .master-tab.active{ background:linear-gradient(160deg, var(--green) 0%, var(--green-dark) 100%); border-color:var(--green); box-shadow:0 10px 22px rgba(0,104,88,0.3); }
    .master-tab span{ background:rgba(0,0,0,0.25); padding:2px 9px; border-radius:12px; font-size:0.78rem; }

    .section-divider{
      margin:32px 0 14px; padding-bottom:8px; font-size:1.05rem; font-weight:700;
      color:var(--ink); border-bottom:1px solid rgba(182,190,196,0.18);
      display:flex; align-items:center; gap:8px;
    }
    .dot-status{ width:8px; height:8px; border-radius:50%; display:inline-block; }
    .dot-status.closed{ background:#94a3b8; }
    .dot-status.open{ background:#2fd9b8; box-shadow:0 0 0 4px var(--green-soft); }
    .dot-status.pending{ background:var(--grey); }

    .inc-item {
      position:relative; overflow:hidden;
      background:linear-gradient(160deg, var(--navy-light) 0%, var(--navy) 100%);
      border:1px solid rgba(182,190,196,0.14);
      padding:18px 20px; border-radius:16px; margin-bottom:12px;
      cursor:pointer; text-align:left;
      transition:transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      animation: fadeIn 0.3s ease;
    }
    .inc-item:hover{ border-color:rgba(0,104,88,0.55); transform:translateY(-3px); box-shadow:0 14px 28px rgba(0,0,0,0.25); }
    .inc-title{ font-weight:700; color:#fff; font-size:1.02rem; display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
    .inc-sub{ color:var(--muted); font-size:0.85rem; margin-top:8px; }
    .inc-sub strong{ color:#d7e2ef; }

    .badge{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:0.68rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; border:1px solid transparent; }
    .bg-urg{ background:rgba(239,68,68,0.18); color:#fca5a5; border-color:rgba(239,68,68,0.4); }
    .bg-gar{ background:var(--green-soft); color:#7fd9c7; border-color:rgba(0,104,88,0.4); }
    .bg-man{ background:rgba(234,179,8,0.18); color:#fde68a; border-color:rgba(234,179,8,0.4); }
    .bg-ins{ background:rgba(59,130,246,0.18); color:#93c5fd; border-color:rgba(59,130,246,0.4); }
    .bg-rev{ background:rgba(168,85,247,0.18); color:#d8b4fe; border-color:rgba(168,85,247,0.4); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .empty-msg{ color:var(--muted); font-size:0.98rem; padding:20px 0; }

    .form-box {
      position:relative;
      overflow:hidden;
      background:#ffffff;
      color:var(--navy);
      border:1px solid rgba(16,38,59,0.08);
      border-radius:22px; padding:34px; max-width:600px; margin:44px auto 0;
      box-shadow:0 24px 60px rgba(0,0,0,0.4);
      display:none; animation: fadeIn 0.3s ease;
    }
    .form-box::before, .form-box::after{
      content:""; position:absolute; border-radius:50%; filter:blur(10px); pointer-events:none; z-index:0;
    }
    .form-box::before{
      width:340px; height:340px;
      background:radial-gradient(circle, rgba(0,104,88,0.16) 0%, transparent 70%);
      top:-130px; left:-110px;
    }
    .form-box::after{
      width:360px; height:360px;
      background:radial-gradient(circle, rgba(59,130,246,0.14) 0%, transparent 70%);
      bottom:-140px; right:-120px;
    }
    .form-box > * { position:relative; z-index:1; }
    .form-box h3{
      color:var(--navy); font-size:1.2rem; font-weight:700;
      padding-bottom:16px; margin-bottom:6px; border-bottom:2px solid #e6ebef;
    }

    label { display:block; font-size:0.72rem; font-weight:700; color:#5c6b7d; margin:18px 0 7px; text-transform:uppercase; letter-spacing:0.08em; }
    input, select, textarea {
      width:100%; padding:12px 14px; border:1px solid var(--grey); border-radius:10px;
      font-size:0.92rem; font-family:'Montserrat', sans-serif; background:#ffffff; color:var(--navy);
      transition:border-color 0.15s, box-shadow 0.15s;
      box-shadow:0 3px 10px rgba(0,104,88,0.07), 0 4px 14px rgba(59,130,246,0.06);
    }
    textarea{ resize:vertical; }
    input::placeholder, textarea::placeholder{ color:#94a3b8; }
    input:focus, select:focus, textarea:focus {
      outline:none; border-color:var(--green);
      box-shadow:0 0 0 3px var(--green-soft), 0 4px 14px rgba(59,130,246,0.1);
    }
    select{ appearance:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23006858" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'); background-repeat:no-repeat; background-position:right 14px center; background-size:16px; padding-right:38px; }
    input[readonly] { background:#f1f5f8; color:#5c6b7d; border-style:dashed; cursor:not-allowed; box-shadow:none; }
    input[type="date"], input[type="time"] { -webkit-appearance:none; appearance:none; color:var(--navy) !important; -webkit-text-fill-color:var(--navy) !important; opacity:1; }

    button.btn {
      background:var(--green); color:#fff; border:none; padding:14px;
      border-radius:10px; font-size:0.95rem; font-weight:700; width:100%; margin-top:16px;
      cursor:pointer; transition:background 0.2s, transform 0.15s; font-family:'Montserrat', sans-serif;
      letter-spacing:0.01em;
    }
    button.btn:hover { background:var(--green-dark); transform:translateY(-1px); }
    button.btn:active{ transform:translateY(0); }
    button.btn:disabled{ opacity:0.6; cursor:not-allowed; transform:none; }
    button.btn-secondary{ background:var(--navy); border:1px solid rgba(16,38,59,0.15); }
    button.btn-secondary:hover{ background:var(--navy-light); }

    button.btn-archive {
      background:transparent; color:#7fd9c7; border:1px solid rgba(0,104,88,0.5);
      padding:5px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:0.72rem;
      text-transform:uppercase; letter-spacing:0.03em; transition:background 0.15s, border-color 0.15s;
    }
    button.btn-archive:hover{ background:var(--green-soft); border-color:var(--green); }

    @media (max-width: 900px) {
      .container { max-width: 100%; }
      .form-box { max-width: 100%; }
    }

    @media (max-width: 640px) {
      .container { padding: 12px; }
      .topbar { height: 52px; padding: 0 14px; }
      .topbar img { height: 26px; }
      .btn-back { padding: 0 12px; height: 30px; font-size: 13px; border-radius: 6px; }

      .header-title { margin: 24px 0 22px; }
      .header-title h2 { font-size: 1.5rem; }

      .master-tab { min-width:100%; }
      .inc-title{ font-size:0.95rem; }

      .inc-item { padding: 14px 16px; border-radius: 14px; }

      .form-box { padding: 18px 16px; border-radius: 14px; margin-top: 30px; }
      .form-box h3 { font-size: 1.1rem; margin-bottom: 4px; padding-bottom: 8px; }
      .form-box::before { width: 220px; height: 220px; top: -90px; left: -80px; }
      .form-box::after { width: 240px; height: 240px; bottom: -100px; right: -90px; }

      label { font-size: 0.68rem; margin: 14px 0 6px; }
      input, select, textarea { padding: 11px 10px; font-size: 0.9rem; }

      button.btn { padding: 13px; font-size: 0.95rem; }
      #form-resolver > div { flex-wrap: wrap; }
      #form-resolver > div > div { min-width: 47% !important; }
    }

    @media (max-width: 380px) {
      .form-box { padding: 16px 12px; }
      #form-resolver > div { gap: 8px; }
      #form-resolver > div > div { min-width: 100% !important; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande.png" alt="Sugraf Logo" onerror="this.style.display='none'">
      <a href="/" class="btn-back">&larr; Volver</a>
    </div>

    <div class="topbar-right" id="zona-usuario" style="display:none;">
      <div class="dot"></div>
      <div class="dropdown">
        <span class="dropdown-trigger" id="user-display" onclick="toggleUserMenu()"><span id="user-name-text">Conectado</span> <span class="chev">&#9660;</span></span>
        <div id="user-menu" class="dropdown-content">
          <a href="#" onclick="cerrarSesion()">&#10162; Desconectar</a>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="header-title">
      <div class="eyebrow"><span class="dot-sm"></span> Servicio T&eacute;cnico</div>
      <h2>Mis Avisos Asignados</h2>
      <p>Consulta y gestiona los partes de trabajo de tus avisos asignados.</p>
    </div>

    <div id="master-panel" style="display:none;">
      <p class="master-intro">SELECCIONA UN T&Eacute;CNICO PARA VER SUS AVISOS EN PROGRESO:</p>
      <div id="botones-tecnicos" style="display:flex; gap:12px; flex-wrap:wrap;"></div>
    </div>

    <div id="contenedor-avisos">
      <p class="empty-msg">Buscando avisos en Avisos Tratados.xlsx...</p>
    </div>

    <div class="form-box" id="resolucion-box">
      <h3>Parte de Trabajo</h3>
      <form id="form-resolver">
        <input type="hidden" id="res_index">
        <input type="hidden" id="res_tecnico_original">
        <input type="hidden" id="res_cliente">
        <input type="hidden" id="res_poblacion">
        <input type="hidden" id="res_maquina">

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 140px;">
            <label>Modalidad de Asistencia</label>
            <select id="res_tipo_asistencia">
              <option value="Presencial">Presencial</option>
              <option value="Telemático">Telemático</option>
            </select>
          </div>
          <div style="flex: 1; min-width: 100px;" id="div_pirineos">
            <label>Pirineos</label>
            <select id="res_pirineos">
              <option value="NO">No</option>
              <option value="SI">Sí</option>
            </select>
          </div>
        </div>

        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 140px;"><label>Fecha Realización</label><input type="date" id="res_fecha"></div>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 110px;"><label>Hora Entrada</label><input type="time" id="res_hora_ent"></div>
          <div style="flex: 1; min-width: 110px;"><label>Hora Salida</label><input type="time" id="res_hora_sal"></div>
        </div>

        <label>Estado de Resolución</label>
        <select id="res_estado_resolucion">
          <option value="Pendiente">Pendiente (Se requiere otra visita)</option>
          <option value="Resuelto">Resuelto</option>
        </select>

        <label>Piezas Necesarias / Cambiadas</label>
        <textarea id="res_piezas" rows="2" placeholder="Ej: Rodillo fusor, gomas de arrastre..."></textarea>

        <label>Trabajos Realizados / Solución</label>
        <textarea id="res_solucion" rows="4" placeholder="Describe los ajustes realizados..."></textarea>

        <div style="display: flex; gap: 10px;">
          <button type="button" class="btn btn-secondary" id="btn-progreso" onclick="guardarProgreso()">Guardar Progreso</button>
          <button type="button" class="btn" id="btn-cerrar" onclick="cerrarAviso()">Cerrar Aviso Definitivo</button>
        </div>
      </form>
    </div>

  </div>

  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    if (!currentUser) window.location.href = "/";
    const TECNICOS = ["Ion Volog", "Francisco Antúnez", "Daniel Gargallo", "Emilio Arrieta"];

    document.getElementById("user-name-text").innerText = currentUser;
    document.getElementById("zona-usuario").style.display = "flex";

    function toggleUserMenu() {
        document.getElementById("user-menu").classList.toggle("show");
    }

    function cerrarSesion() {
      localStorage.removeItem("sugraf_user");
      window.location.href = "/";
    }

    window.addEventListener("click", function(event) {
        if (!event.target.closest(".dropdown")) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains("show")) {
                    dropdowns[i].classList.remove("show");
                }
            }
        }
    });

    let misAvisos = [];
    let filtroTecnicoMaster = null;

    async function cargarAvisos() {
      const box = document.getElementById('contenedor-avisos');
      try {
        const res = await fetch(`/api/adjudicados/mis-avisos?tecnico=${encodeURIComponent(currentUser)}`);
        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Error leyendo de Google Drive");
        }

        const data = await res.json();
        misAvisos = data.avisos || [];

        if (currentUser === "Master") {
            if (!filtroTecnicoMaster) filtroTecnicoMaster = TECNICOS[0];
            document.getElementById('master-panel').style.display = 'block';
            renderBotonesMaster();
        }
        renderAvisos();
      } catch (e) {
        console.error(e);
        box.innerHTML = `<p class="empty-msg" style='color:#fca5a5;'>Error: ${e.message}</p>`;
      }
    }

    function renderBotonesMaster() {
        let html = "";
        TECNICOS.forEach(t => {
            const count = misAvisos.filter(a => a['REALIZADO POR'] === t && a['ESTADO'] !== 'Cerrado').length;
            const isSelected = filtroTecnicoMaster === t;
            const activeClass = isSelected ? 'active' : '';
            html += `<button class="master-tab ${activeClass}" onclick="filtroTecnicoMaster='${t}'; renderBotonesMaster(); renderAvisos();">
                        ${t} <span>${count}</span>
                     </button>`;
        });
        document.getElementById('botones-tecnicos').innerHTML = html;
    }

    function generateCard(av) {
        let badgesHtml = "";
        if(av['URGENTE'] === 'SI') badgesHtml += `<span class="badge bg-urg">Urgente</span>`;
        if(av['GARANTÍA'] === 'SI') badgesHtml += `<span class="badge bg-gar">Garantía</span>`;
        if(av['MANTENIMIENTO'] === 'SI') badgesHtml += `<span class="badge bg-man">Mantenimiento</span>`;
        if(av['INSTALACIÓN'] === 'SI') badgesHtml += `<span class="badge bg-ins">Instalación</span>`;
        if(av['REVISAR'] === 'SI') badgesHtml += `<span class="badge bg-rev">Revisar</span>`;
        if(av['PIRINEOS'] === 'SI') badgesHtml += `<span class="badge bg-urg">Pirineos</span>`;

        let actionBtn = "";
        if (currentUser === 'Master' && av['ESTADO'] === 'Cerrado') {
            actionBtn = `<button onclick="event.stopPropagation(); archivarPirineos(${av.aviso_index})" class="btn-archive">Introducido en Pirineos</button>`;
        }

        return `
        <div class="inc-item" onclick="abrirResolucion(${av.aviso_index})">
            <div class="inc-title">
                ${av['CLIENTE']}
                ${actionBtn}
                <span style="margin-left:auto; display:flex; gap:6px; flex-wrap:wrap;">${badgesHtml}</span>
            </div>
            <div class="inc-sub"><strong>Máquina:</strong> ${av['MÁQUINA']} &nbsp;|&nbsp; <strong>Entrada:</strong> ${av['F. ENTR.']} &nbsp;|&nbsp; <strong>Técnico:</strong> ${av['REALIZADO POR']}</div>
        </div>
        `;
    }

    function renderAvisos() {
        const box = document.getElementById('contenedor-avisos');
        let abiertos = [];
        let cerrados = [];
        let noAbiertos = [];

        if (currentUser === 'Master') {
            const techAvisos = misAvisos.filter(a => a['REALIZADO POR'] === filtroTecnicoMaster);
            abiertos = techAvisos.filter(a => a['ESTADO'] === 'Abierto');
            cerrados = techAvisos.filter(a => a['ESTADO'] === 'Cerrado');
            noAbiertos = techAvisos.filter(a => !a['ESTADO'] || a['ESTADO'] === 'Vacío');
        } else {
            abiertos = misAvisos.filter(a => a['ESTADO'] === 'Abierto');
            cerrados = misAvisos.filter(a => a['ESTADO'] === 'Cerrado');
            noAbiertos = misAvisos.filter(a => !a['ESTADO'] || a['ESTADO'] === 'Vacío');
        }

        if(abiertos.length === 0 && noAbiertos.length === 0 && cerrados.length === 0){
            box.innerHTML = `<p class='empty-msg'>No hay avisos asignados a ${currentUser === 'Master' ? filtroTecnicoMaster : 'este técnico'}.</p>`;
            return;
        }

        let finalHtml = "";
        if (cerrados.length > 0) {
            finalHtml += `<div class="section-divider"><span class="dot-status closed"></span> Avisos Cerrados (Pendientes de Pirineos)</div>`;
            finalHtml += cerrados.map(av => generateCard(av)).join('');
        }
        if (abiertos.length > 0) {
            finalHtml += `<div class="section-divider"><span class="dot-status open"></span> Avisos Abiertos (En progreso)</div>`;
            finalHtml += abiertos.map(av => generateCard(av)).join('');
        }
        if (noAbiertos.length > 0) {
            finalHtml += `<div class="section-divider"><span class="dot-status pending"></span> Avisos Pendientes de Empezar</div>`;
            finalHtml += noAbiertos.map(av => generateCard(av)).join('');
        }

        box.innerHTML = finalHtml;
    }

    async function archivarPirineos(index) {
        if(!confirm("¿Confirmas que este aviso ya está introducido en Pirineos? Desaparecerá de la aplicación y se guardará en Partes Finalizados.")) return;

        try {
            const res = await fetch('/api/adjudicados/archivar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ aviso_index: index })
            });

            if (!res.ok) {
                const errData = await res.json();
                throw new Error(errData.detail || `Error HTTP: ${res.status}`);
            }

            alert("Aviso archivado correctamente en Partes Finalizados.");
            cargarAvisos();
        } catch (err) {
            alert(`Error al archivar el aviso: ${err.message}`);
            console.error(err);
        }
    }

    function abrirResolucion(index) {
      const av = misAvisos.find(a => a.aviso_index === index);
      if(!av) return;

      document.getElementById('resolucion-box').style.display = 'block';
      document.getElementById('res_index').value = index;
      document.getElementById('res_tecnico_original').value = av['REALIZADO POR'];
      document.getElementById('res_cliente').value = av['CLIENTE'];
      document.getElementById('res_maquina').value = av['MÁQUINA'];
      document.getElementById('res_poblacion').value = av['POBLACIÓN'];

      if (currentUser !== 'Master') {
          document.getElementById('div_pirineos').style.display = 'none';
      } else {
          document.getElementById('div_pirineos').style.display = 'block';
      }

      document.getElementById('res_tipo_asistencia').value = av['TIPO ASISTENCIA'] || 'Presencial';
      document.getElementById('res_pirineos').value = av['PIRINEOS'] || 'NO';

      let f = av['FECHA REALIZACIÓN'];
      document.getElementById('res_fecha').value = f && f.includes('-') ? f.substring(0, 10) : new Date().toISOString().split('T')[0];

      let hent = av['HORA ENTRADA'];
      document.getElementById('res_hora_ent').value = hent ? String(hent).substring(0, 5) : '';

      let hsal = av['HORA SALIDA'];
      document.getElementById('res_hora_sal').value = hsal ? String(hsal).substring(0, 5) : '';

      document.getElementById('res_estado_resolucion').value = av['RESUELTO O PENDIENTE'] || 'Pendiente';
      document.getElementById('res_piezas').value = av['PIEZAS NECESARIAS'] || '';
      document.getElementById('res_solucion').value = av['SOLUCIÓN'] || '';

      setTimeout(() => { document.getElementById('resolucion-box').scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 100);
    }

    function buildPayload() {
        return {
            aviso_index: parseInt(document.getElementById('res_index').value),
            tipo_asistencia: document.getElementById('res_tipo_asistencia').value,
            pirineos: document.getElementById('res_pirineos').value,
            fecha_realizacion: document.getElementById('res_fecha').value,
            hora_entrada: document.getElementById('res_hora_ent').value,
            hora_salida: document.getElementById('res_hora_sal').value,
            resuelto_pendiente: document.getElementById('res_estado_resolucion').value,
            piezas: document.getElementById('res_piezas').value,
            solucion: document.getElementById('res_solucion').value,
            cliente: document.getElementById('res_cliente').value,
            poblacion: document.getElementById('res_poblacion').value,
            maquina: document.getElementById('res_maquina').value,
            tecnico: document.getElementById('res_tecnico_original').value
        };
    }

    async function guardarProgreso() {
      const btn = document.getElementById('btn-progreso');
      btn.innerText = "Guardando..."; btn.disabled = true;

      try {
        const res = await fetch('/api/adjudicados/guardar-progreso', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(buildPayload())
        });

        if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || `Error HTTP: ${res.status}`);
        }

        alert("Progreso guardado. El aviso ahora está ABIERTO.");
        document.getElementById('resolucion-box').style.display = 'none';
        cargarAvisos();
      } catch (err) {
        alert(`Error al guardar: ${err.message}`);
        console.error(err);
      }

      btn.innerText = "Guardar Progreso"; btn.disabled = false;
    }

    async function cerrarAviso() {
      if(!document.getElementById('res_hora_ent').value || !document.getElementById('res_hora_sal').value || !document.getElementById('res_solucion').value) {
          alert("Para cerrar un aviso debes rellenar obligatoriamente la hora de entrada, salida y la solución.");
          return;
      }

      if(!confirm("¿Estás seguro de que quieres CERRAR definitivamente este aviso? Se pasará a la lista de cerrados.")) return;

      const btn = document.getElementById('btn-cerrar');
      btn.innerText = "Procesando..."; btn.disabled = true;

      try {
        const res = await fetch('/api/adjudicados/resolver', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(buildPayload())
        });

        if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || `Error HTTP: ${res.status}`);
        }

        alert("Aviso marcado como cerrado con éxito.");
        document.getElementById('resolucion-box').style.display = 'none';
        cargarAvisos();
      } catch (err) {
        alert(`Error al cerrar el aviso: ${err.message}`);
        console.error(err);
      }

      btn.innerText = "Cerrar Aviso Definitivo"; btn.disabled = false;
    }

    cargarAvisos();
  </script>
</body>
</html>
