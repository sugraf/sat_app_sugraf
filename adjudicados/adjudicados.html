<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mis Avisos Adjudicados</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        font-family: 'Inter', sans-serif; 
        background-color: #070e1c; 
        background-image: radial-gradient(800px circle at 20% 0%, rgba(47, 111, 176, 0.25) 0%, transparent 100%), 
                          radial-gradient(800px circle at 85% 20%, rgba(79, 156, 217, 0.15) 0%, transparent 100%); 
        background-attachment: fixed; 
        color: #f4f8fc; 
        min-height: 100vh; 
        padding: 20px;
    }
    h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
    
    .topbar { 
        background: #ffffff; 
        height: 60px; 
        display: flex; 
        align-items: center; 
        padding: 0 20px; 
        justify-content: space-between; 
        border-radius: 8px; 
        margin-bottom: 20px; 
        position: sticky; 
        top: 0; 
        z-index: 100; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .topbar-left { display: flex; align-items: center; gap: 15px; height: 100%; }
    .topbar img { height: 35px; object-fit: contain; display: block; }
    .btn-back { 
        background: #f1f5f9; 
        border: 1px solid #cbd5e1; 
        padding: 0 15px; 
        height: 35px; 
        border-radius: 6px; 
        font-weight: 600; 
        color: #1e293b !important; 
        cursor: pointer; 
        display: inline-flex; 
        align-items: center; 
        justify-content: center; 
        text-decoration: none; 
        font-size: 14px; 
        transition: 0.2s; 
        box-sizing: border-box; 
    }
    .btn-back:hover { background: #e2e8f0; }
    
    .container { max-width: 900px; margin: 0 auto; }
    
    .header-title h2 { 
        margin-bottom: 25px; 
        color: white; 
        border-bottom: 1px solid rgba(255,255,255,0.2); 
        padding-bottom: 10px; 
    }
    
    .master-tab {
        background: #152847;
        color: white;
        border: 1px solid rgba(79,156,217,0.3);
        padding: 12px 18px;
        border-radius: 8px;
        flex: 1;
        min-width: 140px;
        cursor: pointer;
        font-weight: 600;
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
        transition: all 0.2s;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
    }
    .master-tab:hover { background: #1c3357; border-color: rgba(79,156,217,0.6); }
    .master-tab.active { background: #4f9cd9; border-color: #4f9cd9; box-shadow: 0 4px 10px rgba(79, 156, 217, 0.3); }
    .master-tab span { background: rgba(0,0,0,0.25); padding: 2px 8px; border-radius: 12px; font-size: 0.8rem;}

    .inc-item { 
        background: #f8fafc; 
        border: 1px solid #e2e8f0; 
        padding: 18px; 
        border-radius: 12px; 
        margin-bottom: 12px; 
        transition: all 0.2s; 
        text-align: left; 
        cursor: pointer; 
        animation: fadeIn 0.3s ease;
        box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
    .inc-item:hover { 
        border-color: #4f9cd9; 
        background: #eff6ff; 
        transform: translateY(-2px); 
        box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }
    .inc-title { font-weight: 700; color: #0f1e35; font-size: 1.05rem; display: flex; align-items: center; flex-wrap:wrap; gap: 8px;}
    .inc-sub { color: #64748b; font-size: 0.85rem; margin-top: 6px; }
    
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.7rem; font-weight: bold; text-transform: uppercase;}
    .bg-urg { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
    .bg-gar { background: #dcfce7; color: #15803d; border: 1px solid #86efac; }
    .bg-man { background: #fef9c3; color: #166534; border: 1px solid #fde047; }
    .bg-ins { background: #e0e7ff; color: #1d4ed8; border: 1px solid #93c5fd; }
    .bg-rev { background: #f3e8ff; color: #4338ca; border: 1px solid #c4b5fd; }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Formulario Blanco del Detalle */
    .form-box { 
        background: white; 
        border-radius: 16px; 
        padding: 30px; 
        color: #1e293b; 
        max-width: 600px; 
        margin: 40px auto 0; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
        display: none; 
        animation: fadeIn 0.3s ease;
    }
    .form-box h3 { margin-bottom: 25px; color: #0f1e35; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;}
    
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin: 15px 0 6px; text-transform: uppercase; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; font-family: 'Inter', sans-serif; background: #f8fafc; transition: 0.2s;}
    input:focus, select:focus, textarea:focus { outline: none; border-color: #4f9cd9; background: #fff; }
    input[readonly] { background: #e2e8f0; color: #64748b; border: 1px dashed #cbd5e1; cursor: not-allowed;}
    
    input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; min-width: 0; color: #1e293b !important; -webkit-text-fill-color: #1e293b !important; opacity: 1; }
    
    button.btn { background: #4f9cd9; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600; width: 100%; margin-top: 25px; cursor: pointer; transition: 0.2s; font-family: 'Inter', sans-serif; }
    button.btn:hover { background: #2f6fb0; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(79, 156, 217, 0.3);}
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande_azul.png" alt="Sugraf Logo">
      <a href="/" class="btn-back">Volver</a>
    </div>
  </div>

  <div class="container">
    <div class="header-title">
      <h2>Mis Avisos Adjudicados</h2>
    </div>

    <!-- Panel de botones para MASTER -->
    <div id="master-panel" style="display:none; margin-bottom: 25px;">
      <p style="font-size:0.85rem; color:#a9bcd6; margin-bottom:12px; text-transform: uppercase; font-weight: bold; letter-spacing: 0.5px;">Selecciona un técnico para ver sus avisos:</p>
      <div id="botones-tecnicos" style="display:flex; gap:12px; flex-wrap:wrap;"></div>
    </div>
    
    <div id="contenedor-avisos">
      <p style='color:white; font-size:1.1rem;'>Buscando avisos...</p>
    </div>

    <div class="form-box" id="resolucion-box">
      <h3>Resolución de Aviso</h3>
      <form id="form-resolver">
        <input type="hidden" id="res_index">
        <input type="hidden" id="res_tecnico_original">
        
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 140px;"><label>Fecha Intervención</label><input type="date" id="res_fecha" readonly></div>
          <div style="flex: 1; min-width: 110px;"><label>Hora Inicio</label><input type="time" id="res_hora" readonly></div>
        </div>
        
        <label>Tipo de Asistencia</label>
        <select id="res_tipo">
          <option value="Visita">Visita presencial</option>
          <option value="Taller">Taller / Remoto</option>
        </select>
        
        <label>Cliente</label>
        <input type="text" id="res_cliente" readonly>
        <label>Dirección / Población</label>
        <input type="text" id="res_poblacion" readonly>
        <label>Máquina / Anomalía Reportada</label>
        <input type="text" id="res_maquina" readonly>
        
        <label>Trabajos Realizados / Solución</label>
        <textarea id="res_solucion" rows="4" required placeholder="Describe las piezas cambiadas o ajustes realizados..."></textarea>
        
        <button type="submit" class="btn" id="btn-resolver">Guardar y Cerrar Aviso</button>
      </form>
    </div>

  </div>

  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    if (!currentUser) window.location.href = "/";
    const TECNICOS = ["Ion Volog", "Francisco Antúnez", "Daniel Gargallo", "Emilio Arrieta"];
    
    let misAvisos = [];
    let filtroTecnicoMaster = null;

    async function cargarAvisos() {
      const box = document.getElementById('contenedor-avisos');
      try {
        const res = await fetch(`/api/adjudicados/mis-avisos?tecnico=${encodeURIComponent(currentUser)}`);
        const data = await res.json();
        misAvisos = data.avisos || [];
        
        if (currentUser === "master") {
            document.getElementById('master-panel').style.display = 'block';
            renderBotonesMaster();
        }
        renderAvisos();
      } catch (e) { box.innerHTML = "<p style='color:red;'>Error de conexión.</p>"; }
    }

    function renderBotonesMaster() {
        let html = "";
        TECNICOS.forEach(t => {
            const count = misAvisos.filter(a => a['REALIZADO POR'] === t).length;
            const isSelected = filtroTecnicoMaster === t;
            const activeClass = isSelected ? 'active' : '';
            html += `<button class="master-tab ${activeClass}" onclick="filtroTecnicoMaster='${t}'; renderBotonesMaster(); renderAvisos();">
                        ${t} <span>${count}</span>
                     </button>`;
        });
        document.getElementById('botones-tecnicos').innerHTML = html;
    }

    function renderAvisos() {
        const box = document.getElementById('contenedor-avisos');
        let aMostrar = misAvisos;
        
        if (currentUser === 'master') {
            if (filtroTecnicoMaster) {
                aMostrar = misAvisos.filter(a => a['REALIZADO POR'] === filtroTecnicoMaster);
            } else {
                box.innerHTML = "<p style='color:#a9bcd6; font-size:1.1rem;'>Por favor, selecciona a un técnico de la botonera superior para visualizar sus avisos en curso.</p>";
                return;
            }
        }

        if(aMostrar.length === 0){
            box.innerHTML = "<p style='color:#a9bcd6; font-size:1.1rem;'>No hay avisos asignados a este técnico en este momento.</p>";
        } else {
            box.innerHTML = aMostrar.map(av => {
                let badgesHtml = "";
                if(av['URGENTE'] === 'SI') badgesHtml += `<span class="badge bg-urg">Urgente</span>`;
                if(av['GARANTÍA'] === 'SI') badgesHtml += `<span class="badge bg-gar">Garantía</span>`;
                if(av['MANTENIMIENTO'] === 'SI') badgesHtml += `<span class="badge bg-man">Mantenimiento</span>`;
                if(av['INSTALACIÓN'] === 'SI') badgesHtml += `<span class="badge bg-ins">Instalación</span>`;
                if(av['REVISAR'] === 'SI') badgesHtml += `<span class="badge bg-rev">Revisar</span>`;

                return `
                <div class="inc-item" onclick="abrirResolucion(${av.aviso_index}, '${av['CLIENTE']}', '${av['MÁQUINA']}', '${av['POBLACIÓN']}', '${av['REALIZADO POR']}')">
                    <div class="inc-title">${av['CLIENTE']} ${badgesHtml}</div>
                    <div class="inc-sub"><strong>Máquina:</strong> ${av['MÁQUINA']} &nbsp;|&nbsp; <strong>Entrada:</strong> ${av['F. ENTR.']}</div>
                </div>
                `;
            }).join('');
        }
    }

    function abrirResolucion(index, c, m, p, tecnicoAsignado) {
      document.getElementById('resolucion-box').style.display = 'block';
      document.getElementById('res_index').value = index;
      document.getElementById('res_tecnico_original').value = tecnicoAsignado;
      document.getElementById('res_cliente').value = c;
      document.getElementById('res_maquina').value = m;
      document.getElementById('res_poblacion').value = p;

      const now = new Date();
      document.getElementById('res_fecha').value = now.toISOString().split('T')[0];
      document.getElementById('res_hora').value = now.toTimeString().split(' ')[0].substring(0, 5);
      
      setTimeout(() => { document.getElementById('resolucion-box').scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 100);
    }

    document.getElementById('form-resolver').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn = document.getElementById('btn-resolver');
      btn.innerText = "Procesando..."; btn.disabled = true;

      const payload = {
        aviso_index: parseInt(document.getElementById('res_index').value),
        fecha: document.getElementById('res_fecha').value,
        hora: document.getElementById('res_hora').value,
        tipo_visita: document.getElementById('res_tipo').value,
        cliente: document.getElementById('res_cliente').value,
        poblacion: document.getElementById('res_poblacion').value,
        maquina: document.getElementById('res_maquina').value,
        tecnico: document.getElementById('res_tecnico_original').value,
        solucion: document.getElementById('res_solucion').value
      };

      try {
        await fetch('/api/adjudicados/resolver', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        alert("Aviso finalizado con éxito. Parte generado.");
        document.getElementById('form-resolver').reset();
        document.getElementById('resolucion-box').style.display = 'none';
        cargarAvisos();
      } catch (err) { alert("Error al guardar el aviso."); }

      btn.innerText = "Guardar y Cerrar Aviso"; btn.disabled = false;
    });

    cargarAvisos();
  </script>
</body>
</html>
