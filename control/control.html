<!-- control/control.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10263B">
  <title>Control IA - Sugraf Digital Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui-common.css">
  <style>
    :root{
      --navy:#10263B;
      --navy-light:#173654;
      --green:#006858;
      --green-soft:rgba(0,104,88,0.15);
      --ink:#f4f8fc;
      --muted:#a9bcd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Montserrat', sans-serif;
        background-color: var(--navy);
        background-image: radial-gradient(900px circle at 15% -5%, rgba(0,104,88,0.28) 0%, transparent 55%), radial-gradient(900px circle at 90% 10%, rgba(182,190,196,0.10) 0%, transparent 55%);
        background-attachment: fixed;
        color: var(--ink);
        height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .topbar {
      background:#ffffff; height:64px; display:flex; align-items:center; padding:0 24px; justify-content:space-between; flex-shrink:0;
      box-shadow:0 1px 0 rgba(16,38,59,0.08), 0 4px 16px rgba(16,38,59,0.04);
    }
    .topbar-left{ display:flex; align-items:center; gap:16px; }
    .topbar img{ height:35px; }
    .btn-back{ color:#4a5a72; text-decoration:none; font-weight:600; font-size:0.85rem; padding:8px 14px; border-radius:10px; border:1px solid #e2e8f0; }
    .btn-back:hover{ background:#f1f5f8; }
    .topbar-right { color:#4a5a72; font-size:13px; font-weight:600; display:flex; align-items:center; gap:9px; }
    .dot { width:8px; height:8px; background:var(--green); border-radius:50%; box-shadow:0 0 0 4px var(--green-soft); }

    .container { width:100%; max-width:860px; margin:0 auto; padding:20px; flex:1; display:flex; flex-direction:column; min-height:0; }
    .intro{ text-align:center; margin:6px 0 16px; }
    .intro h2{ font-size:1.6rem; margin-bottom:6px; }
    .intro p{ color:var(--muted); font-size:0.88rem; }
    #bot-embebido{ flex:1; min-height:0; }

    @media (max-width: 560px) {
      .topbar { height:52px; padding:0 14px; }
      .topbar img { height:26px; }
      .container{ padding:10px; }
      .intro h2{ font-size:1.25rem; }
      .intro p{ display:none; }
    }
  </style>
</head>
<body>
  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    if (!currentUser || currentUser.toLowerCase() !== "master") {
        window.location.href = "/";
    }
  </script>
  <script src="/ui-common.js"></script>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande.png" alt="Sugraf Logo" onerror="this.style.display='none'">
      <a href="/" class="btn-back">&larr; Volver</a>
    </div>
    <div class="topbar-right"><div class="dot"></div><span>Master</span></div>
  </div>

  <div class="container">
    <div class="intro">
      <h2>Control IA</h2>
      <p>Pregunta por los avisos abiertos, el reparto entre técnicos o cualquier avería del histórico.</p>
    </div>
    <div id="bot-embebido"></div>
  </div>

  <script src="/chatbot.js"></script>
</body>
</html>
