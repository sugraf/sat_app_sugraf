<!-- control/control.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10263B">
  <title>Control IA - Sugraf Digital Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#10263B;
      --navy-dark:#0a1826;
      --navy-light:#173654;
      --green:#006858;
      --green-dark:#004d40;
      --green-soft:rgba(0,104,88,0.15);
      --ink:#f4f8fc;
      --muted:#a9bcd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Montserrat', sans-serif;
        background-color: var(--navy);
        background-image: radial-gradient(900px circle at 15% -5%, rgba(0,104,88,0.28) 0%, transparent 55%), radial-gradient(900px circle at 90% 10%, rgba(182,190,196,0.10) 0%, transparent 55%);
        background-attachment: fixed;
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .topbar {
      background:#ffffff; height:64px; display:flex; align-items:center; padding:0 24px; justify-content:space-between;
      position:sticky; top:0; z-index:100;
    }
    .topbar-left{ display:flex; align-items:center; gap:16px; }
    .topbar img{ height:35px; }
    .btn-back{ color:#4a5a72; text-decoration:none; font-weight:600; font-size:0.85rem; padding:8px 14px; border-radius:10px; border:1px solid #e2e8f0; }
    
    .container { max-width: 800px; margin: 30px auto; padding: 20px; flex: 1; display: flex; flex-direction: column; }
    
    .toggle-bar { display: flex; gap: 10px; margin-bottom: 20px; }
    .toggle-btn {
        flex: 1; padding: 12px; border: 1px solid rgba(182,190,196,0.2); border-radius: 10px;
        background: var(--navy-light); color: var(--muted); font-weight: 600; font-family: 'Montserrat'; cursor: pointer; transition: 0.2s;
    }
    .toggle-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
    
    .recommendation {
        background: var(--green-soft); color: #7fd9c7; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 20px; border: 1px solid rgba(0,104,88,0.3); text-align: center;
    }

    .chat-box {
        flex: 1; background: var(--navy-dark); border: 1px solid rgba(182,190,196,0.1); border-radius: 16px; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; max-height: 500px;
    }
    
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; }
    .msg.user { align-self: flex-end; background: var(--green); color: #fff; border-bottom-right-radius: 2px; }
    .msg.ai { align-self: flex-start; background: var(--navy-light); color: var(--ink); border-bottom-left-radius: 2px; border: 1px solid rgba(182,190,196,0.1); }

    .input-area { display: flex; gap: 10px; margin-top: 20px; }
    .input-area input {
        flex: 1; padding: 14px; border-radius: 10px; border: 1px solid rgba(182,190,196,0.3); background: var(--navy-dark); color: #fff; font-family: 'Montserrat'; font-size: 0.95rem; outline: none;
    }
    .input-area input:focus { border-color: var(--green); }
    .input-area button {
        padding: 0 24px; background: var(--green); color: #fff; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: 0.2s; font-family: 'Montserrat';
    }
    .input-area button:hover { background: var(--green-dark); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande.png" alt="Sugraf Logo">
      <a href="/" class="btn-back">&larr; Volver</a>
    </div>
  </div>

  <div class="container">
    <div class="toggle-bar">
      <button class="toggle-btn active" id="btn-abiertos" onclick="setMode('abiertos')">Avisos Abiertos</button>
      <button class="toggle-btn" id="btn-historicos" onclick="setMode('historicos')">Históricos (Cerrados)</button>
    </div>

    <div class="recommendation" id="rec-text">
      Para abiertos: Puedes preguntar cuál sería la mejor ruta para los técnicos.
    </div>

    <div class="chat-box" id="chat-content">
      <div class="msg ai">Hola, Master. Estoy listo para consultar los excels. ¿En qué puedo ayudarte?</div>
    </div>

    <div class="input-area">
      <input type="text" id="chat-input" placeholder="Escribe tu consulta aquí..." onkeypress="if(event.key === 'Enter') sendQuery()">
      <button onclick="sendQuery()">Enviar</button>
    </div>
  </div>

  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    // Corrected condition to account for uppercase 'Master' saved in localStorage
    if (!currentUser || currentUser.toLowerCase() !== "master") {
        window.location.href = "/";
    }

    let currentMode = "abiertos";

    function setMode(mode) {
        currentMode = mode;
        document.getElementById("btn-abiertos").classList.toggle("active", mode === "abiertos");
        document.getElementById("btn-historicos").classList.toggle("active", mode === "historicos");
        
        if (mode === "abiertos") {
            document.getElementById("rec-text").innerText = "Para abiertos: Puedes preguntar cuál sería la mejor ruta para los técnicos.";
        } else {
            document.getElementById("rec-text").innerText = "Para históricos: Por favor, indica fechas (ej: de cuando a cuando) o si quieres buscar en todos.";
        }
    }

    async function sendQuery() {
        const inputStr = document.getElementById("chat-input").value.trim();
        if (!inputStr) return;

        const chatContent = document.getElementById("chat-content");
        chatContent.innerHTML += `<div class="msg user">${inputStr}</div>`;
        document.getElementById("chat-input").value = "";
        
        const loadingId = "load-" + Date.now();
        chatContent.innerHTML += `<div class="msg ai" id="${loadingId}">Consultando...</div>`;
        chatContent.scrollTop = chatContent.scrollHeight;

        try {
            const res = await fetch("/api/control/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: inputStr, mode: currentMode })
            });
            const data = await res.json();
            document.getElementById(loadingId).innerText = data.reply || "Error en la respuesta.";
        } catch (e) {
            document.getElementById(loadingId).innerText = "Error de conexión.";
        }
        chatContent.scrollTop = chatContent.scrollHeight;
    }
  </script>
</body>
</html>
