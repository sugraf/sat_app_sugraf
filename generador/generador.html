<!-- generador.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Introducir Aviso - Sugraf SAT</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui-common.css">
  <style>
    :root{
      --navy:#10263B;
      --navy-dark:#0a1826;
      --navy-light:#173654;
      --green:#006858;
      --green-dark:#004d40;
      --green-soft:rgba(0,104,88,0.15);
      --grey:#B6BEC4;
      --ink:#f4f8fc;
      --muted:#a9bcd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        font-family: 'Montserrat', sans-serif; 
        background-color: var(--navy); 
        background-image: radial-gradient(800px circle at 20% 0%, rgba(0, 104, 88, 0.15) 0%, transparent 100%), 
                          radial-gradient(800px circle at 85% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 100%); 
        background-attachment: fixed; 
        color: var(--ink); 
        min-height: 100vh; 
        padding: 20px;
    }
    h1, h2, h3 { font-family: 'Montserrat', sans-serif; font-weight: 700; }
    
    .topbar { background: #ffffff; height: 60px; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; border-radius: 8px; margin-bottom: 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .topbar-left { display: flex; align-items: center; gap: 15px; height: 100%; }
    .topbar img { height: 35px; object-fit: contain; display: block; }

    .btn-back{
      display:flex; align-items:center; gap:6px;
      color:#4a5a72; text-decoration:none; font-weight:600; font-size:0.85rem;
      padding:8px 14px; border-radius:10px; border:1px solid #e2e8f0;
      transition:background 0.15s, border-color 0.15s;
    }
    .btn-back:hover{ background:#f1f5f8; border-color:#cbd5e1; }

    .topbar-right { color:#4a5a72; font-size:13px; font-weight:600; display:flex; align-items:center; gap:9px; }
    .dot { width:8px; height:8px; background:var(--green); border-radius:50%; box-shadow:0 0 0 4px var(--green-soft); }

    .dropdown { position:relative; display:inline-block; cursor:pointer; }
    .dropdown-trigger{ display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:10px; transition:background 0.15s; }
    .dropdown-trigger:hover{ background:#f1f5f8; }
    .chev{ font-size:9px; color:#94a3b8; transition:transform 0.15s; }
    .dropdown-content {
      display:none; position:absolute; right:0; background:#ffffff;
      min-width:170px; box-shadow:0 12px 28px rgba(16,38,59,0.18);
      z-index:1; border-radius:12px; overflow:hidden; margin-top:10px;
      border:1px solid #eef2f5;
    }
    .dropdown-content a {
      color:#ef4444; padding:13px 16px; text-decoration:none; display:flex;
      align-items:center; gap:8px; font-weight:600; font-size:0.88rem;
    }
    .dropdown-content a:hover { background:#fef2f2; }
    .show { display:block; animation:dropIn 0.15s ease; }
    @keyframes dropIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }
    
    .container { max-width: 900px; margin: 0 auto;}
    
    .form-box {
        position: relative;
        overflow: hidden;
        background: #ffffff;
        border-radius: 16px;
        padding: 25px;
        color: var(--navy);
        max-width: 600px;
        margin: 0 auto;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        animation: fadeIn 0.3s ease;
    }
    .form-box::before, .form-box::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(10px);
        pointer-events: none;
        z-index: 0;
    }
    .form-box::before {
        width: 320px; height: 320px;
        background: radial-gradient(circle, rgba(0,104,88,0.16) 0%, transparent 70%);
        top: -120px; left: -100px;
    }
    .form-box::after {
        width: 340px; height: 340px;
        background: radial-gradient(circle, rgba(59,130,246,0.14) 0%, transparent 70%);
        bottom: -130px; right: -110px;
    }
    .form-box > * { position: relative; z-index: 1; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .form-box h2 { margin-bottom: 20px; color: var(--navy); border-bottom: 2px solid #e6ebef; padding-bottom: 10px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #5c6b7d; margin: 15px 0 5px; text-transform: uppercase; }
    input, select, textarea {
        width: 100%; padding: 12px; border: 1px solid var(--grey); border-radius: 8px;
        font-size: 0.95rem; font-family: 'Montserrat', sans-serif; background: #ffffff; transition: 0.2s; color: var(--navy);
        box-shadow: 0 3px 10px rgba(0,104,88,0.07), 0 4px 14px rgba(59,130,246,0.06);
    }
    input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--green); background: #fff;
        box-shadow: 0 0 0 3px var(--green-soft), 0 4px 14px rgba(59,130,246,0.1);
    }
    
    input[type="date"], input[type="time"] { 
      -webkit-appearance: none; 
      appearance: none; 
      min-width: 0; 
      color: var(--navy) !important; 
      -webkit-text-fill-color: var(--navy) !important; 
      opacity: 1; 
    }
    
    .checkbox-group { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
    .checkbox-item { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; color: var(--navy); font-weight: 500; }
    .checkbox-item input { width: auto; margin: 0; accent-color: var(--green); width: 18px; height: 18px; }

    button.btn { background: var(--green); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600; width: 100%; margin-top: 25px; cursor: pointer; transition: 0.2s; font-family: 'Montserrat', sans-serif; }
    button.btn:hover { background: var(--green-dark); }
    
    .custom-select-wrapper { position: relative; margin-bottom: 14px; }
    .custom-select-wrapper input { margin-bottom: 0; width: 100%; padding-right: 30px; }
    .custom-select-wrapper::after { content: '▼'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: var(--green); pointer-events: none; }
    .custom-select-list { display: none; position: absolute; z-index: 1000; top: calc(100% - 2px); left: 0; right: 0; background: #ffffff; border: 1px solid var(--grey); border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; max-height: 220px; overflow-y: auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .custom-select-list.show { display: block; }
    .custom-select-item { padding: 12px 16px; font-size: 0.95rem; color: var(--navy); cursor: pointer; border-bottom: 1px solid #e6ebef; }
    .custom-select-item:hover { background: var(--green-soft); color: var(--green); }
    .custom-select-item .item-sub { display: block; margin-top: 2px; font-size: 0.78rem; color: #64748b; }
    .custom-select-item:hover .item-sub { color: var(--green); }

    .pill { background: #e6ebef; color: var(--navy); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; border: 1px solid var(--grey);}
    .pill b { cursor: pointer; color: #c0392b; font-size: 1rem; transition: color 0.2s;}
    .pill b:hover { color: #922b21; }
    .pill .pill-serie { font-size: 0.75rem; font-weight: 400; color: #64748b; }

    @media (max-width: 900px) {
      .container { max-width: 100%; }
      .form-box { max-width: 100%; }
    }
    @media (max-width: 640px) {
      body { padding: 12px; }
      .topbar { height: 52px; padding: 0 14px; border-radius: 10px; margin-bottom: 14px; }
      .topbar img { height: 26px; }
      .btn-back { height: 30px; padding: 0 12px; font-size: 13px; border-radius: 6px; }

      .form-box { padding: 18px 16px; border-radius: 14px; }
      .form-box h2 { font-size: 1.1rem; margin-bottom: 16px; padding-bottom: 8px; }
      .form-box::before { width: 220px; height: 220px; top: -90px; left: -80px; }
      .form-box::after { width: 240px; height: 240px; bottom: -100px; right: -90px; }

      label { font-size: 0.75rem; margin: 12px 0 5px; }
      input, select, textarea { padding: 11px 10px; font-size: 0.9rem; }

      .field-row { flex-wrap: wrap; }
      .field-row > div { min-width: 47% !important; }

      .maquina-row { gap: 8px; }
      .maquina-row .custom-select-wrapper { min-width: 0; }
      .btn-add-maquina { padding: 0 14px !important; font-size: 1.2rem !important; flex-shrink: 0; }

      .checkbox-group { gap: 10px 16px; }
      .checkbox-item { font-size: 0.85rem; }

      .pill { font-size: 0.8rem; padding: 5px 10px; }
      .custom-select-item { padding: 11px 14px; font-size: 0.9rem; }

      button.btn { padding: 13px; font-size: 0.95rem; }
    }
    @media (max-width: 380px) {
      .form-box { padding: 16px 12px; }
      .field-row { gap: 8px; }
      .field-row > div { min-width: 100% !important; }
    }
  </style>
</head>
<body>
  <script src="/ui-common.js"></script>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande.png" alt="Sugraf Logo">
      <a href="/sat" class="btn-back">&larr; Volver</a>
    </div>

    <div class="topbar-right" id="zona-usuario" style="display:none;">
      <div class="dot"></div>
      <div class="dropdown">
        <span class="dropdown-trigger" id="user-display" onclick="toggleUserMenu()"><span id="user-name-text">Conectado</span> <span class="chev">&#9660;</span></span>
        <div id="user-menu" class="dropdown-content">
          <a href="#" onclick="cerrarSesion()">&#10162; Desconectar</a>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="form-box">
      <h2>Nuevo Aviso</h2>
      <form id="form-nuevo-aviso">
        <div class="field-row" style="display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 140px;"><label>Fecha Entrada</label><input type="date" id="ni_fecha" required style="margin-bottom:0;"></div>
          <div style="flex: 1; min-width: 110px;"><label>Hora</label><input type="time" id="ni_hora" required style="margin-bottom:0;"></div>
        </div>
        
        <label>Cliente</label>
        <div class="custom-select-wrapper">
          <input type="text" id="ni_cliente" autocomplete="off" required placeholder="Escribe para buscar o desplegar...">
          <div id="dropdown-clientes" class="custom-select-list"></div>
        </div>
        
        <label>Población / Dirección</label>
        <input type="text" id="ni_poblacion" required>

        <label>Máquina(s)</label>
        <div class="maquina-row" style="display: flex; gap: 10px;">
          <div class="custom-select-wrapper" style="flex: 1; margin-bottom: 0;">
            <input type="text" id="ni_maquina" autocomplete="off" placeholder="Selecciona o escribe máquina...">
            <div id="dropdown-maquinas" class="custom-select-list"></div>
          </div>
          <button type="button" class="btn btn-add-maquina" style="width: auto; margin: 0; padding: 0 20px; font-size: 1.4rem;" onclick="addMaquinaManual()">+</button>
        </div>
        <div id="maquinas-seleccionadas" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; margin-bottom: 14px;"></div>

        <label>Explicar la Incidencia</label>
        <textarea id="ni_desc" rows="3" required data-dictado placeholder="Detalla el problema o anomalía reportada..."></textarea>

        <div id="zona-asignado" style="display:none;">
          <label>Asignado a</label>
          <select id="ni_asignado"></select>
        </div>

        <label>Etiquetas</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" id="ni_nuevo" checked> Nuevo</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_urg"> Urgente</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_parado"> Parado</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_reclama"> Reclama</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_pre"> Presupuesto</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_piezas"> Piezas</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_gar"> Garantía</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_man"> Mantenimiento</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_ins"> Instalación</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_rev"> Revisar</label>
        </div>

        <button type="submit" class="btn" id="btn-save-inc">Crear Aviso</button>
      </form>
    </div>
  </div>

  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    if (!currentUser) window.location.href = "/sat";
    if (currentUser === "Solo Visualizar") {
        appAlert("Tu perfil no puede crear avisos.", {type: 'error'}).then(() => { window.location.href = "/sat"; });
    }

    document.getElementById("user-name-text").innerText = currentUser;

    // «Asignado a»: Master puede asignar el aviso a cualquier técnico; un técnico, a sí mismo. Si se deja en
    // «Sin asignar», el aviso queda sin asignar como siempre (para repartirlo en el organizador).
    const TECNICOS_ASIGNABLES = ["Ion Volog", "Francisco Antúnez", "Daniel Gargallo", "Técnico 4"];
    const opcionesAsignado = currentUser === "Master" ? TECNICOS_ASIGNABLES : TECNICOS_ASIGNABLES.includes(currentUser) ? [currentUser] : [];
    if (opcionesAsignado.length) {
      document.getElementById("ni_asignado").innerHTML = '<option value="">Sin asignar</option>' +
        opcionesAsignado.map(t => `<option value="${t}">${t}${t === currentUser ? ' (yo)' : ''}</option>`).join('');
      document.getElementById("zona-asignado").style.display = "";
    }
    document.getElementById("zona-usuario").style.display = "flex";

    function toggleUserMenu() {
        document.getElementById("user-menu").classList.toggle("show");
    }

    window.addEventListener("click", function(event) {
        if (!event.target.closest(".dropdown")) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains("show")) {
                    dropdowns[i].classList.remove("show");
                }
            }
        }
    });

    function cerrarSesion() {
      localStorage.removeItem("sugraf_user");
      sessionStorage.removeItem("sugraf_bot_conversacion");
      window.location.href = "/sat";
    }

    let dbEquipos = {};
    let maquinasSel = [];

    function normalizarCliente(texto) {
        return String(texto || "")
            .replace(/[\u200B-\u200D\uFEFF]/g, "")
            .replace(/\s+/g, " ")
            .trim()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-zA-Z0-9\s]/g, "") 
            .toLowerCase();
    }

    function buscarCliente(texto) {
        const buscado = normalizarCliente(texto);
        if (!buscado) return null;
        for (const key in dbEquipos) {
            if (normalizarCliente(dbEquipos[key].nombre) === buscado) {
                return dbEquipos[key];
            }
        }
        return null;
    }

    // Fecha local, no UTC (con toISOString de madrugada salía el día anterior).
    const ahora = new Date();
    document.getElementById('ni_fecha').value =
        `${ahora.getFullYear()}-${String(ahora.getMonth() + 1).padStart(2, '0')}-${String(ahora.getDate()).padStart(2, '0')}`;
    document.getElementById('ni_hora').value = ahora.toTimeString().substring(0, 5);

    async function cargarData() {
      const btn = document.getElementById('btn-save-inc');
      btn.innerText = "Cargando clientes..."; btn.disabled = true;
      showLoading();

      try {
        const res = await fetch('/api/generador/clientes-maquinas');
        if (!res.ok) throw new Error("No se pudieron cargar los clientes");

        dbEquipos = await res.json();
        if (dbEquipos.error) throw new Error(dbEquipos.error);

        setupCustomDropdown('ni_cliente', 'dropdown-clientes',
          () => Object.values(dbEquipos).map(c => c.nombre).sort(),
          (sel, isClick) => {
            if (!isClick) return;

            const cliente = buscarCliente(sel);
            if (!cliente) return;

            if (document.getElementById('ni_cliente').dataset.selected === cliente.nombre) return;
            document.getElementById('ni_cliente').dataset.selected = cliente.nombre;

            document.getElementById('ni_cliente').value = cliente.nombre;

            maquinasSel = [];
            renderMaquinas();
            document.getElementById('ni_maquina').value = '';
            document.getElementById('ni_gar').checked = false;

            document.getElementById('ni_poblacion').value = cliente.poblacion || '';
          }
        );

        // Debajo del nombre se ve el nº de serie, para distinguir máquinas con el mismo nombre.
        setupCustomDropdown('ni_maquina', 'dropdown-maquinas', () => {
          return maquinasDelCliente()
            .map(m => ({texto: m.nombre, sub: m.n_serie ? `Nº serie: ${m.n_serie}` : 'Sin nº de serie', maquina: m}))
            .sort((a, b) => a.texto.localeCompare(b.texto, 'es') || (a.maquina.n_serie || '').localeCompare(b.maquina.n_serie || '', 'es'));
        }, (sel, isClick) => {
          if (isClick) addMaquina(sel.maquina);
        });

      } catch (err) {
        console.error(err);
        hideLoading();
        await appAlert("No se han podido cargar los clientes.", {type: 'error'});
      } finally {
        hideLoading();
      }

      btn.innerText = "Crear Aviso"; btn.disabled = false;
    }

    window.sugrafBotListo = cargarData();

    // Las opciones pueden ser textos o {texto, sub}: sub sale en pequeño debajo y también se busca por él.
    function setupCustomDropdown(inputId, dropdownId, getOptionsCallback, onSelectCallback) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        const textoDe = o => typeof o === 'string' ? o : o.texto;

        const renderOptions = (filterText = "") => {
            const options = getOptionsCallback();
            const filtro = normalizarCliente(filterText);
            const filtered = options.filter(o =>
                normalizarCliente(typeof o === 'string' ? o : `${o.texto} ${o.sub || ''}`).includes(filtro)
            );

            dropdown.innerHTML = '';

            if (filtered.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'custom-select-item';
                empty.style.color = '#94a3b8';
                empty.style.fontStyle = 'italic';
                empty.textContent = 'No hay coincidencias';
                dropdown.appendChild(empty);
                return;
            }

            filtered.forEach(opt => {
                const item = document.createElement('div');
                item.className = 'custom-select-item';
                item.textContent = textoDe(opt);
                if (typeof opt !== 'string' && opt.sub) {
                    const sub = document.createElement('span');
                    sub.className = 'item-sub';
                    sub.textContent = opt.sub;
                    item.appendChild(sub);
                }

                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    input.value = textoDe(opt);
                    dropdown.classList.remove('show');
                    if (onSelectCallback) {
                        onSelectCallback(opt, true);
                    }
                });

                dropdown.appendChild(item);
            });
        };

        input.addEventListener('focus', () => {
            renderOptions(input.value);
            dropdown.classList.add('show');
        });

        input.addEventListener('input', (e) => {
            renderOptions(e.target.value);
            dropdown.classList.add('show');
        });

        input.addEventListener('blur', () => {
            setTimeout(() => {
                dropdown.classList.remove('show');
                // Solo se elige sola si el texto coincide con una única opción (puede haber nombres repetidos).
                const exactas = getOptionsCallback().filter(o => normalizarCliente(textoDe(o)) === normalizarCliente(input.value));
                if (exactas.length === 1 && onSelectCallback) {
                    onSelectCallback(exactas[0], true);
                }
            }, 150);
        });
    }

    // maquinasSel guarda las máquinas del Excel (nombre, n_serie, marca...) o {nombre, manual: true} si se escribe a mano.
    function maquinasDelCliente() {
        const cliente = buscarCliente(document.getElementById('ni_cliente').value);
        return cliente ? cliente.maquinas : [];
    }

    function mismaMaquina(a, b) {
        return a.nombre === b.nombre && (a.n_serie || '') === (b.n_serie || '');
    }

    function etiquetaMaquina(m) {
        return m.n_serie ? `${m.nombre} (nº serie ${m.n_serie})` : m.nombre;
    }

    // Máquina del cliente por lo escrito: nº de serie exacto o nombre exacto si no se repite.
    function maquinaEscrita(texto) {
        const buscado = normalizarCliente(texto);
        if (!buscado) return null;
        const lista = maquinasDelCliente();
        const porSerie = lista.filter(m => m.n_serie && normalizarCliente(m.n_serie) === buscado);
        if (porSerie.length === 1) return porSerie[0];
        const porNombre = lista.filter(m => normalizarCliente(m.nombre) === buscado);
        return porNombre.length === 1 ? porNombre[0] : null;
    }

    // Añade lo escrito en el campo. Devuelve false si es un nombre repetido y hay que elegir por nº de serie.
    async function addMaquinaManual() {
        const input = document.getElementById('ni_maquina');
        const v = input.value.trim();
        if (!v) return true;

        const m = maquinaEscrita(v);
        if (m) { addMaquina(m); return true; }

        if (maquinasDelCliente().filter(x => normalizarCliente(x.nombre) === normalizarCliente(v)).length > 1) {
            await appAlert(`Este cliente tiene varias máquinas llamadas «${v}». Elige en la lista la que corresponda por su nº de serie.`, {type: 'error'});
            input.focus();
            return false;
        }

        addMaquina({nombre: v, n_serie: '', manual: true});
        return true;
    }

    function addMaquina(maquina) {
        if (!maquinasSel.some(m => mismaMaquina(m, maquina))) {
            maquinasSel.push(maquina);
            renderMaquinas();
            checkGarantiaGlobal();
        }
        document.getElementById('ni_maquina').value = '';
    }

    function removeMaquina(maquina) {
        maquinasSel = maquinasSel.filter(m => !mismaMaquina(m, maquina));
        renderMaquinas();
        checkGarantiaGlobal();
    }

    function renderMaquinas() {
        const cont = document.getElementById('maquinas-seleccionadas');
        cont.innerHTML = '';

        maquinasSel.forEach(m => {
            const pill = document.createElement('span');
            pill.className = 'pill';
            const texto = document.createElement('span');
            texto.textContent = m.nombre;
            if (m.n_serie) {
                const serie = document.createElement('span');
                serie.className = 'pill-serie';
                serie.textContent = ` · Nº ${m.n_serie}`;
                texto.appendChild(serie);
            }
            pill.appendChild(texto);

            const btn = document.createElement('b');
            btn.textContent = '×';
            btn.addEventListener('click', () => removeMaquina(m));

            pill.appendChild(btn);
            cont.appendChild(pill);
        });
    }

    function checkGarantiaGlobal() {
        let isWarranty = false;

        for (const m of maquinasSel) {
            if (m.f_garan) {
                const garanDate = new Date(m.f_garan);
                const today = new Date();
                today.setHours(0,0,0,0);
                garanDate.setHours(0,0,0,0);

                if (!isNaN(garanDate.getTime()) && garanDate >= today) {
                    isWarranty = true;
                    break;
                }
            }
        }

        document.getElementById('ni_gar').checked = isWarranty;
    }

    document.getElementById('form-nuevo-aviso').addEventListener('submit', async (e) => {
      e.preventDefault();

      if (!(await addMaquinaManual())) return;

      if (maquinasSel.length === 0) {
        await appAlert("Debes seleccionar al menos una máquina.", {type: 'error'});
        return;
      }

      const clienteEscrito = document.getElementById('ni_cliente').value;
      const cliente = buscarCliente(clienteEscrito);

      if (!cliente) {
        await appAlert("Debes seleccionar un cliente de la lista.", {type: 'error'});
        return;
      }

      let poblacion = document.getElementById('ni_poblacion').value.trim();
      if (!poblacion) {
        poblacion = cliente.poblacion || '';
      }

      if (!poblacion) {
        await appAlert("Este cliente no tiene población registrada en el Excel. Por favor, escríbela manualmente.", {type: 'error'});
        return;
      }

      const btn = document.getElementById('btn-save-inc');
      btn.innerText = "Guardando en Excel..."; btn.disabled = true;
      showLoading();

      // Los datos de la máquina (y su nº de serie) son los de la primera elegida.
      const primera = maquinasSel[0];
      const maquinaData = {
        equipo: primera.equipo || "",
        marca: primera.marca || "",
        modelo: primera.modelo || "",
        n_serie: primera.n_serie || "",
        f_garan: primera.f_garan || "",
        f_instal: primera.f_instal || ""
      };

      const payload = {
        fecha_entrada: document.getElementById('ni_fecha').value,
        cliente: cliente.nombre,
        poblacion: poblacion,
        maquina: maquinasSel.map(m => m.nombre).join(" y "),
        equipo: maquinaData.equipo,
        marca: maquinaData.marca,
        modelo: maquinaData.modelo,
        n_serie: maquinaData.n_serie,
        f_garan: maquinaData.f_garan,
        f_instal: maquinaData.f_instal,
        descripcion: document.getElementById('ni_desc').value,
        // No se muestra al crear el aviso: se guarda el del Excel de clientes y aparece al rellenar el parte.
        email: cliente.email || '',
        urgente: document.getElementById('ni_urg').checked,
        garantia: document.getElementById('ni_gar').checked,
        mantenimiento: document.getElementById('ni_man').checked,
        instalacion: document.getElementById('ni_ins').checked,
        revisar: document.getElementById('ni_rev').checked,
        nuevo: document.getElementById('ni_nuevo').checked,
        parado: document.getElementById('ni_parado').checked,
        reclama: document.getElementById('ni_reclama').checked,
        presupuesto: document.getElementById('ni_pre').checked,
        piezas: document.getElementById('ni_piezas').checked,
        asignado: document.getElementById('ni_asignado').value || '',
        creado_por: currentUser
      };

      try {
        const response = await fetch('/api/generador/avisos', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || "Error guardando aviso");
        }

        hideLoading();
        await appAlert(payload.asignado ? `Aviso guardado y asignado a ${payload.asignado}.` : "Aviso guardado correctamente.", {type: 'success'});
        window.location.href = "/sat";
      } catch (err) {
        console.error(err);
        hideLoading();
        await appAlert(err.message || "Error de red al guardar.", {type: 'error'});
        btn.innerText = "Crear Aviso";
        btn.disabled = false;
      } finally {
        hideLoading();
      }
    });

    // Lo que hay escrito en el formulario, para el asistente IA (chatbot.js).
    window.sugrafBotContexto = function () {
      const etiquetas = {ni_nuevo: 'Nuevo', ni_urg: 'Urgente', ni_parado: 'Parado', ni_reclama: 'Reclama', ni_pre: 'Presupuesto',
                         ni_piezas: 'Piezas', ni_gar: 'Garantía', ni_man: 'Mantenimiento', ni_ins: 'Instalación', ni_rev: 'Revisar'};
      const cliente = document.getElementById('ni_cliente').value.trim();
      return {
        formulario: {
          cliente,
          poblacion: document.getElementById('ni_poblacion').value.trim(),
          maquinas: maquinasSel.map(etiquetaMaquina),
          descripcion: document.getElementById('ni_desc').value.trim(),
          etiquetas: Object.entries(etiquetas).filter(([id]) => document.getElementById(id).checked).map(([, n]) => n),
          asignado_a: document.getElementById('ni_asignado').value || 'Sin asignar',
          puede_asignar_a: opcionesAsignado,
        },
        etiqueta: cliente,
      };
    };

    // ---------------- Acciones del asistente (modo control de chatbot.js) ----------------
    const ETIQUETAS_BOT = {Nuevo: 'ni_nuevo', Urgente: 'ni_urg', Parado: 'ni_parado', Reclama: 'ni_reclama', Presupuesto: 'ni_pre',
                           Piezas: 'ni_piezas', 'Garantía': 'ni_gar', Mantenimiento: 'ni_man', 'Instalación': 'ni_ins', Revisar: 'ni_rev'};

    // Cliente del Excel a partir de lo que diga el usuario (nombre exacto o una parte).
    function clienteBot(texto) {
        const exacto = buscarCliente(texto);
        if (exacto) return exacto;
        const buscado = normalizarCliente(texto);
        const candidatos = Object.values(dbEquipos).filter(c => normalizarCliente(c.nombre).includes(buscado));
        if (candidatos.length === 1) return candidatos[0];
        if (!candidatos.length) throw new Error(`No hay ningún cliente que coincida con "${texto}".`);
        throw new Error(`Hay varios clientes que coinciden con "${texto}": ${candidatos.slice(0, 8).map(c => c.nombre).join('; ')}. Pregunta cuál es.`);
    }

    // Máquina del cliente por nº de serie (solo o junto al nombre), nombre exacto o parte del nombre.
    function maquinaBot(cliente, texto) {
        const buscado = normalizarCliente(texto);
        const lista = cliente ? cliente.maquinas : [];
        const n = s => normalizarCliente(s);
        const candidatos = [
            lista.filter(m => m.n_serie && (n(m.n_serie) === buscado || (n(m.n_serie).length >= 4 && buscado.includes(n(m.n_serie))))),
            lista.filter(m => n(m.nombre) === buscado),
            lista.filter(m => n(m.nombre).includes(buscado)),
        ].find(c => c.length);
        if (!candidatos) return {nombre: texto, n_serie: '', manual: true};
        if (candidatos.length > 1) {
            throw new Error(`El cliente tiene varias máquinas que coinciden con "${texto}": ${candidatos.slice(0, 8).map(etiquetaMaquina).join('; ')}. Pregunta cuál es por su nº de serie.`);
        }
        return candidatos[0];
    }

    window.sugrafBotAcciones = {
        rellenar_aviso: {
            descripcion: 'Rellena el formulario de nuevo aviso (no lo crea). Solo cambia los campos que se indiquen. '
                + 'Elegir el cliente rellena su población y vacía las máquinas.',
            parametros: {type: 'object', additionalProperties: false, properties: {
                cliente: {type: 'string', description: 'Nombre (o parte) del cliente de la lista'},
                poblacion: {type: 'string'},
                maquinas: {type: 'array', items: {type: 'string'}, description: 'Máquinas del cliente (nombre o nº de serie); sustituyen a las elegidas'},
                descripcion: {type: 'string', description: 'Explicación de la incidencia'},
                marcar: {type: 'array', items: {type: 'string', enum: Object.keys(ETIQUETAS_BOT)}},
                desmarcar: {type: 'array', items: {type: 'string', enum: Object.keys(ETIQUETAS_BOT)}},
                fecha: {type: 'string', description: 'AAAA-MM-DD'},
                hora: {type: 'string', description: 'HH:MM'},
                asignado: {type: 'string', description: 'Técnico al que se asigna al crearlo ("Sin asignar" para dejarlo sin asignar). Master puede asignar a cualquiera; un técnico solo a sí mismo.'},
            }},
            etiqueta: a => a.cliente ? `Rellenando el aviso de ${a.cliente}` : 'Rellenando el aviso',
            ejecutar: async (a) => {
                if (!Object.keys(dbEquipos).length) return {ok: false, error: 'La lista de clientes aún no ha cargado.'};
                if (a.fecha) await SugrafBot.escribir(document.getElementById('ni_fecha'), a.fecha);
                if (a.hora) await SugrafBot.escribir(document.getElementById('ni_hora'), a.hora);
                if (a.asignado != null) {
                    const sel = document.getElementById('ni_asignado');
                    const valor = /^sin asignar$/i.test(a.asignado.trim()) ? '' : a.asignado.trim();
                    if (valor && !opcionesAsignado.includes(valor)) return {ok: false, error: `No puedes asignar el aviso a «${a.asignado}». Opciones: ${opcionesAsignado.join(', ') || 'ninguna'}.`};
                    sel.value = valor;
                }
                if (a.cliente) {
                    const cliente = clienteBot(a.cliente);
                    const input = document.getElementById('ni_cliente');
                    await SugrafBot.escribir(input, cliente.nombre, {eventos: false});
                    // Al salir del campo con un nombre exacto se elige el cliente (población, máquinas...).
                    input.dispatchEvent(new Event('blur'));
                    await SugrafBot.pausa(250);
                }
                const cliente = buscarCliente(document.getElementById('ni_cliente').value);
                if (a.poblacion !== undefined) await SugrafBot.escribir(document.getElementById('ni_poblacion'), a.poblacion);
                if (Array.isArray(a.maquinas)) {
                    const elegidas = a.maquinas.map(m => maquinaBot(cliente, m));
                    maquinasSel = [];
                    renderMaquinas();
                    for (const m of elegidas) {
                        await SugrafBot.resaltar(document.getElementById('ni_maquina'));
                        addMaquina(m);
                    }
                }
                if (a.descripcion !== undefined) await SugrafBot.escribir(document.getElementById('ni_desc'), a.descripcion);
                for (const [lista, valor] of [[a.marcar, true], [a.desmarcar, false]]) {
                    for (const nombre of lista || []) {
                        const casilla = document.getElementById(ETIQUETAS_BOT[nombre]);
                        if (!casilla) continue;
                        await SugrafBot.resaltar(casilla.closest('label') || casilla);
                        casilla.checked = valor;
                    }
                }
                return {
                    ok: true, formulario: window.sugrafBotContexto().formulario,
                    maquinas_del_cliente: cliente ? cliente.maquinas.slice(0, 30).map(etiquetaMaquina) : [],
                    aviso: 'El aviso no está creado todavía.',
                };
            },
        },
        crear_aviso: {
            descripcion: 'Crea el aviso con lo que hay en el formulario. Pide confirmación al usuario; después la app vuelve al inicio.',
            parametros: {type: 'object', properties: {}, additionalProperties: false},
            etiqueta: () => 'Creando el aviso',
            terminal: true,
            ejecutar: async () => {
                const f = window.sugrafBotContexto().formulario;
                if (!f.cliente || !f.maquinas.length || !f.descripcion) {
                    return {ok: false, error: 'Faltan datos: hacen falta cliente, al menos una máquina y la descripción.'};
                }
                await SugrafBot.resaltar(document.getElementById('btn-save-inc'));
                const ok = await appConfirm(`El asistente va a crear el aviso de ${f.cliente} (${f.maquinas.join(', ')}). ¿Lo confirmas?`);
                if (!ok) return {ok: false, error: 'El usuario no lo ha confirmado.'};
                document.getElementById('form-nuevo-aviso').requestSubmit();
                return {ok: true, mensaje: 'He enviado el aviso. La aplicación confirmará si se ha guardado.'};
            },
        },
    };
  </script>
  <script src="/chatbot.js"></script>
</body>
</html>
