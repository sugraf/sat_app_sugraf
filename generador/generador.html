<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Generador de Avisos</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#10263B;
      --navy-dark:#0a1826;
      --navy-light:#173654;
      --green:#006858;
      --green-dark:#004d40;
      --green-soft:rgba(0,104,88,0.15);
      --grey:#B6BEC4;
      --ink:#f4f8fc;
      --muted:#a9bcd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        font-family: 'Montserrat', sans-serif; 
        background-color: var(--navy); 
        background-image: radial-gradient(800px circle at 20% 0%, rgba(0, 104, 88, 0.15) 0%, transparent 100%), 
                          radial-gradient(800px circle at 85% 20%, rgba(255, 255, 255, 0.05) 0%, transparent 100%); 
        background-attachment: fixed; 
        color: var(--ink); 
        min-height: 100vh; 
        padding: 20px;
    }
    h1, h2, h3 { font-family: 'Montserrat', sans-serif; font-weight: 700; }
    
    .topbar { background: #ffffff; height: 60px; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; border-radius: 8px; margin-bottom: 20px; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .topbar-left { display: flex; align-items: center; gap: 15px; height: 100%; }
    .topbar img { height: 35px; object-fit: contain; display: block; }
    .btn-back { background: #f1f5f8; border: 1px solid var(--grey); padding: 0 15px; height: 35px; border-radius: 6px; font-weight: 600; color: var(--navy) !important; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-size: 14px; transition: 0.2s; box-sizing: border-box; }
    .btn-back:hover { background: #e6ebef; }
    
    .container { max-width: 900px; margin: 0 auto;}
    
    .form-box {
        position: relative;
        overflow: hidden;
        background: #ffffff;
        border-radius: 16px;
        padding: 25px;
        color: var(--navy);
        max-width: 600px;
        margin: 0 auto;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        animation: fadeIn 0.3s ease;
    }
    .form-box::before, .form-box::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        filter: blur(10px);
        pointer-events: none;
        z-index: 0;
    }
    .form-box::before {
        width: 320px; height: 320px;
        background: radial-gradient(circle, rgba(0,104,88,0.16) 0%, transparent 70%);
        top: -120px; left: -100px;
    }
    .form-box::after {
        width: 340px; height: 340px;
        background: radial-gradient(circle, rgba(59,130,246,0.14) 0%, transparent 70%);
        bottom: -130px; right: -110px;
    }
    .form-box > * { position: relative; z-index: 1; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .form-box h2 { margin-bottom: 20px; color: var(--navy); border-bottom: 2px solid #e6ebef; padding-bottom: 10px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; color: #5c6b7d; margin: 15px 0 5px; text-transform: uppercase; }
    input, select, textarea {
        width: 100%; padding: 12px; border: 1px solid var(--grey); border-radius: 8px;
        font-size: 0.95rem; font-family: 'Montserrat', sans-serif; background: #ffffff; transition: 0.2s; color: var(--navy);
        box-shadow: 0 3px 10px rgba(0,104,88,0.07), 0 4px 14px rgba(59,130,246,0.06);
    }
    input:focus, select:focus, textarea:focus {
        outline: none; border-color: var(--green); background: #fff;
        box-shadow: 0 0 0 3px var(--green-soft), 0 4px 14px rgba(59,130,246,0.1);
    }
    
    input[type="date"], input[type="time"] { 
      -webkit-appearance: none; 
      appearance: none; 
      min-width: 0; 
      color: var(--navy) !important; 
      -webkit-text-fill-color: var(--navy) !important; 
      opacity: 1; 
    }
    
    .checkbox-group { display: flex; gap: 15px; margin-top: 10px; flex-wrap: wrap; }
    .checkbox-item { display: flex; align-items: center; gap: 5px; font-size: 0.9rem; color: var(--navy); font-weight: 500; }
    .checkbox-item input { width: auto; margin: 0; accent-color: var(--green); width: 18px; height: 18px; }

    button.btn { background: var(--green); color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 600; width: 100%; margin-top: 25px; cursor: pointer; transition: 0.2s; font-family: 'Montserrat', sans-serif; }
    button.btn:hover { background: var(--green-dark); }
    
    .custom-select-wrapper { position: relative; margin-bottom: 14px; }
    .custom-select-wrapper input { margin-bottom: 0; width: 100%; padding-right: 30px; }
    .custom-select-wrapper::after { content: '▼'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: var(--green); pointer-events: none; }
    .custom-select-list { display: none; position: absolute; z-index: 1000; top: calc(100% - 2px); left: 0; right: 0; background: #ffffff; border: 1px solid var(--grey); border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; max-height: 220px; overflow-y: auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .custom-select-list.show { display: block; }
    .custom-select-item { padding: 12px 16px; font-size: 0.95rem; color: var(--navy); cursor: pointer; border-bottom: 1px solid #e6ebef; }
    .custom-select-item:hover { background: var(--green-soft); color: var(--green); }

    .pill { background: #e6ebef; color: var(--navy); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 8px; font-weight: 500; border: 1px solid var(--grey);}
    .pill b { cursor: pointer; color: #c0392b; font-size: 1rem; transition: color 0.2s;}
    .pill b:hover { color: #922b21; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande.png" alt="Sugraf Logo">
      <a href="/" class="btn-back">Volver</a>
    </div>
  </div>

  <div class="container">
    <div class="form-box">
      <h2>Nuevo Aviso</h2>
      <form id="form-nuevo-aviso">
        <div style="display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 140px;"><label>Fecha Entrada</label><input type="date" id="ni_fecha" required style="margin-bottom:0;"></div>
          <div style="flex: 1; min-width: 110px;"><label>Hora</label><input type="time" id="ni_hora" required style="margin-bottom:0;"></div>
        </div>
        
        <label>Cliente</label>
        <div class="custom-select-wrapper">
          <input type="text" id="ni_cliente" autocomplete="off" required placeholder="Escribe para buscar o desplegar...">
          <div id="dropdown-clientes" class="custom-select-list"></div>
        </div>
        
        <label>Población / Dirección</label>
        <input type="text" id="ni_poblacion" required>
        
        <label>Máquina(s)</label>
        <div style="display: flex; gap: 10px;">
          <div class="custom-select-wrapper" style="flex: 1; margin-bottom: 0;">
            <input type="text" id="ni_maquina" autocomplete="off" placeholder="Selecciona o escribe máquina...">
            <div id="dropdown-maquinas" class="custom-select-list"></div>
          </div>
          <button type="button" class="btn" style="width: auto; margin: 0; padding: 0 20px; font-size: 1.4rem;" onclick="addMaquinaManual()">+</button>
        </div>
        <div id="maquinas-seleccionadas" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; margin-bottom: 14px;"></div>

        <label>Explicar la Incidencia</label>
        <textarea id="ni_desc" rows="3" required placeholder="Detalla el problema o anomalía reportada..."></textarea>

        <label>Etiquetas</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" id="ni_urg"> Urgente</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_gar"> Garantía</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_man"> Mantenimiento</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_ins"> Instalación</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_rev"> Revisar</label>
        </div>

        <button type="submit" class="btn" id="btn-save-inc">Crear Aviso</button>
      </form>
    </div>
  </div>

  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    if (!currentUser) window.location.href = "/";
    if (currentUser === "Solo Visualizar") { alert("Tu perfil no puede crear avisos."); window.location.href = "/"; }

    let dbEquipos = {};
    let maquinasSel = [];

    document.getElementById('ni_fecha').value = new Date().toISOString().split('T')[0];
    document.getElementById('ni_hora').value = new Date().toTimeString().substring(0, 5);

    async function cargarData() {
      const btn = document.getElementById('btn-save-inc');
      btn.innerText = "Cargando clientes..."; btn.disabled = true;
      try {
        const res = await fetch('/api/generador/clientes-maquinas');
        dbEquipos = await res.json();
        
        setupCustomDropdown('ni_cliente', 'dropdown-clientes', () => Object.keys(dbEquipos).sort(), (sel, isClick) => { 
            maquinasSel = [];
            renderMaquinas();
            document.getElementById('ni_maquina').value = ''; 
            document.getElementById('ni_gar').checked = false;
            
            const poblacionInput = document.getElementById('ni_poblacion');
            if (dbEquipos[sel] && dbEquipos[sel].poblacion) {
                poblacionInput.value = dbEquipos[sel].poblacion;
            } else {
                poblacionInput.value = '';
            }
        });

        setupCustomDropdown('ni_maquina', 'dropdown-maquinas', () => {
            const c = document.getElementById('ni_cliente').value;
            if(!c || !dbEquipos[c]) return [];
            return dbEquipos[c].maquinas.map(m => m.nombre).sort();
        }, (sel, isClick) => {
            if(isClick) {
                addMaquina(sel);
            }
        });
      } catch (err) {
        console.error(err);
      }
      btn.innerText = "Crear Aviso"; btn.disabled = false;
    }
    
    cargarData();

    function setupCustomDropdown(inputId, dropdownId, getOptionsCallback, onSelectCallback) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        
        const renderOptions = (filterText = "") => {
            const options = getOptionsCallback();
            const filtered = options.filter(o => o.toLowerCase().includes(filterText.toLowerCase()));
            
            if (filtered.length === 0) {
                dropdown.innerHTML = `<div class="custom-select-item" style="color:#94a3b8; font-style:italic;">No hay coincidencias</div>`;
                return;
            }
            dropdown.innerHTML = filtered.map(opt => `<div class="custom-select-item">${opt}</div>`).join('');
            
            dropdown.querySelectorAll('.custom-select-item').forEach(item => {
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault(); 
                    if (item.innerText === "No hay coincidencias") return;
                    input.value = item.innerText;
                    dropdown.classList.remove('show');
                    if(onSelectCallback) onSelectCallback(item.innerText, true);
                });
            });
        };

        input.addEventListener('focus', () => { renderOptions(input.value); dropdown.classList.add('show'); });
        input.addEventListener('input', (e) => { renderOptions(e.target.value); dropdown.classList.add('show'); if(onSelectCallback) onSelectCallback(e.target.value, false); });
        input.addEventListener('blur', () => { setTimeout(() => dropdown.classList.remove('show'), 150); });
    }

    function addMaquinaManual() {
        const v = document.getElementById('ni_maquina').value.trim();
        if(v) addMaquina(v);
    }

    function addMaquina(nombre) {
        if (!maquinasSel.includes(nombre)) {
            maquinasSel.push(nombre);
            renderMaquinas();
            checkGarantiaGlobal();
        }
        document.getElementById('ni_maquina').value = '';
    }

    function removeMaquina(nombre) {
        maquinasSel = maquinasSel.filter(m => m !== nombre);
        renderMaquinas();
        checkGarantiaGlobal();
    }

    function renderMaquinas() {
        const cont = document.getElementById('maquinas-seleccionadas');
        cont.innerHTML = maquinasSel.map(m => `<span class="pill">${m} <b onclick="removeMaquina('${m}')">×</b></span>`).join('');
    }

    function checkGarantiaGlobal() {
        const c = document.getElementById('ni_cliente').value;
        let isWarranty = false;
        if (dbEquipos && dbEquipos[c]) {
            for (let m of maquinasSel) {
                const found = dbEquipos[c].maquinas.find(x => x.nombre === m);
                if (found && found.f_garan) {
                    const garanDate = new Date(found.f_garan);
                    const today = new Date();
                    today.setHours(0,0,0,0);
                    if (garanDate >= today) {
                        isWarranty = true;
                        break;
                    }
                }
            }
        }
        document.getElementById('ni_gar').checked = isWarranty;
    }

    document.getElementById('form-nuevo-aviso').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const v = document.getElementById('ni_maquina').value.trim();
      if(v && !maquinasSel.includes(v)) { addMaquina(v); }
      if (maquinasSel.length === 0) { alert("Debes seleccionar al menos una máquina."); return; }

      const btn = document.getElementById('btn-save-inc');
      btn.innerText = "Guardando en Excel..."; btn.disabled = true;

      const cliente = document.getElementById('ni_cliente').value;
      
      let maquinaData = { equipo: "", marca: "", modelo: "", f_garan: "", f_instal: "" };
      if (dbEquipos && dbEquipos[cliente]) {
          const found = dbEquipos[cliente].maquinas.find(m => m.nombre === maquinasSel[0]);
          if (found) maquinaData = found;
      }

      const payload = {
        fecha_entrada: document.getElementById('ni_fecha').value,
        cliente: cliente,
        poblacion: document.getElementById('ni_poblacion').value,
        maquina: maquinasSel.join(" y "),
        equipo: maquinaData.equipo,
        marca: maquinaData.marca,
        modelo: maquinaData.modelo,
        f_garan: maquinaData.f_garan,
        f_instal: maquinaData.f_instal,
        descripcion: document.getElementById('ni_desc').value,
        urgente: document.getElementById('ni_urg').checked,
        garantia: document.getElementById('ni_gar').checked,
        mantenimiento: document.getElementById('ni_man').checked,
        instalacion: document.getElementById('ni_ins').checked,
        revisar: document.getElementById('ni_rev').checked
      };

      try {
        await fetch('/api/generador/avisos', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        alert("Aviso guardado correctamente.");
        window.location.href = "/";
      } catch (err) { 
        alert("Error de red al guardar."); 
        btn.innerText = "Crear Aviso"; 
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
