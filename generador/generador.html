<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Generador de Avisos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
        font-family: 'Inter', sans-serif; 
        background-color: #070e1c; 
        background-image: radial-gradient(800px circle at 20% 0%, rgba(47, 111, 176, 0.25) 0%, transparent 100%), 
                          radial-gradient(800px circle at 85% 20%, rgba(79, 156, 217, 0.15) 0%, transparent 100%); 
        background-attachment: fixed; 
        color: #f4f8fc; 
        min-height: 100vh; 
        padding: 20px;
    }
    h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
    
    .topbar { 
        background: #ffffff; 
        height: 60px; 
        display: flex; 
        align-items: center; 
        padding: 0 20px; 
        justify-content: space-between; 
        border-radius: 8px; 
        margin-bottom: 20px; 
        position: sticky; 
        top: 0; 
        z-index: 100; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .topbar-left { display: flex; align-items: center; gap: 15px; height: 100%; }
    .topbar img { height: 35px; object-fit: contain; display: block; }
    .btn-back { 
        background: #f1f5f9; 
        border: 1px solid #cbd5e1; 
        padding: 0 15px; 
        height: 35px; 
        border-radius: 6px; 
        font-weight: 600; 
        color: #1e293b !important; 
        cursor: pointer; 
        display: inline-flex; 
        align-items: center; 
        justify-content: center; 
        text-decoration: none; 
        font-size: 14px; 
        transition: 0.2s; 
        box-sizing: border-box; 
    }
    .btn-back:hover { background: #e2e8f0; }
    
    .container { max-width: 900px; margin: 0 auto;}
    
    .form-box { 
        background: white; 
        border-radius: 16px; 
        padding: 30px; 
        color: #1e293b; 
        max-width: 600px; 
        margin: 0 auto; 
        box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
        animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .form-box h2 { 
        margin-bottom: 25px; 
        color: #0f1e35; 
        border-bottom: 2px solid #e2e8f0; 
        padding-bottom: 10px; 
    }
    
    label { 
        display: block; 
        font-size: 0.85rem; 
        font-weight: 600; 
        color: #475569; 
        margin: 15px 0 6px; 
        text-transform: uppercase; 
    }
    input, select, textarea { 
        width: 100%; 
        padding: 12px; 
        border: 1px solid #cbd5e1; 
        border-radius: 8px; 
        font-size: 0.95rem; 
        font-family: 'Inter', sans-serif; 
        background: #f8fafc; 
        transition: border-color 0.2s, background-color 0.2s;
    }
    input:focus, select:focus, textarea:focus { 
        outline: none; 
        border-color: #4f9cd9; 
        background: #fff; 
    }
    
    input[type="date"], input[type="time"] { 
        -webkit-appearance: none; 
        appearance: none; 
        min-width: 0; 
        color: #1e293b !important; 
        -webkit-text-fill-color: #1e293b !important; 
        opacity: 1; 
    }
    
    .checkbox-group { 
        display: flex; 
        flex-wrap: wrap; 
        gap: 15px; 
        margin-top: 10px; 
        padding: 10px; 
        background: #f8fafc; 
        border: 1px solid #e2e8f0; 
        border-radius: 8px;
    }
    .checkbox-item { 
        display: flex; 
        align-items: center; 
        gap: 8px; 
        font-size: 0.9rem; 
        color: #1e293b; 
        font-weight: 500; 
        text-transform: none; 
        margin: 0;
        cursor: pointer;
    }
    .checkbox-item input { 
        width: auto; 
        margin: 0; 
        accent-color: #4f9cd9; 
        width: 18px; 
        height: 18px; 
        cursor: pointer;
    }

    button.btn { 
        background: #4f9cd9; 
        color: white; 
        border: none; 
        padding: 14px; 
        border-radius: 8px; 
        font-size: 1rem; 
        font-weight: 600; 
        width: 100%; 
        margin-top: 25px; 
        cursor: pointer; 
        transition: 0.2s; 
        font-family: 'Inter', sans-serif; 
    }
    button.btn:hover { background: #2f6fb0; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(79, 156, 217, 0.3); }
    
    .custom-select-wrapper { position: relative; margin-bottom: 14px; }
    .custom-select-wrapper input { margin-bottom: 0; width: 100%; padding-right: 30px; }
    .custom-select-wrapper::after { content: '▼'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: #94a3b8; pointer-events: none; }
    
    .custom-select-list { 
        display: none; 
        position: absolute; 
        z-index: 1000; 
        top: calc(100% - 2px); 
        left: 0; right: 0; 
        background: #ffffff; 
        border: 1px solid #cbd5e1; 
        border-bottom-left-radius: 8px; 
        border-bottom-right-radius: 8px; 
        max-height: 220px; 
        overflow-y: auto; 
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); 
    }
    .custom-select-list.show { display: block; }
    .custom-select-item { 
        padding: 12px 16px; 
        font-size: 0.95rem; 
        color: #1e293b; 
        cursor: pointer; 
        border-bottom: 1px solid #e2e8f0; 
        transition: background 0.1s;
    }
    .custom-select-item:last-child { border-bottom: none; }
    .custom-select-item:hover { background: #f8fafc; color: #2563eb; }
    
    .pill { 
        background: #e2e8f0; 
        color: #1e293b; 
        padding: 6px 12px; 
        border-radius: 20px; 
        font-size: 0.85rem; 
        display: inline-flex; 
        align-items: center; 
        gap: 8px; 
        font-weight: 500;
        border: 1px solid #cbd5e1;
    }
    .pill b { 
        cursor: pointer; 
        color: #ef4444; 
        font-size: 1rem; 
        transition: color 0.2s;
    }
    .pill b:hover { color: #b91c1c; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande_azul.png" alt="Sugraf Logo">
      <a href="/" class="btn-back">Volver</a>
    </div>
  </div>

  <div class="container">
    <div class="form-box">
      <h2>Nuevo Aviso</h2>
      <form id="form-nuevo-aviso">
        <div style="display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap;">
          <div style="flex: 1; min-width: 140px;">
            <label>Fecha Entrada</label>
            <input type="date" id="ni_fecha" required style="margin-bottom:0;">
          </div>
          <div style="flex: 1; min-width: 110px;">
            <label>Hora</label>
            <input type="time" id="ni_hora" required style="margin-bottom:0;">
          </div>
        </div>
        
        <label>Cliente</label>
        <div class="custom-select-wrapper" style="margin-bottom: 14px;">
          <input type="text" id="ni_cliente" autocomplete="off" required placeholder="Escribe para buscar o desplegar...">
          <div id="dropdown-clientes" class="custom-select-list"></div>
        </div>
        
        <label>Población / Dirección</label>
        <input type="text" id="ni_poblacion" required>
        
        <label>Máquina(s)</label>
        <div style="display: flex; gap: 10px;">
          <div class="custom-select-wrapper" style="flex: 1; margin-bottom: 0;">
            <input type="text" id="ni_maquina" autocomplete="off" placeholder="Selecciona o escribe máquina...">
            <div id="dropdown-maquinas" class="custom-select-list"></div>
          </div>
          <button type="button" class="btn" style="width: auto; margin: 0; padding: 0 20px; font-size: 1.2rem;" onclick="addMaquinaManual()">+</button>
        </div>
        <div id="maquinas-seleccionadas" style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; margin-bottom: 14px;"></div>

        <label>Explicar la Incidencia</label>
        <textarea id="ni_desc" rows="3" required placeholder="Detalla el problema o anomalía reportada..."></textarea>

        <label>Etiquetas / Opciones</label>
        <div class="checkbox-group">
          <label class="checkbox-item"><input type="checkbox" id="ni_urg"> Urgente</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_gar"> Garantía</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_man"> Mantenimiento</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_ins"> Instalación</label>
          <label class="checkbox-item"><input type="checkbox" id="ni_rev"> Revisar</label>
        </div>

        <button type="submit" class="btn" id="btn-save-inc">Crear Aviso</button>
      </form>
    </div>
  </div>

  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    if (!currentUser) window.location.href = "/";

    let dbEquipos = {};
    let maquinasSel = [];

    document.getElementById('ni_fecha').value = new Date().toISOString().split('T')[0];
    document.getElementById('ni_hora').value = new Date().toTimeString().substring(0, 5);

    async function cargarData() {
      const btn = document.getElementById('btn-save-inc');
      btn.innerText = "Cargando clientes..."; btn.disabled = true;
      try {
        const res = await fetch('/api/generador/clientes-maquinas');
        dbEquipos = await res.json();
        
        setupCustomDropdown('ni_cliente', 'dropdown-clientes', () => Object.keys(dbEquipos).sort(), (sel) => { 
            maquinasSel = [];
            renderMaquinas();
            document.getElementById('ni_maquina').value = ''; 
            document.getElementById('ni_gar').checked = false;
            const poblacionInput = document.getElementById('ni_poblacion');
            poblacionInput.value = (dbEquipos[sel] && dbEquipos[sel].poblacion) ? dbEquipos[sel].poblacion : '';
        });

        setupCustomDropdown('ni_maquina', 'dropdown-maquinas', () => {
            const c = document.getElementById('ni_cliente').value;
            if(!c || !dbEquipos[c]) return [];
            return dbEquipos[c].maquinas.map(m => m.nombre).sort();
        }, (item) => {
            addMaquina(item);
        });
      } catch (err) { console.error(err); }
      btn.innerText = "Crear Aviso"; btn.disabled = false;
    }
    cargarData();

    function setupCustomDropdown(inputId, dropdownId, getOptionsCallback, onSelectCallback) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        if(!input || !dropdown) return;
        
        const renderOptions = (filterText = "") => {
            const options = getOptionsCallback();
            const filtered = options.filter(o => o.toLowerCase().includes(filterText.toLowerCase()));
            if (filtered.length === 0) {
                dropdown.innerHTML = `<div class="custom-select-item" style="color:#94a3b8; font-style:italic;">No hay coincidencias</div>`;
                return;
            }
            dropdown.innerHTML = filtered.map(opt => `<div class="custom-select-item">${opt}</div>`).join('');
            dropdown.querySelectorAll('.custom-select-item').forEach(item => {
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault(); 
                    if (item.innerText === "No hay coincidencias") return;
                    input.value = item.innerText; // <- RESTAURADO
                    dropdown.classList.remove('show');
                    if(onSelectCallback) onSelectCallback(item.innerText);
                });
            });
        };

        input.addEventListener('focus', () => { renderOptions(input.value); dropdown.classList.add('show'); });
        input.addEventListener('input', (e) => { 
            renderOptions(e.target.value); 
            dropdown.classList.add('show'); 
            if(onSelectCallback) onSelectCallback(e.target.value); // <- RESTAURADO
        });
        input.addEventListener('blur', () => { setTimeout(() => { dropdown.classList.remove('show'); }, 150); });
    }

    function addMaquinaManual() {
        const v = document.getElementById('ni_maquina').value.trim();
        if(v) addMaquina(v);
    }

    function addMaquina(nombre) {
        if (!maquinasSel.includes(nombre)) {
            maquinasSel.push(nombre);
            renderMaquinas();
            checkGarantiaGlobal();
        }
        document.getElementById('ni_maquina').value = '';
    }

    function removeMaquina(nombre) {
        maquinasSel = maquinasSel.filter(m => m !== nombre);
        renderMaquinas();
        checkGarantiaGlobal();
    }

    function renderMaquinas() {
        const cont = document.getElementById('maquinas-seleccionadas');
        cont.innerHTML = maquinasSel.map(m => `<span class="pill">${m} <b onclick="removeMaquina('${m}')">×</b></span>`).join('');
    }

    function checkGarantiaGlobal() {
        const c = document.getElementById('ni_cliente').value;
        let isWarranty = false;
        if (dbEquipos && dbEquipos[c]) {
            for (let m of maquinasSel) {
                const found = dbEquipos[c].maquinas.find(x => x.nombre === m);
                if (found && found.f_garan) {
                    const garanDate = new Date(found.f_garan);
                    const today = new Date();
                    today.setHours(0,0,0,0);
                    if (garanDate >= today) {
                        isWarranty = true;
                        break;
                    }
                }
            }
        }
        document.getElementById('ni_gar').checked = isWarranty;
    }

    document.getElementById('form-nuevo-aviso').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const v = document.getElementById('ni_maquina').value.trim();
      if(v && !maquinasSel.includes(v)) { addMaquina(v); }
      if (maquinasSel.length === 0) { alert("Añade al menos una máquina."); return; }

      const btn = document.getElementById('btn-save-inc');
      btn.innerText = "Guardando en Excel..."; btn.disabled = true;

      const cliente = document.getElementById('ni_cliente').value;
      
      let maquinaData = { equipo: "", marca: "", modelo: "", f_garan: "", f_instal: "" };
      if (dbEquipos && dbEquipos[cliente] && maquinasSel.length > 0) {
          const found = dbEquipos[cliente].maquinas.find(m => m.nombre === maquinasSel[0]);
          if (found) maquinaData = found;
      }

      const payload = {
        fecha_entrada: document.getElementById('ni_fecha').value,
        cliente: cliente,
        poblacion: document.getElementById('ni_poblacion').value,
        maquina: maquinasSel.join(" y "),
        equipo: maquinaData.equipo,
        marca: maquinaData.marca,
        modelo: maquinaData.modelo,
        f_garan: maquinaData.f_garan,
        f_instal: maquinaData.f_instal,
        descripcion: document.getElementById('ni_desc').value,
        urgente: document.getElementById('ni_urg').checked,
        garantia: document.getElementById('ni_gar').checked,
        mantenimiento: document.getElementById('ni_man').checked,
        instalacion: document.getElementById('ni_ins').checked,
        revisar: document.getElementById('ni_rev').checked
      };

      try {
        await fetch('/api/generador/avisos', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        alert("Aviso guardado correctamente.");
        window.location.href = "/";
      } catch (err) { alert("Error de red al guardar."); btn.innerText = "Crear Aviso"; btn.disabled = false;}
    });
  </script>
</body>
</html>
