<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10263B">
  <title>Organizador de Avisos - Sugraf Digital Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#10263B;
      --navy-dark:#0a1826;
      --navy-light:#173654;
      --green:#006858;
      --green-dark:#004d40;
      --green-soft:rgba(0,104,88,0.15);
      --grey:#B6BEC4;
      --ink:#f4f8fc;
      --muted:#a9bcd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html{ scroll-behavior:smooth; }
    body {
        font-family: 'Montserrat', sans-serif;
        font-weight:400;
        background-color: var(--navy);
        background-image:
          radial-gradient(900px circle at 15% -5%, rgba(0,104,88,0.28) 0%, transparent 55%),
          radial-gradient(900px circle at 90% 10%, rgba(182,190,196,0.10) 0%, transparent 55%),
          radial-gradient(1200px circle at 50% 120%, rgba(0,104,88,0.12) 0%, transparent 60%);
        background-attachment: fixed;
        color: var(--ink);
        min-height: 100vh;
        padding: 20px;
    }
    h1, h2, h3 { font-family: 'Montserrat', sans-serif; font-weight:700; letter-spacing:-0.01em; }

    /* ---------- Topbar (idéntica al Hub) ---------- */
    .topbar {
      background:#ffffff;
      height:64px;
      display:flex;
      align-items:center;
      padding:0 24px;
      justify-content:space-between;
      border-radius:16px;
      margin-bottom:24px;
      box-shadow:0 1px 0 rgba(16,38,59,0.08), 0 4px 16px rgba(16,38,59,0.04);
      position:sticky; top:0; z-index:100;
    }
    .topbar-left{ display:flex; align-items:center; gap:16px; height:100%; }
    .topbar img{ height:35px; object-fit:contain; display:block; }

    .btn-back{
      display:flex; align-items:center; gap:6px;
      color:#4a5a72; text-decoration:none; font-weight:600; font-size:0.85rem;
      padding:8px 14px; border-radius:10px; border:1px solid #e2e8f0;
      transition:background 0.15s, border-color 0.15s;
    }
    .btn-back:hover{ background:#f1f5f8; border-color:#cbd5e1; }

    .container { max-width:960px; margin:0 auto; }

    .header-title{ text-align:center; margin-bottom:30px; }
    .eyebrow{
      display:inline-flex; align-items:center; gap:7px; background:var(--green-soft);
      border:1px solid rgba(0,104,88,0.35); color:#7fd9c7; font-size:0.7rem; font-weight:700;
      letter-spacing:0.12em; text-transform:uppercase; padding:6px 14px; border-radius:999px; margin-bottom:16px;
    }
    .eyebrow .dot-sm{ width:6px; height:6px; background:#2fd9b8; border-radius:50%; }
    .header-title h2{ font-size:2rem; color:var(--ink); border:none; padding:0; margin:0; }

    /* ---------- Filters ---------- */
    .filters-row{ display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
    select.filter-sel {
        padding:12px 14px;
        border:1px solid rgba(182,190,196,0.3);
        border-radius:10px;
        font-size:0.9rem;
        background:var(--navy-dark);
        color:var(--ink);
        cursor:pointer;
        font-weight:500;
        min-width:170px;
        flex:1;
        font-family:'Montserrat', sans-serif;
        transition:border-color 0.15s, box-shadow 0.15s;
        appearance:none;
        background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%237fd9c7" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');
        background-repeat:no-repeat;
        background-position:right 14px center;
        background-size:16px;
        padding-right:36px;
    }
    select.filter-sel:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }

    /* ---------- Incident cards ---------- */
    .inc-item {
        position:relative; overflow:hidden;
        background:linear-gradient(160deg, var(--navy-light) 0%, var(--navy) 100%);
        border:1px solid rgba(182,190,196,0.14);
        padding:18px 20px;
        border-radius:16px;
        margin-bottom:12px;
        transition:transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        text-align:left;
        cursor:pointer;
        animation: fadeIn 0.3s ease;
    }
    .inc-item:hover {
        border-color:rgba(0,104,88,0.55);
        transform:translateY(-3px);
        box-shadow:0 14px 28px rgba(0,0,0,0.25);
    }

    .inc-title {
        font-weight:700;
        color:#fff;
        font-size:1.02rem;
        display:flex;
        justify-content:space-between;
        align-items:center;
        flex-wrap:wrap;
        gap:10px;
    }
    .inc-sub { color:var(--muted); font-size:0.85rem; margin-top:8px; }

    .badge-container { display:inline-flex; gap:6px; flex-wrap:wrap; margin-left:10px; }
    .badge{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:0.68rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; border:1px solid transparent; }
    .bg-urg{ background:rgba(239,68,68,0.18); color:#fca5a5; border-color:rgba(239,68,68,0.4); }
    .bg-gar{ background:var(--green-soft); color:#7fd9c7; border-color:rgba(0,104,88,0.4); }
    .bg-man{ background:rgba(234,179,8,0.18); color:#fde68a; border-color:rgba(234,179,8,0.4); }
    .bg-ins{ background:rgba(59,130,246,0.18); color:#93c5fd; border-color:rgba(59,130,246,0.4); }
    .bg-rev{ background:rgba(168,85,247,0.18); color:#d8b4fe; border-color:rgba(168,85,247,0.4); }

    .btn-delete {
        background:rgba(239,68,68,0.14);
        border:1px solid rgba(239,68,68,0.4);
        color:#fca5a5;
        border-radius:8px;
        padding:5px 10px;
        cursor:pointer;
        transition:background 0.15s, color 0.15s;
        font-size:1.05rem;
        margin-right:10px;
        display:flex;
        align-items:center;
        justify-content:center;
    }
    .btn-delete:hover { background:#ef4444; color:#fff; }

    select.action-sel {
        padding:6px 10px;
        border:1px solid rgba(182,190,196,0.3);
        border-radius:8px;
        font-size:0.82rem;
        font-family:'Montserrat', sans-serif;
        background:var(--navy-dark);
        cursor:pointer;
        color:var(--ink);
        font-weight:500;
        transition:border-color 0.15s;
        appearance:none;
        background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%237fd9c7" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');
        background-repeat:no-repeat;
        background-position:right 10px center;
        background-size:13px;
        padding-right:28px;
    }
    select.action-sel:focus { outline:none; border-color:var(--green); }
    select.action-sel:disabled { background-color:rgba(255,255,255,0.04); color:#5c7291; cursor:not-allowed; border-color:transparent; }

    .meta-pair{ font-size:0.85rem; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:6px; }
    .meta-pair strong{ color:#d7e2ef; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .empty-msg{ color:var(--muted); font-size:0.98rem; padding:20px 0; }

    /* ---------- Modal: fondo blanco con reflejos verdes/azules para mejor lectura ---------- */
    .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.6); align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .modal-content {
        position:relative;
        overflow:hidden;
        background:#ffffff;
        color:var(--navy);
        border:1px solid rgba(16,38,59,0.08);
        padding:30px;
        border-radius:20px;
        max-width:600px;
        width:90%;
        max-height:85vh;
        overflow-y:auto;
        box-shadow:0 24px 60px rgba(0,0,0,0.4);
    }
    .modal-content::before, .modal-content::after{
      content:""; position:absolute; border-radius:50%; filter:blur(10px); pointer-events:none; z-index:0;
    }
    .modal-content::before{
      width:320px; height:320px;
      background:radial-gradient(circle, rgba(0,104,88,0.14) 0%, transparent 70%);
      top:-120px; left:-100px;
    }
    .modal-content::after{
      width:340px; height:340px;
      background:radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
      bottom:-130px; right:-110px;
    }
    .modal-content > * { position:relative; z-index:1; }
    .close-btn { position:absolute; right:20px; top:16px; font-size:26px; font-weight:bold; cursor:pointer; color:#94a3b8; transition:color 0.2s; z-index:2; }
    .close-btn:hover { color:var(--navy); }

    .modal-content h3{
      color:var(--navy); font-size:1.2rem; font-weight:700;
      padding-bottom:16px; margin-bottom:4px; border-bottom:2px solid #e6ebef;
    }

    .vertical-table { width:100%; border-collapse:collapse; margin-top:15px; font-size:0.9rem; }
    .vertical-table th { text-align:left; padding:12px; background:#f1f5f8; border-bottom:1px solid #e6ebef; color:#5c6b7d; width:40%; font-weight:700; text-transform:uppercase; font-size:0.72rem; letter-spacing:0.05em; }
    .vertical-table td { padding:12px; border-bottom:1px solid #e6ebef; color:var(--navy); font-weight:500; word-break:break-word; background:#fff; }

    @media (max-width:640px){
      .filters-row{ flex-direction:column; }
      select.filter-sel{ min-width:100%; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande.png" alt="Sugraf Logo" onerror="this.style.display='none'">
      <a href="/" class="btn-back">&larr; Volver</a>
    </div>
  </div>

  <div class="container">
    <div class="header-title">
      <div class="eyebrow"><span class="dot-sm"></span> Servicio T&eacute;cnico</div>
      <h2>Organizador de Avisos</h2>
    </div>

    <div class="filters-row">
      <select id="filtro-tecnico" class="filter-sel" onchange="renderGestionAvisos()">
        <option value="Todos">Técnico: Todos</option>
        <option value="Pendiente">Sin Asignar</option>
        <option value="Ion Volog">Ion Volog</option>
        <option value="Francisco Antúnez">Francisco Antúnez</option>
        <option value="Daniel Gargallo">Daniel Gargallo</option>
        <option value="Emilio Arrieta">Emilio Arrieta</option>
      </select>
      <select id="filtro-pirineos" class="filter-sel" onchange="renderGestionAvisos()">
        <option value="Todos">Pirineos: Todos</option>
        <option value="SI">En Pirineos</option>
        <option value="NO">No Pirineos</option>
      </select>
      <select id="filtro-garantia" class="filter-sel" onchange="renderGestionAvisos()">
        <option value="Todos">Garantía: Todos</option>
        <option value="SI">Con Garantía</option>
        <option value="NO">Sin Garantía</option>
      </select>
    </div>

    <div id="contenedor-gestionar">
      <p class="empty-msg">Cargando avisos del sistema...</p>
    </div>
  </div>

  <div id="aviso-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarModal()">&times;</span>
      <h3>Detalles del Aviso</h3>
      <table class="vertical-table" id="tabla-detalles"></table>
    </div>
  </div>

  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    if (!currentUser) window.location.href = "/";
    const TECNICOS_PERMITIDOS = ["Ion Volog", "Francisco Antúnez", "Daniel Gargallo", "Emilio Arrieta"];

    const COLUMNAS_MOSTRAR = ['F. ENTR.', 'CLIENTE', 'POBLACIÓN', 'MÁQUINA', 'EQUIPO', 'MARCA', 'MODELO', 'F. GARANTÍA', 'F. INSTALACIÓN', 'DESCRIPCIÓN', 'REALIZADO POR', 'URGENTE', 'PIRINEOS', 'GARANTÍA', 'MANTENIMIENTO', 'INSTALACIÓN', 'REVISAR'];

    let avisosGlobales = [];

    async function cargarGestionAvisos() {
      try {
        const res = await fetch('/api/gestor/avisos');
        const data = await res.json();
        avisosGlobales = data.avisos || [];
        renderGestionAvisos();
      } catch (e) { document.getElementById('contenedor-gestionar').innerHTML = "<p class='empty-msg' style='color:#fca5a5;'>Error al cargar los avisos.</p>"; }
    }

    function renderGestionAvisos() {
      const box = document.getElementById('contenedor-gestionar');
      const filtroTec = document.getElementById('filtro-tecnico').value;
      const filtroPir = document.getElementById('filtro-pirineos').value;
      const filtroGar = document.getElementById('filtro-garantia').value;
      
      const isTecnico = TECNICOS_PERMITIDOS.includes(currentUser);

      let filtrados = avisosGlobales.map((av, index) => ({...av, original_index: index}));

      filtrados = filtrados.filter(av => {
        const matchTec = filtroTec === "Todos" || (av['REALIZADO POR'] || 'Pendiente') === filtroTec;
        const matchPir = filtroPir === "Todos" || av['PIRINEOS'] === filtroPir;
        const matchGar = filtroGar === "Todos" || av['GARANTÍA'] === filtroGar;
        return matchTec && matchPir && matchGar;
      });

      filtrados.sort((a, b) => {
          const aPendiente = (a['REALIZADO POR'] === 'Pendiente' || !a['REALIZADO POR']) ? 0 : 1;
          const bPendiente = (b['REALIZADO POR'] === 'Pendiente' || !b['REALIZADO POR']) ? 0 : 1;
          return aPendiente - bPendiente;
      });

      let html = "";
      filtrados.forEach((av) => {
        const i = av.original_index;
        const fuente = av.fuente;
        const esPirineos = av['PIRINEOS'] === 'SI';
        const tecActual = av['REALIZADO POR'] || 'Pendiente';
        const estadoAviso = av['ESTADO'] || '';
        
        const disableSelect = (estadoAviso === 'Abierto' || estadoAviso === 'Cerrado') ? "disabled" : "";
        const titleText = disableSelect ? 'title="El aviso ya ha sido abierto por el técnico y no se puede reasignar."' : '';
        
        let tecOptions = `<option value="Pendiente" ${tecActual === 'Pendiente' ? 'selected' : ''}>Sin Asignar</option>`;
        
        if (isTecnico) {
            tecOptions += `<option value="${currentUser}" ${tecActual === currentUser ? 'selected' : ''}>${currentUser}</option>`;
            if (tecActual !== 'Pendiente' && tecActual !== currentUser) {
                tecOptions += `<option value="${tecActual}" selected disabled>${tecActual}</option>`;
            }
        } else if (currentUser === "master") {
            TECNICOS_PERMITIDOS.forEach(t => { tecOptions += `<option value="${t}" ${tecActual === t ? 'selected' : ''}>${t}</option>`; });
        }

        const disablePirineos = (currentUser !== "master") ? "disabled" : "";
        
        let badgesHtml = "";
        if(av['URGENTE'] === 'SI') badgesHtml += `<span class="badge bg-urg">Urgente</span>`;
        if(av['GARANTÍA'] === 'SI') badgesHtml += `<span class="badge bg-gar">Garantía</span>`;
        if(av['MANTENIMIENTO'] === 'SI') badgesHtml += `<span class="badge bg-man">Mantenimiento</span>`;
        if(av['INSTALACIÓN'] === 'SI') badgesHtml += `<span class="badge bg-ins">Instalación</span>`;
        if(av['REVISAR'] === 'SI') badgesHtml += `<span class="badge bg-rev">Revisar</span>`;

        let btnDelete = "";
        if (currentUser === "master") {
            btnDelete = `<button class="btn-delete" onclick="event.stopPropagation(); eliminarAviso(${i}, '${fuente}')" title="Eliminar aviso">🗑️</button>`;
        }

        html += `
          <div class="inc-item" onclick="abrirDetalles(${i}, '${fuente}')">
            <div class="inc-title">
              <span style="flex:1; min-width: 200px; display:flex; align-items:center;">
                  ${btnDelete}
                  ${av['CLIENTE']} 
                  <span class="badge-container">${badgesHtml}</span>
              </span>
              <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap;">
                <span class="meta-pair">
                  <strong>Asignado a:</strong>
                  <select class="action-sel" onclick="event.stopPropagation()" onchange="actualizarTecnico(${i}, '${fuente}', this)" ${disableSelect} ${titleText}>
                    ${tecOptions}
                  </select>
                </span>
                <span class="meta-pair">
                  <strong>Pirineos:</strong>
                  <select class="action-sel" onclick="event.stopPropagation()" onchange="actualizarPirineos(${i}, '${fuente}', this)" ${disablePirineos}>
                    <option value="NO" ${!esPirineos ? 'selected' : ''}>No</option>
                    <option value="SI" ${esPirineos ? 'selected' : ''}>Sí</option>
                  </select>
                </span>
              </div>
            </div>
            <div class="inc-sub">Fecha: ${av['F. ENTR.']} | Máquina: ${av['MÁQUINA']}</div>
          </div>
        `;
      });

      box.innerHTML = html || "<p class='empty-msg'>No hay avisos que coincidan con los filtros.</p>";
    }

    function abrirDetalles(index, fuente) {
        const av = avisosGlobales.find(a => a.original_index === index && a.fuente === fuente);
        let html = "";
        
        COLUMNAS_MOSTRAR.forEach(key => {
            let val = (av[key] !== null && av[key] !== undefined && av[key] !== '') ? av[key] : '-';
            html += `<tr><th>${key}</th><td>${val}</td></tr>`;
        });
        
        document.getElementById('tabla-detalles').innerHTML = html;
        document.getElementById('aviso-modal').style.display = 'flex';
    }

    function cerrarModal() { document.getElementById('aviso-modal').style.display = 'none'; }
    window.onclick = function(event) { if (event.target === document.getElementById('aviso-modal')) cerrarModal(); }

    async function actualizarPirineos(index, fuente, selectElement) {
      const valor = selectElement.value;
      selectElement.disabled = true;
      try {
        await fetch('/api/gestor/actualizar-pirineos', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ aviso_index: index, fuente: fuente, valor: valor }) });
        cargarGestionAvisos();
      } catch (err) { alert("Error al actualizar la celda Pirineos."); cargarGestionAvisos(); }
    }

    async function actualizarTecnico(index, fuente, selectElement) {
      const valor = selectElement.value;
      selectElement.disabled = true;
      
      try {
        const res = await fetch('/api/gestor/actualizar-tecnico', { 
            method: 'POST', 
            headers: {'Content-Type': 'application/json'}, 
            body: JSON.stringify({ aviso_index: index, fuente: fuente, valor: valor }) 
        });
        if (!res.ok) {
            const err = await res.json();
            alert(err.detail || "Error al asignar técnico.");
            cargarGestionAvisos(); 
            return;
        }
        cargarGestionAvisos();
      } catch (err) { 
        alert("Error al asignar técnico."); 
        cargarGestionAvisos();
      }
    }

    async function eliminarAviso(index, fuente) {
        if (confirm("¿Estás seguro de que quieres ELIMINAR este aviso permanentemente?")) {
            try {
                const res = await fetch('/api/gestor/eliminar-aviso', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({ aviso_index: index, fuente: fuente, valor: "" }) 
                });
                if (!res.ok) {
                    const err = await res.json();
                    alert(err.detail || "Error al eliminar el aviso.");
                    return;
                }
                cargarGestionAvisos();
            } catch (err) { alert("Error al eliminar el aviso."); }
        }
    }

    cargarGestionAvisos();
  </script>
</body>
</html>
