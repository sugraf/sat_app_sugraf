<!-- gestor.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10263B">
  <title>Organizador de Avisos - Sugraf Digital Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui-common.css">

  <style>
    :root{
      --navy:#10263B;
      --navy-dark:#0a1826;
      --navy-light:#173654;
      --green:#006858;
      --green-dark:#004d40;
      --green-soft:rgba(0,104,88,0.15);
      --grey:#B6BEC4;
      --ink:#f4f8fc;
      --muted:#a9bcd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html{ scroll-behavior:smooth; }
    body {
        font-family: 'Montserrat', sans-serif;
        font-weight:400;
        background-color: var(--navy);
        background-image:
          radial-gradient(900px circle at 15% -5%, rgba(0,104,88,0.28) 0%, transparent 55%),
          radial-gradient(900px circle at 90% 10%, rgba(182,190,196,0.10) 0%, transparent 55%),
          radial-gradient(1200px circle at 50% 120%, rgba(0,104,88,0.12) 0%, transparent 60%);
        background-attachment: fixed;
        color: var(--ink);
        min-height: 100vh;
        padding: 20px;
    }
    h1, h2, h3 { font-family: 'Montserrat', sans-serif; font-weight:700; letter-spacing:-0.01em; }

    .topbar {
      background:#ffffff;
      height:64px;
      display:flex;
      align-items:center;
      padding:0 24px;
      justify-content:space-between;
      border-radius:16px;
      margin-bottom:24px;
      box-shadow:0 1px 0 rgba(16,38,59,0.08), 0 4px 16px rgba(16,38,59,0.04);
      position:sticky; top:0; z-index:100;
    }
    .topbar-left{ display:flex; align-items:center; gap:16px; height:100%; }
    .topbar img{ height:35px; object-fit:contain; display:block; }

    .btn-back{
      display:flex; align-items:center; gap:6px;
      color:#4a5a72; text-decoration:none; font-weight:600; font-size:0.85rem;
      padding:8px 14px; border-radius:10px; border:1px solid #e2e8f0;
      transition:background 0.15s, border-color 0.15s;
    }
    .btn-back:hover{ background:#f1f5f8; border-color:#cbd5e1; }

    .topbar-right { color:#4a5a72; font-size:13px; font-weight:600; display:flex; align-items:center; gap:9px; }
    .dot { width:8px; height:8px; background:var(--green); border-radius:50%; box-shadow:0 0 0 4px var(--green-soft); }

    .dropdown { position:relative; display:inline-block; cursor:pointer; }
    .dropdown-trigger{ display:flex; align-items:center; gap:6px; padding:8px 12px; border-radius:10px; transition:background 0.15s; }
    .dropdown-trigger:hover{ background:#f1f5f8; }
    .chev{ font-size:9px; color:#94a3b8; transition:transform 0.15s; }
    .dropdown-content {
      display:none; position:absolute; right:0; background:#ffffff;
      min-width:170px; box-shadow:0 12px 28px rgba(16,38,59,0.18);
      z-index:1; border-radius:12px; overflow:hidden; margin-top:10px;
      border:1px solid #eef2f5;
    }
    .dropdown-content a {
      color:#ef4444; padding:13px 16px; text-decoration:none; display:flex;
      align-items:center; gap:8px; font-weight:600; font-size:0.88rem;
    }
    .dropdown-content a:hover { background:#fef2f2; }
    .show { display:block; animation:dropIn 0.15s ease; }
    @keyframes dropIn{ from{opacity:0; transform:translateY(-6px);} to{opacity:1; transform:translateY(0);} }

    .container { max-width:960px; margin:0 auto; }

    .header-title{ text-align:center; margin-bottom:30px; }
    .eyebrow{
      display:inline-flex; align-items:center; gap:7px; background:var(--green-soft);
      border:1px solid rgba(0,104,88,0.35); color:#7fd9c7; font-size:0.7rem; font-weight:700;
      letter-spacing:0.12em; text-transform:uppercase; padding:6px 14px; border-radius:999px; margin-bottom:16px;
    }
    .eyebrow .dot-sm{ width:6px; height:6px; background:#2fd9b8; border-radius:50%; }
    .header-title h2{ font-size:2rem; color:var(--ink); border:none; padding:0; margin:0; }

    .filters-row{ display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
    select.filter-sel {
        padding:12px 14px;
        border:1px solid rgba(182,190,196,0.3);
        border-radius:10px;
        font-size:0.9rem;
        background:var(--navy-dark);
        color:var(--ink);
        cursor:pointer;
        font-weight:500;
        min-width:170px;
        flex:1;
        font-family:'Montserrat', sans-serif;
        transition:border-color 0.15s, box-shadow 0.15s;
        appearance:none;
        background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%237fd9c7" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');
        background-repeat:no-repeat;
        background-position:right 14px center;
        background-size:16px;
        padding-right:36px;
    }
    select.filter-sel:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }

    .inc-item {
        position:relative; overflow:hidden;
        background:linear-gradient(160deg, var(--navy-light) 0%, var(--navy) 100%);
        border:1px solid rgba(182,190,196,0.14);
        padding:18px 20px;
        border-radius:16px;
        margin-bottom:12px;
        transition:transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        text-align:left;
        cursor:pointer;
        animation: fadeIn 0.3s ease;
    }
    .inc-item:hover {
        border-color:rgba(0,104,88,0.55);
        transform:translateY(-3px);
        box-shadow:0 14px 28px rgba(0,0,0,0.25);
    }

    .inc-title {
        font-weight:700;
        color:#fff;
        font-size:1.02rem;
        display:flex;
        justify-content:space-between;
        align-items:center;
        flex-wrap:wrap;
        gap:10px;
    }
    .inc-sub { color:var(--muted); font-size:0.85rem; margin-top:8px; }

    .badge-container { display:inline-flex; gap:6px; flex-wrap:wrap; margin-left:10px; }
    .badge{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:0.68rem; font-weight:700; letter-spacing:0.03em; text-transform:uppercase; border:1px solid transparent; }
    
    .bg-nuevo{ background:rgba(34,197,94,0.18); color:#86efac; border-color:rgba(34,197,94,0.4); }
    .bg-urg{ background:rgba(239,68,68,0.18); color:#fca5a5; border-color:rgba(239,68,68,0.4); }
    .bg-parado{ background:rgba(220,38,38,0.18); color:#f87171; border-color:rgba(220,38,38,0.4); }
    .bg-reclama{ background:rgba(249,115,22,0.18); color:#fdba74; border-color:rgba(249,115,22,0.4); }
    .bg-presupuesto{ background:rgba(59,130,246,0.18); color:#93c5fd; border-color:rgba(59,130,246,0.4); }
    .bg-piezas{ background:rgba(245,158,11,0.18); color:#fcd34d; border-color:rgba(245,158,11,0.4); }
    .bg-piezas-listo{ background:rgba(16,185,129,0.18); color:#6ee7b7; border-color:rgba(16,185,129,0.4); }
    .bg-gar{ background:var(--green-soft); color:#7fd9c7; border-color:rgba(0,104,88,0.4); }
    .bg-man{ background:rgba(234,179,8,0.18); color:#fde68a; border-color:rgba(234,179,8,0.4); }
    .bg-ins{ background:rgba(59,130,246,0.18); color:#93c5fd; border-color:rgba(59,130,246,0.4); }
    .bg-rev{ background:rgba(168,85,247,0.18); color:#d8b4fe; border-color:rgba(168,85,247,0.4); }
    
    .btn-archive {
      background:transparent; color:#7fd9c7; border:1px solid rgba(0,104,88,0.5);
      padding:5px 12px; border-radius:8px; cursor:pointer; font-weight:700; font-size:0.72rem;
      text-transform:uppercase; letter-spacing:0.03em; transition:background 0.15s, border-color 0.15s;
    }
    .btn-archive:hover{ background:var(--green-soft); border-color:var(--green); }

    .btn-delete {
        background:rgba(239,68,68,0.14);
        border:1px solid rgba(239,68,68,0.4);
        color:#fca5a5;
        border-radius:8px;
        padding:5px 10px;
        cursor:pointer;
        transition:background 0.15s, color 0.15s;
        font-size:1.05rem;
        margin-right:10px;
        display:flex;
        align-items:center;
        justify-content:center;
    }
    .btn-delete:hover { background:#ef4444; color:#fff; }

    select.action-sel {
        padding:6px 10px;
        border:1px solid rgba(182,190,196,0.3);
        border-radius:8px;
        font-size:0.82rem;
        font-family:'Montserrat', sans-serif;
        background:var(--navy-dark);
        cursor:pointer;
        color:var(--ink);
        font-weight:500;
        transition:border-color 0.15s;
        appearance:none;
        background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%237fd9c7" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');
        background-repeat:no-repeat;
        background-position:right 10px center;
        background-size:13px;
        padding-right:28px;
    }
    select.action-sel:focus { outline:none; border-color:var(--green); }
    select.action-sel:disabled { background-color:rgba(255,255,255,0.04); color:#5c7291; cursor:not-allowed; border-color:transparent; background-image:none; padding-right:10px; }

    .meta-pair{ font-size:0.85rem; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:6px; }
    .meta-pair strong{ color:#d7e2ef; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .empty-msg{ color:var(--muted); font-size:0.98rem; padding:20px 0; }

    .modal { display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.6); align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    .modal-content {
        position:relative;
        overflow:hidden;
        background:#ffffff;
        color:var(--navy);
        border:1px solid rgba(16,38,59,0.08);
        padding:30px;
        border-radius:20px;
        max-width:600px;
        width:90%;
        max-height:85vh;
        overflow-y:auto;
        box-shadow:0 24px 60px rgba(0,0,0,0.4);
    }
    .modal-content::before, .modal-content::after{
      content:""; position:absolute; border-radius:50%; filter:blur(10px); pointer-events:none; z-index:0;
    }
    .modal-content::before{
      width:320px; height:320px;
      background:radial-gradient(circle, rgba(0,104,88,0.14) 0%, transparent 70%);
      top:-120px; left:-100px;
    }
    .modal-content::after{
      width:340px; height:340px;
      background:radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 70%);
      bottom:-130px; right:-110px;
    }
    .modal-content > * { position:relative; z-index:1; }
    .close-btn { position:absolute; right:20px; top:16px; font-size:26px; font-weight:bold; cursor:pointer; color:#94a3b8; transition:color 0.2s; z-index:2; }
    .close-btn:hover { color:var(--navy); }

    .modal-content h3{
      color:var(--navy); font-size:1.2rem; font-weight:700;
      padding-bottom:16px; margin-bottom:4px; border-bottom:2px solid #e6ebef;
    }

    .vertical-table { width:100%; border-collapse:collapse; margin-top:15px; font-size:0.9rem; }
    .vertical-table th { text-align:left; padding:12px; background:#f1f5f8; border-bottom:1px solid #e6ebef; color:#5c6b7d; width:40%; font-weight:700; text-transform:uppercase; font-size:0.72rem; letter-spacing:0.05em; }
    .vertical-table td { padding:12px; border-bottom:1px solid #e6ebef; color:var(--navy); font-weight:500; word-break:break-word; background:#fff; }

    .edit-input {
        width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px;
        font-family: 'Montserrat', sans-serif; font-size: 0.85rem; background: #f8fafc; color: var(--navy);
    }
    .edit-input:focus { outline: none; border-color: var(--green); background: #fff; }
    .btn-save-modal {
        background: var(--green); color: #fff; border: none; padding: 10px 15px;
        border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Montserrat', sans-serif;
    }
    .btn-cancel-modal {
        background: #fff; color: var(--navy); border: 1px solid #cbd5e1; padding: 10px 15px;
        border-radius: 8px; cursor: pointer; font-weight: 600; font-family: 'Montserrat', sans-serif;
    }

    @media (max-width: 900px) { .container { max-width: 100%; } }
    @media (max-width: 640px) {
      body { padding: 12px; }
      .topbar { height: 52px; padding: 0 14px; border-radius: 10px; margin-bottom: 14px; }
      .topbar img { height: 26px; }
      .btn-back { padding: 0 12px; height: 30px; font-size: 13px; border-radius: 6px; }
      .header-title { margin-bottom: 20px; }
      .header-title h2 { font-size: 1.5rem; }
      .filters-row{ flex-direction:column; }
      select.filter-sel{ min-width:100%; }
      .inc-item { padding: 14px 16px; border-radius: 14px; }
      .inc-title { font-size: 0.92rem; }
      .badge{ font-size: 0.62rem; padding: 2px 8px; }
      .modal-content { padding: 20px 16px; border-radius: 14px; }
      .modal-content::before { width: 220px; height: 220px; top: -90px; left: -80px; }
      .modal-content::after { width: 240px; height: 240px; bottom: -100px; right: -90px; }
      .modal-content h3 { font-size: 1.1rem; }
      .vertical-table th, .vertical-table td { padding: 9px; font-size: 0.85rem; }
    }
    @media (max-width: 380px) {
      .modal-content { padding: 16px 12px; }
      .inc-title > span:first-child { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <script src="/ui-common.js"></script>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande.png" alt="Sugraf Logo" onerror="this.style.display='none'">
      <a href="/" class="btn-back">&larr; Volver</a>
    </div>

    <div class="topbar-right" id="zona-usuario" style="display:none;">
      <div class="dot"></div>
      <div class="dropdown">
        <span class="dropdown-trigger" id="user-display" onclick="toggleUserMenu()"><span id="user-name-text">Conectado</span> <span class="chev">&#9660;</span></span>
        <div id="user-menu" class="dropdown-content">
          <a href="#" onclick="cerrarSesion()">&#10162; Desconectar</a>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="header-title">
      <div class="eyebrow"><span class="dot-sm"></span> Servicio T&eacute;cnico</div>
      <h2>Organizador de Avisos</h2>
    </div>

    <div class="filters-row">
      <select id="filtro-tecnico" class="filter-sel" onchange="renderGestionAvisos()">
        <option value="Todos">Técnico: Todos</option>
        <option value="Pendiente">Sin Asignar</option>
        <option value="Ion Volog">Ion Volog</option>
        <option value="Francisco Antúnez">Francisco Antúnez</option>
        <option value="Daniel Gargallo">Daniel Gargallo</option>
        <option value="Técnico 4">Técnico 4</option>
      </select>
      <select id="filtro-pirineos" class="filter-sel" onchange="renderGestionAvisos()">
        <option value="Todos">Pirineos: Todos</option>
        <option value="SI">En Pirineos</option>
        <option value="NO">No Pirineos</option>
      </select>
      <select id="filtro-etiqueta" class="filter-sel" onchange="renderGestionAvisos()">
        <option value="Todos">Etiqueta: Todas</option>
        <option value="Ninguna">Sin Etiqueta</option>
        <option value="NUEVO">Nuevo</option>
        <option value="URGENTE">Urgente</option>
        <option value="PARADO">Parado</option>
        <option value="RECLAMA">Reclama</option>
        <option value="PRESUPUESTO">Presupuesto</option>
        <option value="PIEZAS PENDIENTE">Piezas Pendiente</option>
        <option value="PIEZAS LISTO">Piezas Listo</option>
        <option value="GARANTÍA">Garantía</option>
        <option value="MANTENIMIENTO">Mantenimiento</option>
        <option value="INSTALACIÓN">Instalación</option>
        <option value="REVISAR">Revisar</option>
      </select>
    </div>

    <div id="contenedor-gestionar">
      <p class="empty-msg">Cargando avisos del sistema...</p>
    </div>
  </div>

  <div id="aviso-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="cerrarModal()">&times;</span>
      <h3>Detalles del Aviso</h3>
      <table class="vertical-table" id="tabla-detalles"></table>
    </div>
  </div>

  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    if (!currentUser) window.location.href = "/";
    const TECNICOS_PERMITIDOS = ["Ion Volog", "Francisco Antúnez", "Daniel Gargallo", "Técnico 4"];

    document.getElementById("user-name-text").innerText = currentUser;
    document.getElementById("zona-usuario").style.display = "flex";

    function toggleUserMenu() {
        document.getElementById("user-menu").classList.toggle("show");
    }

    function cerrarSesion() {
      localStorage.removeItem("sugraf_user");
      window.location.href = "/";
    }

    const COLUMNAS_MOSTRAR = ['F. ENTR.', 'CLIENTE', 'POBLACIÓN', 'MÁQUINA', 'EQUIPO', 'MARCA', 'MODELO', 'Nº SERIE', 'F. GARANTÍA', 'F. INSTALACIÓN', 'DESCRIPCIÓN', 'ASIGNADO A', 'NUEVO', 'URGENTE', 'PARADO', 'RECLAMA', 'PRESUPUESTO', 'PIEZAS', 'PIRINEOS', 'GARANTÍA', 'MANTENIMIENTO', 'INSTALACIÓN', 'REVISAR', 'OBSERVACIONES'];

    let avisosGlobales = [];

    async function cargarGestionAvisos() {
      showLoading();
      try {
        const res = await fetch('/api/gestor/avisos');
        const data = await res.json();
        avisosGlobales = data.avisos || [];
        renderGestionAvisos();
      } catch (e) { document.getElementById('contenedor-gestionar').innerHTML = "<p class='empty-msg' style='color:#fca5a5;'>Error al cargar los avisos.</p>"; }
      finally { hideLoading(); }
    }

    function renderGestionAvisos() {
      const box = document.getElementById('contenedor-gestionar');
      const filtroTec = document.getElementById('filtro-tecnico').value;
      const filtroPir = document.getElementById('filtro-pirineos').value;
      const filtroEtiqueta = document.getElementById('filtro-etiqueta').value;
      
      const isTecnico = TECNICOS_PERMITIDOS.includes(currentUser);

      let filtrados = avisosGlobales.filter(av => {
        const matchTec = filtroTec === "Todos" || (av['ASIGNADO A'] || 'Pendiente') === filtroTec;
        const matchPir = filtroPir === "Todos" || av['PIRINEOS'] === filtroPir;
        
        let matchEtiqueta = true;
        if (filtroEtiqueta === "Ninguna") {
            matchEtiqueta = av['NUEVO'] !== 'SI' && av['URGENTE'] !== 'SI' && av['PARADO'] !== 'SI' && av['RECLAMA'] !== 'SI' && av['PRESUPUESTO'] !== 'SI' && av['PIEZAS'] !== 'Pendiente' && av['PIEZAS'] !== 'Listo' && av['GARANTÍA'] !== 'SI' && av['MANTENIMIENTO'] !== 'SI' && av['INSTALACIÓN'] !== 'SI' && av['REVISAR'] !== 'SI';
        } else if (filtroEtiqueta === "PIEZAS PENDIENTE") {
            matchEtiqueta = av['PIEZAS'] === 'Pendiente';
        } else if (filtroEtiqueta === "PIEZAS LISTO") {
            matchEtiqueta = av['PIEZAS'] === 'Listo';
        } else if (filtroEtiqueta !== "Todos") {
            matchEtiqueta = av[filtroEtiqueta] === 'SI';
        }

        return matchTec && matchPir && matchEtiqueta;
      });

      filtrados.sort((a, b) => {
          const aPendiente = (a['ASIGNADO A'] === 'Pendiente' || !a['ASIGNADO A']) ? 0 : 1;
          const bPendiente = (b['ASIGNADO A'] === 'Pendiente' || !b['ASIGNADO A']) ? 0 : 1;
          
          if (aPendiente !== bPendiente) {
              return aPendiente - bPendiente;
          }
          const clientA = (a['CLIENTE'] || '').toLowerCase();
          const clientB = (b['CLIENTE'] || '').toLowerCase();
          return clientA.localeCompare(clientB);
      });

      let html = "";
      filtrados.forEach((av) => {
        const i = av.original_index;
        const fuente = av.fuente;
        const esPirineos = av['PIRINEOS'] === 'SI';
        const tecActual = av['ASIGNADO A'] || 'Pendiente';
        const estadoAviso = av['ESTADO'] || '';
        
        let disableSelect = (estadoAviso === 'Abierto' || estadoAviso === 'Cerrado') ? "disabled" : "";
        let titleText = disableSelect ? 'title="El aviso ya ha sido abierto por el técnico y no se puede reasignar."' : '';
        
        if (isTecnico && tecActual !== 'Pendiente' && tecActual !== currentUser) {
            disableSelect = "disabled";
            titleText = 'title="No puedes modificar un aviso asignado a otro técnico."';
        }
        
        let tecOptions = `<option value="Pendiente" ${tecActual === 'Pendiente' ? 'selected' : ''}>Sin Asignar</option>`;
        
        if (isTecnico) {
            tecOptions += `<option value="${currentUser}" ${tecActual === currentUser ? 'selected' : ''}>${currentUser}</option>`;
            if (tecActual !== 'Pendiente' && tecActual !== currentUser) {
                tecOptions += `<option value="${tecActual}" selected disabled>${tecActual}</option>`;
            }
        } else if (currentUser === "Master") {
            TECNICOS_PERMITIDOS.forEach(t => { tecOptions += `<option value="${t}" ${tecActual === t ? 'selected' : ''}>${t}</option>`; });
        }

        const disablePirineos = (currentUser !== "Master") ? "disabled" : "";
        
        let badgesHtml = "";
        
        if(estadoAviso === 'Abierto') badgesHtml += `<span class="badge" style="background:#dbeafe; color:#2563eb; border-color:#bfdbfe;">Abierto</span>`;
        if(estadoAviso === 'Cerrado') badgesHtml += `<span class="badge" style="background:#f3f4f6; color:#4b5563; border-color:#d1d5db;">Cerrado</span>`;
        
        if(av['NUEVO'] === 'SI') badgesHtml += `<span class="badge bg-nuevo">Nuevo</span>`;
        if(av['URGENTE'] === 'SI') badgesHtml += `<span class="badge bg-urg">Urgente</span>`;
        if(av['PARADO'] === 'SI') badgesHtml += `<span class="badge bg-parado">Parado</span>`;
        if(av['RECLAMA'] === 'SI') badgesHtml += `<span class="badge bg-reclama">Reclama</span>`;
        if(av['PRESUPUESTO'] === 'SI') badgesHtml += `<span class="badge bg-presupuesto">Presupuesto</span>`;
        if(av['PIEZAS'] === 'Pendiente') badgesHtml += `<span class="badge bg-piezas">Piezas Pendiente</span>`;
        if(av['PIEZAS'] === 'Listo') badgesHtml += `<span class="badge bg-piezas-listo">Piezas Listo</span>`;
        if(av['GARANTÍA'] === 'SI') badgesHtml += `<span class="badge bg-gar">Garantía</span>`;
        if(av['MANTENIMIENTO'] === 'SI') badgesHtml += `<span class="badge bg-man">Mantenimiento</span>`;
        if(av['INSTALACIÓN'] === 'SI') badgesHtml += `<span class="badge bg-ins">Instalación</span>`;
        if(av['REVISAR'] === 'SI') badgesHtml += `<span class="badge bg-rev">Revisar</span>`;
        
        let btnDelete = "";
        if (currentUser === "Master") {
            btnDelete = `<button class="btn-delete" onclick="event.stopPropagation(); eliminarAviso(${i}, '${fuente}')" title="Eliminar aviso">🗑️</button>`;
        }

        html += `
          <div class="inc-item" onclick="abrirDetalles(${i}, '${fuente}')">
            <div class="inc-title">
              <span style="flex:1; min-width: 200px; display:flex; align-items:center;">
                  ${btnDelete}
                  ${av['CLIENTE']} 
                  <span class="badge-container">${badgesHtml}</span>
              </span>
              <div style="display: flex; gap: 14px; align-items: center; flex-wrap: wrap;">
                <span class="meta-pair">
                  <strong>Asignado a:</strong>
                  <select class="action-sel" onclick="event.stopPropagation()" onchange="actualizarTecnico(${i}, '${fuente}', this)" ${disableSelect} ${titleText}>
                    ${tecOptions}
                  </select>
                </span>
                <span class="meta-pair">
                  <strong>Pirineos:</strong>
                  <select class="action-sel" onclick="event.stopPropagation()" onchange="actualizarPirineos(${i}, '${fuente}', this)" ${disablePirineos}>
                    <option value="NO" ${!esPirineos ? 'selected' : ''}>No</option>
                    <option value="SI" ${esPirineos ? 'selected' : ''}>Sí</option>
                  </select>
                </span>
              </div>
            </div>
            <div class="inc-sub">Fecha: ${av['F. ENTR.']} | Máquina: ${av['MÁQUINA']}</div>
          </div>
        `;
      });

      box.innerHTML = html || "<p class='empty-msg'>No hay avisos que coincidan con los filtros.</p>";
    }

    function abrirDetalles(index, fuente) {
        const av = avisosGlobales.find(a => a.original_index === index && a.fuente === fuente);
        let html = "";
        
        const estadoAviso = av['ESTADO'] || '';
        const canEdit = (currentUser === "Master" && estadoAviso !== 'Abierto' && estadoAviso !== 'Cerrado');
        
        COLUMNAS_MOSTRAR.forEach(key => {
            if (key === 'OBSERVACIONES' && currentUser !== "Master") return; 

            let val = (av[key] !== null && av[key] !== undefined && av[key] !== '') ? String(av[key]) : '';
            
            if (canEdit && key !== 'ASIGNADO A' && key !== 'ESTADO') {
                if (['NUEVO', 'URGENTE', 'PARADO', 'RECLAMA', 'PRESUPUESTO', 'PIRINEOS', 'GARANTÍA', 'MANTENIMIENTO', 'INSTALACIÓN', 'REVISAR'].includes(key)) {
                    html += `<tr><th>${key}</th><td>
                        <select id="edit_${key}" class="edit-input">
                            <option value="NO" ${val !== 'SI' ? 'selected' : ''}>NO</option>
                            <option value="SI" ${val === 'SI' ? 'selected' : ''}>SI</option>
                        </select>
                    </td></tr>`;
                } else if (key === 'PIEZAS') {
                    html += `<tr><th>${key}</th><td>
                        <select id="edit_${key}" class="edit-input">
                            <option value="NO" ${val !== 'Pendiente' && val !== 'Listo' ? 'selected' : ''}>NO</option>
                            <option value="Pendiente" ${val === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                            <option value="Listo" ${val === 'Listo' ? 'selected' : ''}>Listo</option>
                        </select>
                    </td></tr>`;
                } else if (key === 'DESCRIPCIÓN') {
                    html += `<tr><th>${key}</th><td><textarea id="edit_${key}" class="edit-input" rows="3">${val}</textarea></td></tr>`;
                } else if (key === 'OBSERVACIONES') {
                    html += `<tr><th>${key}</th><td><textarea id="edit_${key}" class="edit-input" rows="4" placeholder="Solo visible por Master...">${val}</textarea></td></tr>`;
                } else {
                    html += `<tr><th>${key}</th><td><input type="text" id="edit_${key}" class="edit-input" value="${val.replace(/"/g, '&quot;')}"></td></tr>`;
                }
            } else {
                html += `<tr><th>${key}</th><td>${val || '-'}</td></tr>`;
            }
        });
        
        document.getElementById('tabla-detalles').innerHTML = html;
        
        let footerContainer = document.getElementById('modal-footer');
        if(!footerContainer) {
            document.getElementById('tabla-detalles').insertAdjacentHTML('afterend', '<div id="modal-footer" style="margin-top: 15px; text-align: right; display:flex; justify-content:flex-end; gap:10px;"></div>');
            footerContainer = document.getElementById('modal-footer');
        }

        if (canEdit) {
            footerContainer.innerHTML = `
                <button type="button" class="btn-cancel-modal" onclick="cerrarModal()">Cancelar</button>
                <button type="button" class="btn-save-modal" onclick="guardarEdicionAviso(${index}, '${fuente}')">Guardar Cambios</button>
            `;
        } else {
            footerContainer.innerHTML = ``;
        }
        
        document.getElementById('aviso-modal').style.display = 'flex';
    }

    async function guardarEdicionAviso(index, fuente) {
        const btn = document.querySelector('.btn-save-modal');
        if(btn) { btn.innerText = "Guardando..."; btn.disabled = true; }

        const payload = { aviso_index: index, fuente: fuente, datos: {} };
        COLUMNAS_MOSTRAR.forEach(key => {
            if (key !== 'ASIGNADO A' && key !== 'ESTADO') {
                const el = document.getElementById('edit_' + key);
                if (el) {
                    payload.datos[key] = el.value;
                }
            }
        });

        showLoading();
        try {
            const res = await fetch('/api/gestor/editar-aviso', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (!res.ok) {
                const err = await res.json();
                hideLoading();
                await appAlert(err.detail || "Error al guardar el aviso.", {type: 'error'});
            } else {
                cerrarModal();
                cargarGestionAvisos();
            }
        } catch (e) {
            hideLoading();
            await appAlert("Error de red.", {type: 'error'});
        } finally {
            hideLoading();
        }
        if(btn) { btn.innerText = "Guardar Cambios"; btn.disabled = false; }
    }

    function cerrarModal() { document.getElementById('aviso-modal').style.display = 'none'; }
    window.onclick = function(event) {
        if (event.target === document.getElementById('aviso-modal')) cerrarModal();
        if (!event.target.closest(".dropdown")) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains("show")) {
                    dropdowns[i].classList.remove("show");
                }
            }
        }
    }

    async function actualizarPirineos(index, fuente, selectElement) {
      const valor = selectElement.value;
      selectElement.disabled = true;
      showLoading();
      try {
        await fetch('/api/gestor/actualizar-pirineos', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ aviso_index: index, fuente: fuente, valor: valor }) });
        cargarGestionAvisos();
      } catch (err) {
        hideLoading();
        await appAlert("Error al actualizar la celda Pirineos.", {type: 'error'});
        cargarGestionAvisos();
      } finally {
        hideLoading();
      }
    }

    async function actualizarTecnico(index, fuente, selectElement) {
      const valor = selectElement.value;
      selectElement.disabled = true;
      
      showLoading();
      try {
        const res = await fetch('/api/gestor/actualizar-tecnico', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ aviso_index: index, fuente: fuente, valor: valor })
        });
        if (!res.ok) {
            const err = await res.json();
            hideLoading();
            await appAlert(err.detail || "Error al asignar técnico.", {type: 'error'});
            cargarGestionAvisos();
            return;
        }
        cargarGestionAvisos();
      } catch (err) {
        hideLoading();
        await appAlert("Error al asignar técnico.", {type: 'error'});
        cargarGestionAvisos();
      } finally {
        hideLoading();
      }
    }

    async function eliminarAviso(index, fuente) {
        const confirmado = await appConfirm("¿Estás seguro de que quieres ELIMINAR este aviso permanentemente?");
        if (confirmado) {
            showLoading();
            try {
                const res = await fetch('/api/gestor/eliminar-aviso', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ aviso_index: index, fuente: fuente, valor: "" })
                });
                if (!res.ok) {
                    const err = await res.json();
                    hideLoading();
                    await appAlert(err.detail || "Error al eliminar el aviso.", {type: 'error'});
                    return;
                }
                cargarGestionAvisos();
            } catch (err) {
                hideLoading();
                await appAlert("Error al eliminar el aviso.", {type: 'error'});
            } finally {
                hideLoading();
            }
        }
    }

    cargarGestionAvisos();
  </script>
</body>
</html>
