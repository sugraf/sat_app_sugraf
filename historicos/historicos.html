<!-- historicos.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10263B">
  <title>Históricos SAT - Sugraf Digital Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui-common.css">

  <style>
    :root{
      --navy:#10263B;
      --navy-dark:#0a1826;
      --navy-light:#173654;
      --green:#006858;
      --green-dark:#004d40;
      --green-soft:rgba(0,104,88,0.15);
      --grey:#B6BEC4;
      --ink:#f4f8fc;
      --muted:#a9bcd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Montserrat', sans-serif;
        background-color: var(--navy);
        background-image:
          radial-gradient(900px circle at 15% -5%, rgba(0,104,88,0.28) 0%, transparent 55%),
          radial-gradient(900px circle at 90% 10%, rgba(182,190,196,0.10) 0%, transparent 55%),
          radial-gradient(1200px circle at 50% 120%, rgba(0,104,88,0.12) 0%, transparent 60%);
        background-attachment: fixed;
        color: var(--ink);
        min-height: 100vh;
    }
    h1, h2, h3 { font-weight:700; letter-spacing:-0.01em; }

    .topbar {
      background:#ffffff; height:64px; display:flex; align-items:center; padding:0 24px;
      justify-content:space-between; position:sticky; top:0; z-index:100;
      box-shadow:0 1px 0 rgba(16,38,59,0.08), 0 4px 16px rgba(16,38,59,0.04);
    }
    .topbar-left{ display:flex; align-items:center; gap:16px; height:100%; }
    .topbar img{ height:35px; object-fit:contain; display:block; }
    .btn-back{
      display:flex; align-items:center; gap:6px; color:#4a5a72; text-decoration:none; font-weight:600; font-size:0.85rem;
      padding:8px 14px; border-radius:10px; border:1px solid #e2e8f0; transition:background 0.15s, border-color 0.15s;
    }
    .btn-back:hover{ background:#f1f5f8; border-color:#cbd5e1; }
    .topbar-right { color:#4a5a72; font-size:13px; font-weight:600; display:flex; align-items:center; gap:9px; }
    .dot { width:8px; height:8px; background:var(--green); border-radius:50%; box-shadow:0 0 0 4px var(--green-soft); }

    .container { max-width:1040px; margin:0 auto; padding:20px; }
    .header-title{ text-align:center; margin:40px 0 28px; }
    .header-title h2 { font-size:2rem; margin-bottom:8px; }
    .header-title p{ color:var(--muted); font-size:0.95rem; }

    .filtros {
      background:#ffffff; color:var(--navy); border-radius:18px; padding:22px;
      box-shadow:0 24px 60px rgba(0,0,0,0.35);
    }
    .filtros-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px 14px; }
    label { display:block; font-size:0.68rem; font-weight:700; color:#5c6b7d; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.08em; }
    label .opcional{ text-transform:none; letter-spacing:0; font-weight:600; color:#94a3b8; }
    input, select {
      width:100%; padding:11px 12px; border:1px solid var(--grey); border-radius:10px;
      font-size:0.9rem; font-family:'Montserrat', sans-serif; background:#ffffff; color:var(--navy);
      transition:border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder{ color:#94a3b8; }
    input:focus, select:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }
    input:disabled{ background:#f1f5f8; color:#94a3b8; border-style:dashed; cursor:not-allowed; }
    select{ appearance:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%23006858" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>'); background-repeat:no-repeat; background-position:right 12px center; background-size:16px; padding-right:36px; }

    /* Desplegable con buscador (mismo estilo que el generador de avisos) */
    .custom-select-wrapper { position: relative; }
    .custom-select-wrapper input { width: 100%; padding-right: 30px; }
    .custom-select-wrapper::after { content: '▼'; position: absolute; right: 12px; bottom: 13px; font-size: 0.8rem; color: var(--green); pointer-events: none; }
    .custom-select-list { display: none; position: absolute; z-index: 1000; top: calc(100% - 2px); left: 0; right: 0; background: #ffffff; border: 1px solid var(--grey); border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; max-height: 260px; overflow-y: auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .custom-select-list.show { display: block; }
    .custom-select-item { padding: 12px 16px; font-size: 0.9rem; color: var(--navy); cursor: pointer; border-bottom: 1px solid #e6ebef; }
    .custom-select-item:hover { background: var(--green-soft); color: var(--green); }
    .custom-select-item small { display:block; color:#94a3b8; font-size:0.75rem; margin-top:2px; }
    .custom-select-item.vacio { color:#94a3b8; font-style:italic; cursor:default; }
    .custom-select-item.vacio:hover { background:#fff; color:#94a3b8; }

    .fechas{ display:flex; gap:8px; grid-column:1 / -1; }
    .fechas > div{ flex:1; }
    .filtros-acciones{ display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
    .btn {
      border:none; padding:11px 18px; border-radius:10px; font-size:0.85rem; font-weight:700; cursor:pointer;
      font-family:'Montserrat', sans-serif; transition:background 0.2s, transform 0.15s;
    }
    .btn-primary{ background:var(--green); color:#fff; }
    .btn-primary:hover{ background:var(--green-dark); }
    .btn-light{ background:#f1f5f8; color:#4a5a72; border:1px solid #e2e8f0; }
    .btn-light:hover{ background:#e2e8f0; }
    .btn:disabled{ opacity:0.6; cursor:not-allowed; }

    .resumen{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:26px 0 12px; color:var(--muted); font-size:0.85rem; }
    .resumen strong{ color:var(--ink); }
    .orden{ display:flex; align-items:center; gap:8px; }
    .orden select{ width:auto; padding:7px 34px 7px 10px; font-size:0.8rem; background-color:var(--navy-light); color:var(--ink); border-color:rgba(182,190,196,0.25); }

    .item {
      background:linear-gradient(160deg, var(--navy-light) 0%, var(--navy) 100%);
      border:1px solid rgba(182,190,196,0.14); border-radius:14px; padding:16px 18px; margin-bottom:10px;
      animation:fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .item-head{ display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline; margin-bottom:8px; }
    .item-fecha{ font-weight:800; color:#fff; font-size:0.95rem; }
    .link{ color:#7fd9c7; font-weight:700; cursor:pointer; background:none; border:none; font-family:inherit; font-size:0.92rem; text-align:left; padding:0; }
    .link:hover{ text-decoration:underline; }
    .item-meta{ display:flex; flex-wrap:wrap; gap:4px 14px; font-size:0.78rem; color:var(--muted); margin-bottom:8px; }
    .item-meta .link{ font-size:0.78rem; color:#93c5fd; font-weight:600; }
    .item-txt{ font-size:0.86rem; line-height:1.45; white-space:pre-wrap; word-break:break-word; color:#e2e8f0; }
    .item-txt b{ color:var(--muted); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; }
    .item-txt + .item-txt{ margin-top:4px; }

    .empty-msg{ color:var(--muted); font-size:0.95rem; padding:24px 0; text-align:center; }
    .mas{ display:flex; justify-content:center; margin:18px 0 30px; }
    .mas .btn{ min-width:220px; }
    .fuentes{ text-align:center; color:#5c7291; font-size:0.72rem; margin:10px 0 30px; }

    @media (max-width: 800px) {
      .filtros-grid{ grid-template-columns:1fr 1fr; }
    }
    @media (max-width: 560px) {
      .container { padding:12px; }
      .topbar { height:52px; padding:0 14px; }
      .topbar img { height:26px; }
      .header-title { margin:24px 0 20px; }
      .header-title h2 { font-size:1.5rem; }
      .filtros{ padding:16px; border-radius:14px; }
      .filtros-grid{ grid-template-columns:1fr; }
      .filtros-acciones .btn{ flex:1; }
      .custom-select-item { padding: 11px 14px; }
      .item{ padding:14px; }
    }
  </style>
</head>
<body>
  <script src="/ui-common.js"></script>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande.png" alt="Sugraf Logo" onerror="this.style.display='none'">
      <a href="/" class="btn-back">&larr; Volver</a>
    </div>
    <div class="topbar-right" id="zona-usuario" style="display:none;">
      <div class="dot"></div>
      <span id="user-name-text">Conectado</span>
    </div>
  </div>

  <div class="container">
    <div class="header-title">
      <h2>Históricos SAT</h2>
      <p>Consulta los partes realizados por cliente y por máquina.</p>
    </div>

    <div class="filtros">
      <div class="filtros-grid">
        <div>
          <label for="f_cliente">Cliente</label>
          <div class="custom-select-wrapper">
            <input type="text" id="f_cliente" autocomplete="off" placeholder="Escribe para buscar o desplegar...">
            <div id="lista-clientes" class="custom-select-list"></div>
          </div>
        </div>
        <div>
          <label for="f_modelo">Máquina (modelo)</label>
          <div class="custom-select-wrapper">
            <input type="text" id="f_modelo" autocomplete="off" placeholder="Escribe para buscar o desplegar...">
            <div id="lista-modelos" class="custom-select-list"></div>
          </div>
        </div>
        <div>
          <label for="f_n_serie">Nº serie <span class="opcional">(del modelo elegido)</span></label>
          <div class="custom-select-wrapper">
            <input type="text" id="f_n_serie" autocomplete="off" placeholder="Elige antes una máquina" disabled>
            <div id="lista-series" class="custom-select-list"></div>
          </div>
        </div>
        <div class="fechas">
          <div>
            <label for="f_desde">Desde</label>
            <input type="date" id="f_desde">
          </div>
          <div>
            <label for="f_hasta">Hasta</label>
            <input type="date" id="f_hasta">
          </div>
        </div>
      </div>
      <div class="filtros-acciones">
        <button type="button" class="btn btn-light" onclick="limpiarFiltros()">Limpiar filtros</button>
        <button type="button" class="btn btn-primary" onclick="exportarExcel()">Descargar Excel</button>
      </div>
    </div>

    <div class="resumen">
      <span id="resumen-txt">Cargando histórico...</span>
      <span class="orden">
        <label for="f_orden" style="margin:0; color:var(--muted);">Orden</label>
        <select id="f_orden">
          <option value="desc">Más recientes primero</option>
          <option value="asc">Más antiguos primero</option>
        </select>
      </span>
    </div>

    <div id="lista"></div>
    <div class="mas" id="zona-mas" style="display:none;">
      <button type="button" class="btn btn-light" id="btn-mas" onclick="cargarMas()">Cargar más</button>
    </div>
    <p class="fuentes" id="fuentes"></p>
  </div>

  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    if (!currentUser) window.location.href = "/";
    document.getElementById("user-name-text").innerText = currentUser;
    document.getElementById("zona-usuario").style.display = "flex";

    const POR_PAGINA = 50;
    const CAMPOS = ['cliente', 'modelo', 'n_serie', 'desde', 'hasta', 'orden'];
    let combinaciones = [];   // [{cliente, comercial, modelo, n_serie}]
    let pagina = 1;
    let totalResultados = 0;
    let cargados = 0;
    let peticionActual = 0;

    function escHtml(valor) {
        return String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function normalizar(t) {
        return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
    }

    function fechaCorta(iso) {
        const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
        return m ? `${m[3]}/${m[2]}/${m[1]}` : (iso || '');
    }

    function valor(campo) {
        return document.getElementById(`f_${campo}`).value.trim();
    }

    function distintos(lista, campo) {
        return [...new Set(lista.map(c => c[campo]).filter(Boolean))]
            .sort((a, b) => a.localeCompare(b, 'es'));
    }

    // ---- Opciones de cada desplegable, encadenadas: cliente -> modelo -> nº serie ----
    function clienteElegido() {
        const v = normalizar(valor('cliente'));
        return v ? combinaciones.find(c => normalizar(c.cliente) === v)?.cliente || null : null;
    }

    function modeloElegido() {
        const v = normalizar(valor('modelo'));
        return v ? combinaciones.find(c => normalizar(c.modelo) === v)?.modelo || null : null;
    }

    function opcionesClientes() {
        const comercial = {};
        combinaciones.forEach(c => { if (c.comercial) comercial[c.cliente] = c.comercial; });
        return distintos(combinaciones, 'cliente').map(v => ({valor: v, extra: comercial[v] || ''}));
    }

    function opcionesModelos() {
        const cliente = clienteElegido();
        const lista = cliente ? combinaciones.filter(c => c.cliente === cliente) : combinaciones;
        return distintos(lista, 'modelo').map(v => ({valor: v}));
    }

    function opcionesSeries() {
        const modelo = modeloElegido();
        if (!modelo) return [];
        const cliente = clienteElegido();
        const lista = combinaciones.filter(c => c.modelo === modelo && (!cliente || c.cliente === cliente));
        return distintos(lista, 'n_serie').map(v => ({valor: v}));
    }

    function actualizarDependientes() {
        // Si el modelo no pertenece al cliente elegido, o la serie al modelo, se vacían.
        if (valor('modelo') && clienteElegido() && !opcionesModelos().some(o => normalizar(o.valor) === normalizar(valor('modelo')))) {
            document.getElementById('f_modelo').value = '';
        }
        const serie = document.getElementById('f_n_serie');
        const hayModelo = !!modeloElegido();
        serie.disabled = !hayModelo;
        serie.placeholder = hayModelo ? 'Todos (escribe para buscar)' : 'Elige antes una máquina';
        if (!hayModelo || (serie.value && !opcionesSeries().some(o => normalizar(o.valor) === normalizar(serie.value)))) {
            serie.value = '';
        }
    }

    function setupCustomDropdown(inputId, dropdownId, getOptionsCallback, onChange) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        let ultimo = input.value;

        const renderOptions = (filterText = "") => {
            const filtro = normalizar(filterText);
            const filtered = getOptionsCallback().filter(o =>
                normalizar(o.valor).includes(filtro) || normalizar(o.extra).includes(filtro)
            );

            dropdown.innerHTML = '';
            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="custom-select-item vacio">No hay coincidencias</div>';
                return;
            }
            filtered.forEach(opt => {
                const item = document.createElement('div');
                item.className = 'custom-select-item';
                item.textContent = opt.valor;
                if (opt.extra) {
                    const extra = document.createElement('small');
                    extra.textContent = opt.extra;
                    item.appendChild(extra);
                }
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    input.value = opt.valor;
                    dropdown.classList.remove('show');
                    input.blur();
                });
                dropdown.appendChild(item);
            });
        };

        input.addEventListener('focus', () => {
            renderOptions('');
            dropdown.classList.add('show');
        });
        input.addEventListener('input', (e) => {
            renderOptions(e.target.value);
            dropdown.classList.add('show');
        });
        input.addEventListener('blur', () => {
            setTimeout(() => {
                dropdown.classList.remove('show');
                // Si lo escrito coincide con una opción, se normaliza a su texto exacto.
                const exacta = getOptionsCallback().find(o => normalizar(o.valor) === normalizar(input.value));
                if (exacta) input.value = exacta.valor;
                if (input.value !== ultimo) {
                    ultimo = input.value;
                    onChange();
                }
            }, 150);
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        });
        return { sincronizar: () => { ultimo = input.value; } };
    }

    let dropdowns = [];
    function alCambiarFiltro() {
        actualizarDependientes();
        dropdowns.forEach(d => d.sincronizar());
        buscar();
    }

    // ---- Búsqueda ----
    function paramsFiltros(extra = {}) {
        const p = new URLSearchParams();
        CAMPOS.forEach(c => { if (valor(c)) p.set(c, valor(c)); });
        Object.entries(extra).forEach(([k, v]) => p.set(k, v));
        return p;
    }

    async function buscar(reiniciar = true) {
        const idPeticion = ++peticionActual;
        if (reiniciar) { pagina = 1; cargados = 0; }
        if (reiniciar) document.getElementById('resumen-txt').innerText = 'Buscando...';

        try {
            const res = await fetch(`/api/historicos/buscar?${paramsFiltros({pagina, por_pagina: POR_PAGINA})}`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || `Error HTTP: ${res.status}`);
            if (idPeticion !== peticionActual) return; // llegó una búsqueda más reciente

            totalResultados = data.total;
            cargados += data.registros.length;
            const html = data.registros.map(tarjeta).join('');
            const lista = document.getElementById('lista');
            if (reiniciar) lista.innerHTML = html || `<p class="empty-msg">No hay partes que cumplan los filtros.</p>`;
            else lista.insertAdjacentHTML('beforeend', html);

            document.getElementById('resumen-txt').innerHTML =
                `<strong>${data.total.toLocaleString('es-ES')}</strong> partes · <strong>${data.clientes}</strong> clientes` +
                (data.total > cargados ? ` · mostrando ${cargados}` : '');
            document.getElementById('zona-mas').style.display = data.total > cargados ? 'flex' : 'none';
        } catch (e) {
            if (idPeticion !== peticionActual) return;
            document.getElementById('resumen-txt').innerText = '';
            document.getElementById('lista').innerHTML = `<p class="empty-msg" style="color:#fca5a5;">Error: ${escHtml(e.message)}</p>`;
        }
    }

    async function cargarMas() {
        const btn = document.getElementById('btn-mas');
        btn.disabled = true; btn.innerText = 'Cargando...';
        pagina += 1;
        await buscar(false);
        btn.disabled = false; btn.innerText = 'Cargar más';
    }

    function tarjeta(r) {
        const maquina = [r.equipo, r.marca, r.modelo].filter(Boolean).join(' · ');
        return `
        <div class="item">
            <div class="item-head">
                <span class="item-fecha">${escHtml(fechaCorta(r.fecha))}</span>
                <button type="button" class="link" data-cliente="${escHtml(r.cliente)}">${escHtml(r.cliente)}</button>
                ${r.nombre_comercial ? `<span style="color:var(--muted); font-size:0.82rem;">(${escHtml(r.nombre_comercial)})</span>` : ''}
            </div>
            <div class="item-meta">
                ${r.modelo
                    ? `<button type="button" class="link" data-modelo="${escHtml(r.modelo)}" data-serie="${escHtml(r.n_serie)}">${escHtml(maquina)}${r.n_serie ? ` (S/N ${escHtml(r.n_serie)})` : ''}</button>`
                    : `<span>${escHtml(maquina) || 'Sin máquina indicada'}${r.n_serie ? ` (S/N ${escHtml(r.n_serie)})` : ''}</span>`}
                <span>${escHtml(r.tecnico)}</span>
                <span>Parte ${escHtml(r.n_parte)}</span>
            </div>
            <div class="item-txt"><b>Anomalía:</b> ${escHtml(r.anomalia)}</div>
            <div class="item-txt"><b>Solución:</b> ${escHtml(r.solucion)}</div>
        </div>`;
    }

    // Pulsar en un cliente o en una máquina de un parte filtra por ese valor.
    document.getElementById('lista').addEventListener('click', e => {
        const el = e.target.closest('.link');
        if (!el) return;
        if (el.dataset.cliente !== undefined) {
            document.getElementById('f_cliente').value = el.dataset.cliente;
        } else {
            document.getElementById('f_modelo').value = el.dataset.modelo;
            actualizarDependientes();
            document.getElementById('f_n_serie').value = el.dataset.serie || '';
        }
        alCambiarFiltro();
        window.scrollTo({top: 0, behavior: 'smooth'});
    });

    function limpiarFiltros() {
        CAMPOS.filter(c => c !== 'orden').forEach(c => { document.getElementById(`f_${c}`).value = ''; });
        alCambiarFiltro();
    }

    function exportarExcel() {
        if (totalResultados === 0) {
            appAlert('No hay partes que exportar con los filtros actuales.', {type: 'error'});
            return;
        }
        window.location.href = `/api/historicos/exportar?${paramsFiltros()}`;
    }

    ['f_desde', 'f_hasta', 'f_orden'].forEach(id => document.getElementById(id).addEventListener('change', () => buscar()));

    async function iniciar() {
        showLoading();
        try {
            const res = await fetch('/api/historicos/opciones');
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || `Error HTTP: ${res.status}`);
            combinaciones = data.combinaciones;
            document.getElementById('fuentes').innerText =
                `${data.total.toLocaleString('es-ES')} partes · datos hasta ${fechaCorta(data.fecha_max)}`;

            dropdowns = [
                setupCustomDropdown('f_cliente', 'lista-clientes', opcionesClientes, alCambiarFiltro),
                setupCustomDropdown('f_modelo', 'lista-modelos', opcionesModelos, alCambiarFiltro),
                setupCustomDropdown('f_n_serie', 'lista-series', opcionesSeries, alCambiarFiltro),
            ];
            await buscar();
        } catch (e) {
            document.getElementById('resumen-txt').innerText = '';
            document.getElementById('lista').innerHTML = `<p class="empty-msg" style="color:#fca5a5;">Error: ${escHtml(e.message)}</p>`;
        } finally {
            hideLoading();
        }
    }

    iniciar();

    // Filtros en pantalla, para el asistente IA (chatbot.js).
    window.sugrafBotContexto = function () {
        const filtros = {};
        CAMPOS.filter(c => c !== 'orden').forEach(c => { if (valor(c)) filtros[c] = valor(c); });
        return {
            filtros,
            total: totalResultados,
            etiqueta: [filtros.cliente, filtros.modelo, filtros.n_serie].filter(Boolean).join(' · '),
        };
    };
  </script>
  <script src="/chatbot.js"></script>
</body>
