<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sugraf Digital Manager - HUB</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: #070e1c; color: #f4f8fc; min-height: 100vh; padding: 20px; }
    .topbar { background: #ffffff; height: 60px; display: flex; align-items: center; padding: 0 20px; justify-content: space-between; border-radius: 8px; margin-bottom: 20px;}
    .topbar img { height: 35px; }
    .topbar-right { color: #4a5a72; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor:pointer;}
    .dot { width: 7px; height: 7px; background: #2ea36b; border-radius: 50%; }
    .container { max-width: 900px; margin: 0 auto; }
    .text-center { text-align: center; margin-bottom: 30px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
    .card { background: #0f1e35; border: 1px solid rgba(79,156,217,0.18); border-radius: 18px; padding: 25px; cursor: pointer; text-align: center; }
    .card:hover { border-color: rgba(79,156,217,0.55); background: #1c3357; }
    .form-box { background: white; border-radius: 16px; padding: 25px; color: #1e293b; max-width: 400px; margin: 10vh auto; }
    label { display: block; margin: 15px 0 5px; font-weight: 600; font-size: 0.85rem;}
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; }
    button.btn { background: #4f9cd9; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 600; width: 100%; margin-top: 25px; cursor: pointer; }
    #view-dashboard { display: none; }
  </style>
</head>
<body>

  <div class="topbar">
    <div><img src="/logo_grande_azul.png" alt="Sugraf Logo" onerror="this.style.display='none'"></div>
    <div class="topbar-right" id="zona-usuario" style="display: none;" onclick="cerrarSesion()">
      <div class="dot"></div> <span id="user-display"></span> (Desconectar)
    </div>
  </div>

  <div id="view-login">
    <div class="form-box">
      <h2 style="text-align: center; margin-bottom: 20px;">Acceso Hub</h2>
      <label>Usuario</label>
      <select id="login-user">
        <option value="Ion Volog">Ion Volog</option>
        <option value="Francisco Antúnez">Francisco Antúnez</option>
        <option value="Daniel Gargallo">Daniel Gargallo</option>
        <option value="Emilio Arrieta">Emilio Arrieta</option>
        <option value="master">master</option>
      </select>
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="Introduce tu clave">
      <button class="btn" onclick="iniciarSesion()">Entrar al Sistema</button>
    </div>
  </div>

  <div id="view-dashboard" class="container">
    <div class="text-center">
      <h1>Digital Manager Hub</h1>
      <p>Selecciona una opción para comenzar.</p>
    </div>
    <div class="grid">
      <div class="card" onclick="irA('generador')">
        <h3>📝 Generador de Avisos</h3>
        <p style="color: #a9bcd6; font-size: 0.9rem; margin-top:10px;">Crear un nuevo aviso.</p>
      </div>
      <div class="card" onclick="irA('gestor')">
        <h3>🤝 Organizador de Avisos</h3>
        <p style="color: #a9bcd6; font-size: 0.9rem; margin-top:10px;">Asignar técnicos y estado.</p>
      </div>
      <div class="card" onclick="irA('adjudicados')">
        <h3>🔧 Mis Avisos Adjudicados</h3>
        <p style="color: #a9bcd6; font-size: 0.9rem; margin-top:10px;">Ver tus avisos asignados.</p>
      </div>
    </div>
  </div>

  <script>
    const USUARIOS = {
      "Ion Volog": "sugraf_1", "Francisco Antúnez": "sugraf_2", "Daniel Gargallo": "sugraf_3",
      "Emilio Arrieta": "sugraf_4", "master": "sugraf_5"
    };

    let currentUser = localStorage.getItem("sugraf_user");
    if (currentUser) mostrarHub();

    function iniciarSesion() {
      const u = document.getElementById("login-user").value;
      const p = document.getElementById("login-pass").value;
      if (USUARIOS[u] === p) {
        localStorage.setItem("sugraf_user", u);
        currentUser = u;
        mostrarHub();
      } else { alert("Contraseña incorrecta."); }
    }

    function cerrarSesion() {
      localStorage.removeItem("sugraf_user");
      location.reload();
    }

    function mostrarHub() {
      document.getElementById("view-login").style.display = "none";
      document.getElementById("view-dashboard").style.display = "block";
      document.getElementById("zona-usuario").style.display = "flex";
      document.getElementById("user-display").innerText = currentUser;
    }

    function irA(modulo) { window.location.href = `/vista/${modulo}`; }
  </script>
</body>
</html>
