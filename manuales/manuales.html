<!-- manuales.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#10263B">
  <title>Manuales Técnicos - Sugraf Digital Manager</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/ui-common.css">

  <style>
    :root{
      --navy:#10263B;
      --navy-dark:#0a1826;
      --navy-light:#173654;
      --green:#006858;
      --green-dark:#004d40;
      --green-soft:rgba(0,104,88,0.15);
      --grey:#B6BEC4;
      --ink:#f4f8fc;
      --muted:#a9bcd6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Montserrat', sans-serif;
        background-color: var(--navy);
        background-image:
          radial-gradient(900px circle at 15% -5%, rgba(0,104,88,0.28) 0%, transparent 55%),
          radial-gradient(900px circle at 90% 10%, rgba(182,190,196,0.10) 0%, transparent 55%),
          radial-gradient(1200px circle at 50% 120%, rgba(0,104,88,0.12) 0%, transparent 60%);
        background-attachment: fixed;
        color: var(--ink);
        min-height: 100vh;
    }
    h1, h2, h3 { font-weight:700; letter-spacing:-0.01em; }

    .topbar {
      background:#ffffff; height:64px; display:flex; align-items:center; padding:0 24px;
      justify-content:space-between; position:sticky; top:0; z-index:100;
      box-shadow:0 1px 0 rgba(16,38,59,0.08), 0 4px 16px rgba(16,38,59,0.04);
    }
    .topbar-left{ display:flex; align-items:center; gap:16px; height:100%; }
    .topbar img{ height:35px; object-fit:contain; display:block; }
    .btn-back{
      display:flex; align-items:center; gap:6px; color:#4a5a72; text-decoration:none; font-weight:600; font-size:0.85rem;
      padding:8px 14px; border-radius:10px; border:1px solid #e2e8f0; transition:background 0.15s, border-color 0.15s;
    }
    .btn-back:hover{ background:#f1f5f8; border-color:#cbd5e1; }
    .topbar-right { color:#4a5a72; font-size:13px; font-weight:600; display:flex; align-items:center; gap:9px; }
    .dot { width:8px; height:8px; background:var(--green); border-radius:50%; box-shadow:0 0 0 4px var(--green-soft); }

    .container { max-width:1040px; margin:0 auto; padding:20px; }
    .header-title{ text-align:center; margin:40px 0 28px; }
    .header-title h2 { font-size:2rem; margin-bottom:8px; }
    .header-title p{ color:var(--muted); font-size:0.95rem; }

    .filtros {
      background:#ffffff; color:var(--navy); border-radius:18px; padding:22px;
      box-shadow:0 24px 60px rgba(0,0,0,0.35);
    }
    .filtros-grid{ display:grid; grid-template-columns:repeat(3, 1fr); gap:12px 14px; }
    .filtros-grid .ancho{ grid-column:1 / -1; }
    label { display:block; font-size:0.68rem; font-weight:700; color:#5c6b7d; margin-bottom:6px; text-transform:uppercase; letter-spacing:0.08em; }
    input {
      width:100%; padding:11px 12px; border:1px solid var(--grey); border-radius:10px;
      font-size:0.9rem; font-family:'Montserrat', sans-serif; background:#ffffff; color:var(--navy);
      transition:border-color 0.15s, box-shadow 0.15s;
    }
    input::placeholder{ color:#94a3b8; }
    input:focus { outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft); }

    /* Desplegable con buscador (mismo estilo que el generador de avisos) */
    .custom-select-wrapper { position: relative; }
    .custom-select-wrapper input { width: 100%; padding-right: 30px; }
    .custom-select-wrapper::after { content: '▼'; position: absolute; right: 12px; bottom: 13px; font-size: 0.8rem; color: var(--green); pointer-events: none; }
    .custom-select-list { display: none; position: absolute; z-index: 1000; top: calc(100% - 2px); left: 0; right: 0; background: #ffffff; border: 1px solid var(--grey); border-bottom-left-radius: 8px; border-bottom-right-radius: 8px; max-height: 260px; overflow-y: auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    .custom-select-list.show { display: block; }
    .custom-select-item { padding: 12px 16px; font-size: 0.9rem; color: var(--navy); cursor: pointer; border-bottom: 1px solid #e6ebef; }
    .custom-select-item:hover { background: var(--green-soft); color: var(--green); }
    .custom-select-item small { display:block; color:#94a3b8; font-size:0.75rem; margin-top:2px; }
    .custom-select-item.vacio { color:#94a3b8; font-style:italic; cursor:default; }
    .custom-select-item.vacio:hover { background:#fff; color:#94a3b8; }

    .buscador{ position:relative; }
    .buscador svg{ position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; pointer-events:none; }
    .buscador input{ padding-left:36px; }

    .filtros-acciones{ display:flex; gap:10px; justify-content:flex-end; margin-top:16px; flex-wrap:wrap; }
    .btn {
      border:none; padding:11px 18px; border-radius:10px; font-size:0.85rem; font-weight:700; cursor:pointer;
      font-family:'Montserrat', sans-serif; transition:background 0.2s, transform 0.15s;
    }
    .btn-light{ background:#f1f5f8; color:#4a5a72; border:1px solid #e2e8f0; }
    .btn-light:hover{ background:#e2e8f0; }
    .btn:disabled{ opacity:0.6; cursor:not-allowed; }

    /* Accesos rápidos por marca */
    .marcas{ display:flex; gap:8px; flex-wrap:wrap; margin:20px 0 4px; }
    .chip-marca{
      background:rgba(255,255,255,0.04); color:var(--muted); border:1px solid rgba(182,190,196,0.2);
      padding:7px 13px; border-radius:999px; font-size:0.76rem; font-weight:700; cursor:pointer;
      font-family:'Montserrat', sans-serif; letter-spacing:0.02em; transition:background 0.15s, border-color 0.15s, color 0.15s;
    }
    .chip-marca span{ color:#5c7291; font-weight:600; margin-left:4px; }
    .chip-marca:hover{ border-color:rgba(0,104,88,0.6); color:var(--ink); }
    .chip-marca.active{ background:var(--green); border-color:var(--green); color:#fff; }
    .chip-marca.active span{ color:rgba(255,255,255,0.7); }

    .resumen{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:22px 0 12px; color:var(--muted); font-size:0.85rem; }
    .resumen strong{ color:var(--ink); }
    .aviso-excel{ color:#fca5a5; font-size:0.78rem; }

    .section-divider{
      margin:26px 0 12px; padding-bottom:8px; font-size:1rem; font-weight:700;
      color:var(--ink); border-bottom:1px solid rgba(182,190,196,0.18);
      display:flex; align-items:center; gap:8px;
    }
    .section-divider small{ color:var(--muted); font-weight:600; font-size:0.78rem; }
    .dot-status{ width:8px; height:8px; border-radius:50%; display:inline-block; background:#2fd9b8; box-shadow:0 0 0 4px var(--green-soft); }

    .modelos{ display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
    .item {
      background:linear-gradient(160deg, var(--navy-light) 0%, var(--navy) 100%);
      border:1px solid rgba(182,190,196,0.14); border-radius:14px; padding:16px 18px;
      animation:fadeIn 0.25s ease; min-width:0;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
    .item-head{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:4px; }
    .item-titulo{ font-weight:800; color:#fff; font-size:0.98rem; word-break:break-word; }
    .item-marca{ font-size:0.66rem; font-weight:700; color:#7fd9c7; text-transform:uppercase; letter-spacing:0.1em; white-space:nowrap; }
    .item-meta{ font-size:0.78rem; color:var(--muted); margin-bottom:10px; word-break:break-word; }
    .item-nota{ font-size:0.72rem; color:#fde68a; margin:-4px 0 8px; }
    .item-vacio{ font-size:0.82rem; color:var(--muted); padding:6px 0 2px; }
    .item-vacio .link{ margin-left:4px; }
    .link{ color:#7fd9c7; font-weight:700; cursor:pointer; background:none; border:none; font-family:inherit; font-size:inherit; padding:0; }
    .link:hover{ text-decoration:underline; }
    .carpeta-sub{ font-size:0.68rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; margin:10px 0 6px; }

    .manual{
      display:flex; align-items:center; gap:11px; padding:9px 10px; margin-top:6px;
      border-radius:10px; text-decoration:none; color:var(--ink);
      background:rgba(255,255,255,0.03); border:1px solid rgba(182,190,196,0.12);
      transition:background 0.15s, border-color 0.15s;
    }
    .manual:hover{ background:var(--green-soft); border-color:rgba(0,104,88,0.55); }
    .manual-icono{ flex:none; width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.22); border:1px solid rgba(182,190,196,0.14); }
    .manual-icono svg{ width:18px; height:18px; }
    .manual-txt{ flex:1; min-width:0; }
    .manual-nombre{ font-size:0.84rem; font-weight:600; line-height:1.3; word-break:break-word; }
    .manual-info{ font-size:0.68rem; color:var(--muted); font-weight:600; letter-spacing:0.04em; text-transform:uppercase; margin-top:2px; }
    .manual-abrir{ flex:none; width:16px; height:16px; opacity:0.55; transition:opacity 0.15s, transform 0.15s; }
    .manual:hover .manual-abrir{ opacity:1; transform:translate(1px, -1px); }

    .empty-msg{ color:var(--muted); font-size:0.95rem; padding:24px 0; text-align:center; }
    .fuentes{ text-align:center; color:#5c7291; font-size:0.72rem; margin:24px 0 30px; }

    @media (max-width: 800px) {
      .filtros-grid{ grid-template-columns:1fr 1fr; }
      .modelos{ grid-template-columns:1fr; }
    }
    @media (max-width: 560px) {
      .container { padding:12px; }
      .topbar { height:52px; padding:0 14px; }
      .topbar img { height:26px; }
      .header-title { margin:24px 0 20px; }
      .header-title h2 { font-size:1.5rem; }
      .filtros{ padding:16px; border-radius:14px; }
      .filtros-grid{ grid-template-columns:1fr; }
      .filtros-acciones .btn{ flex:1; }
      .custom-select-item { padding: 11px 14px; }
      .marcas{ flex-wrap:nowrap; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
      .marcas::-webkit-scrollbar{ display:none; }
      .chip-marca{ flex:none; }
      .item{ padding:14px; }
    }
  </style>
</head>
<body>
  <script src="/ui-common.js"></script>

  <div class="topbar">
    <div class="topbar-left">
      <img src="/logo_grande.png" alt="Sugraf Logo" onerror="this.style.display='none'">
      <a href="/" class="btn-back">&larr; Volver</a>
    </div>
    <div class="topbar-right" id="zona-usuario" style="display:none;">
      <div class="dot"></div>
      <span id="user-name-text">Conectado</span>
    </div>
  </div>

  <div class="container">
    <div class="header-title">
      <h2>Manuales Técnicos</h2>
      <p>Consulta los manuales de las máquinas por cliente, marca o modelo.</p>
    </div>

    <div class="filtros">
      <div class="filtros-grid">
        <div>
          <label for="f_cliente">Cliente</label>
          <div class="custom-select-wrapper">
            <input type="text" id="f_cliente" autocomplete="off" placeholder="Escribe para buscar o desplegar...">
            <div id="lista-clientes" class="custom-select-list"></div>
          </div>
        </div>
        <div>
          <label for="f_marca">Marca</label>
          <div class="custom-select-wrapper">
            <input type="text" id="f_marca" autocomplete="off" placeholder="Todas las marcas">
            <div id="lista-marcas" class="custom-select-list"></div>
          </div>
        </div>
        <div>
          <label for="f_maquina">Máquina / modelo</label>
          <div class="custom-select-wrapper">
            <input type="text" id="f_maquina" autocomplete="off" placeholder="Escribe para buscar o desplegar...">
            <div id="lista-maquinas" class="custom-select-list"></div>
          </div>
        </div>
        <div class="ancho">
          <label for="f_texto">Buscar manual</label>
          <div class="buscador">
            <svg viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>
            <input type="search" id="f_texto" autocomplete="off" placeholder="Nombre del manual: usuario, mantenimiento, instalación...">
          </div>
        </div>
      </div>
      <div class="filtros-acciones">
        <button type="button" class="btn btn-light" onclick="limpiarFiltros()">Limpiar filtros</button>
        <button type="button" class="btn btn-light" id="btn-actualizar" onclick="iniciar(true)">Actualizar carpeta</button>
      </div>
    </div>

    <div class="marcas" id="marcas"></div>

    <div class="resumen">
      <span id="resumen-txt">Cargando manuales...</span>
      <span class="aviso-excel" id="aviso-excel"></span>
    </div>

    <div id="lista"></div>
    <p class="fuentes" id="fuentes"></p>
  </div>

  <script>
    const currentUser = localStorage.getItem("sugraf_user");
    if (!currentUser) window.location.href = "/";
    document.getElementById("user-name-text").innerText = currentUser;
    document.getElementById("zona-usuario").style.display = "flex";

    let marcas = [];     // [{nombre, modelos: [{id, marca, nombre, archivos}]}]
    let carpetas = {};   // id -> carpeta de modelo
    let clientes = [];   // [{nombre, maquinas: [{nombre, equipo, marca, modelo, n_serie, carpetas, aproximado}]}]
    let dropdowns = [];

    const ICONOS = {
        pdf: `<svg viewBox="0 0 24 24" fill="none"><path d="M6.5 3.75h7l4 4V19.5a.75.75 0 0 1-.75.75H6.5a.75.75 0 0 1-.75-.75V4.5a.75.75 0 0 1 .75-.75Z" stroke="#a9bcd6" stroke-width="1.5" stroke-linejoin="round"/><path d="M13.5 3.75V7.5a.5.5 0 0 0 .5.5h3.5" stroke="#a9bcd6" stroke-width="1.5" stroke-linejoin="round"/><path d="M8.75 12.5h6.5M8.75 15.5h6.5M8.75 18h3.5" stroke="#2fd9b8" stroke-width="1.5" stroke-linecap="round"/></svg>`,
        web: `<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.25" stroke="#a9bcd6" stroke-width="1.5"/><path d="M3.75 12h16.5M12 3.75c2.3 2.4 3.4 5.15 3.4 8.25S14.3 17.85 12 20.25C9.7 17.85 8.6 15.1 8.6 12S9.7 6.15 12 3.75Z" stroke="#2fd9b8" stroke-width="1.5" stroke-linejoin="round"/></svg>`,
        zip: `<svg viewBox="0 0 24 24" fill="none"><rect x="4.75" y="3.75" width="14.5" height="16.5" rx="1.5" stroke="#a9bcd6" stroke-width="1.5"/><path d="M12 3.75v3M12 8.25v1.5M12 11.25v1.5" stroke="#2fd9b8" stroke-width="1.5" stroke-linecap="round"/><rect x="10.25" y="14" width="3.5" height="3.5" rx="0.75" stroke="#2fd9b8" stroke-width="1.5"/></svg>`,
        otro: `<svg viewBox="0 0 24 24" fill="none"><path d="M6.5 3.75h7l4 4V19.5a.75.75 0 0 1-.75.75H6.5a.75.75 0 0 1-.75-.75V4.5a.75.75 0 0 1 .75-.75Z" stroke="#a9bcd6" stroke-width="1.5" stroke-linejoin="round"/><path d="M13.5 3.75V7.5a.5.5 0 0 0 .5.5h3.5" stroke="#2fd9b8" stroke-width="1.5" stroke-linejoin="round"/></svg>`,
    };
    const NOMBRE_TIPO = {pdf: 'PDF', web: 'Manual online', zip: 'ZIP', doc: 'Documento', hoja: 'Hoja de cálculo', imagen: 'Imagen', video: 'Vídeo', otro: 'Archivo'};
    const ICONO_ABRIR = `<svg class="manual-abrir" viewBox="0 0 24 24" fill="none" stroke="#7fd9c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4.5h5.5V10M19.5 4.5 11 13M17 14v4.5a1 1 0 0 1-1 1H5.5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1H10"/></svg>`;

    function escHtml(valor) {
        return String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function normalizar(t) {
        return String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
    }

    // "VG3-640" = "VG3 640" = "vg3640"
    function alfanum(t) {
        return normalizar(t).replace(/[^A-Z0-9]/g, '');
    }

    function marcasCompatibles(a, b) {
        a = alfanum(a); b = alfanum(b);
        return !a || !b || a.includes(b) || b.includes(a);
    }

    function valor(campo) {
        return document.getElementById(`f_${campo}`).value.trim();
    }

    function tamano(bytes) {
        if (!bytes) return '';
        return bytes >= 1048576 ? `${(bytes / 1048576).toLocaleString('es-ES', {maximumFractionDigits: 1})} MB`
                                : `${Math.max(1, Math.round(bytes / 1024))} KB`;
    }

    function etiquetaMaquina(m) {
        return [m.equipo, m.marca, m.modelo].filter(Boolean).join(' · ') + (m.n_serie ? ` (S/N ${m.n_serie})` : '');
    }

    // ---- Valores elegidos en los desplegables ----
    function clienteElegido() {
        const v = normalizar(valor('cliente'));
        return v ? clientes.find(c => normalizar(c.nombre) === v) || null : null;
    }

    function marcaElegida() {
        const v = normalizar(valor('marca'));
        return v ? marcas.find(m => normalizar(m.nombre) === v) || null : null;
    }

    // ---- Opciones de cada desplegable ----
    function opcionesClientes() {
        return clientes.map(c => ({valor: c.nombre}));
    }

    function opcionesMarcas() {
        const cliente = clienteElegido();
        return marcas
            .filter(m => !cliente || cliente.maquinas.some(x => marcasCompatibles(x.marca, m.nombre)))
            .map(m => ({valor: m.nombre, extra: `${m.modelos.length} modelo(s)`}));
    }

    function opcionesMaquinas() {
        const cliente = clienteElegido();
        const marca = valor('marca');
        if (cliente) {
            return cliente.maquinas
                .filter(m => !marca || marcasCompatibles(m.marca, marca))
                .map(m => ({valor: m.nombre, extra: etiquetaMaquina(m)}));
        }
        return marcas
            .filter(m => !marca || normalizar(m.nombre) === normalizar(marca))
            .flatMap(m => m.modelos.map(c => ({valor: c.nombre, extra: c.marca})));
    }

    function setupCustomDropdown(inputId, dropdownId, getOptionsCallback, onChange) {
        const input = document.getElementById(inputId);
        const dropdown = document.getElementById(dropdownId);
        let ultimo = input.value;

        const renderOptions = (filterText = "") => {
            const filtro = normalizar(filterText);
            const filtered = getOptionsCallback().filter(o =>
                normalizar(o.valor).includes(filtro) || normalizar(o.extra).includes(filtro)
            );

            dropdown.innerHTML = '';
            if (filtered.length === 0) {
                dropdown.innerHTML = '<div class="custom-select-item vacio">No hay coincidencias</div>';
                return;
            }
            filtered.forEach(opt => {
                const item = document.createElement('div');
                item.className = 'custom-select-item';
                item.textContent = opt.valor;
                if (opt.extra) {
                    const extra = document.createElement('small');
                    extra.textContent = opt.extra;
                    item.appendChild(extra);
                }
                item.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    input.value = opt.valor;
                    dropdown.classList.remove('show');
                    input.blur();
                });
                dropdown.appendChild(item);
            });
        };

        input.addEventListener('focus', () => {
            renderOptions('');
            dropdown.classList.add('show');
        });
        input.addEventListener('input', (e) => {
            renderOptions(e.target.value);
            dropdown.classList.add('show');
        });
        input.addEventListener('blur', () => {
            setTimeout(() => {
                dropdown.classList.remove('show');
                // Si lo escrito coincide con una opción, se normaliza a su texto exacto.
                const exacta = getOptionsCallback().find(o => normalizar(o.valor) === normalizar(input.value));
                if (exacta) input.value = exacta.valor;
                if (input.value !== ultimo) {
                    ultimo = input.value;
                    onChange();
                }
            }, 150);
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
        });
        return { sincronizar: () => { ultimo = input.value; } };
    }

    function alCambiarFiltro() {
        // La máquina elegida deja de valer si ya no está entre las opciones (otro cliente o marca).
        const maquina = valor('maquina');
        if (maquina && !opcionesMaquinas().some(o => normalizar(o.valor) === normalizar(maquina))
            && opcionesMaquinas().every(o => !alfanum(o.valor).includes(alfanum(maquina)))) {
            document.getElementById('f_maquina').value = '';
        }
        dropdowns.forEach(d => d.sincronizar());
        render();
    }

    // ---- Pintado ----
    function filaManual(a) {
        const info = [NOMBRE_TIPO[a.tipo] || 'Archivo', tamano(a.tamano)].filter(Boolean).join(' · ');
        return `
        <a class="manual" href="${escHtml(a.url)}" target="_blank" rel="noopener">
            <span class="manual-icono">${ICONOS[a.tipo] || ICONOS.otro}</span>
            <span class="manual-txt">
                <span class="manual-nombre">${escHtml(a.titulo)}</span>
                <span class="manual-info" style="display:block;">${escHtml(info)}</span>
            </span>
            ${ICONO_ABRIR}
        </a>`;
    }

    function coincideTexto(a, carpeta, texto) {
        return !texto || alfanum(a.titulo).includes(texto) || alfanum(carpeta.nombre).includes(texto);
    }

    function tarjetaModelo(c, texto) {
        const archivos = c.archivos.filter(a => coincideTexto(a, c, texto));
        if (!archivos.length) return '';
        return `
        <div class="item" data-carpeta="${escHtml(c.id)}">
            <div class="item-head">
                <span class="item-titulo">${escHtml(c.nombre)}</span>
                <span class="item-marca">${escHtml(c.marca)}</span>
            </div>
            <div class="item-meta">${archivos.length} manual(es)</div>
            ${archivos.map(filaManual).join('')}
        </div>`;
    }

    function renderCliente(cliente, texto) {
        const marca = valor('marca');
        const maquina = normalizar(valor('maquina'));
        const maquinas = cliente.maquinas.filter(m =>
            (!marca || marcasCompatibles(m.marca, marca)) && (!maquina || normalizar(m.nombre) === maquina));

        let totalManuales = 0;
        const tarjetas = maquinas.map(m => {
            const suyas = m.carpetas.map(id => carpetas[id]).filter(Boolean);
            const bloques = suyas.map(c => {
                const archivos = c.archivos.filter(a => coincideTexto(a, c, texto));
                totalManuales += archivos.length;
                return archivos.length
                    ? `<div data-carpeta="${escHtml(c.id)}" data-grupo="${escHtml(c.marca)} · ${escHtml(c.nombre)}"><div class="carpeta-sub">${escHtml(c.marca)} · ${escHtml(c.nombre)}</div>${archivos.map(filaManual).join('')}</div>`
                    : '';
            }).join('');
            let cuerpo = bloques;
            if (!suyas.length) {
                cuerpo = `<p class="item-vacio">No hay manuales de esta máquina en la carpeta.` +
                    (m.marca && marcas.some(x => marcasCompatibles(x.nombre, m.marca))
                        ? `<button type="button" class="link" data-marca="${escHtml(m.marca)}">Ver los de ${escHtml(m.marca)}</button>` : '') + `</p>`;
            } else if (!bloques) {
                cuerpo = `<p class="item-vacio">Ningún manual coincide con la búsqueda.</p>`;
            }
            return `
            <div class="item">
                <div class="item-head">
                    <span class="item-titulo">${escHtml(m.nombre)}</span>
                    ${m.marca ? `<span class="item-marca">${escHtml(m.marca)}</span>` : ''}
                </div>
                <div class="item-meta">${escHtml(etiquetaMaquina(m))}</div>
                ${m.aproximado ? `<p class="item-nota">Coincidencia aproximada por modelo: comprueba que es el manual correcto.</p>` : ''}
                ${cuerpo}
            </div>`;
        });

        document.getElementById('resumen-txt').innerHTML =
            `<strong>${maquinas.length}</strong> máquina(s) de ${escHtml(cliente.nombre)} · <strong>${totalManuales}</strong> manual(es)`;
        document.getElementById('lista').innerHTML = tarjetas.length
            ? `<div class="section-divider"><span class="dot-status"></span> ${escHtml(cliente.nombre)}</div>
               <div class="modelos">${tarjetas.join('')}</div>`
            : `<p class="empty-msg">Este cliente no tiene máquinas que cumplan los filtros.</p>`;
    }

    function renderCatalogo(texto) {
        const marca = marcaElegida();
        const maquina = alfanum(valor('maquina'));
        let html = '', modelos = 0, manuales = 0;

        marcas.filter(m => !valor('marca') || (marca ? m === marca : alfanum(m.nombre).includes(alfanum(valor('marca')))))
            .forEach(m => {
                const tarjetas = m.modelos
                    .filter(c => !maquina || alfanum(c.nombre).includes(maquina))
                    .map(c => {
                        const t = tarjetaModelo(c, texto);
                        if (t) { modelos++; manuales += c.archivos.filter(a => coincideTexto(a, c, texto)).length; }
                        return t;
                    }).join('');
                if (tarjetas) {
                    html += `<div class="section-divider"><span class="dot-status"></span> ${escHtml(m.nombre)}</div><div class="modelos">${tarjetas}</div>`;
                }
            });

        document.getElementById('resumen-txt').innerHTML =
            `<strong>${modelos}</strong> modelo(s) · <strong>${manuales}</strong> manual(es)`;
        document.getElementById('lista').innerHTML = html || `<p class="empty-msg">No hay manuales que cumplan los filtros.</p>`;
    }

    function renderMarcas() {
        const actual = marcaElegida();
        const cliente = clienteElegido();
        const visibles = cliente ? marcas.filter(m => cliente.maquinas.some(x => marcasCompatibles(x.marca, m.nombre))) : marcas;
        document.getElementById('marcas').innerHTML = visibles.map(m =>
            `<button type="button" class="chip-marca ${m === actual ? 'active' : ''}" data-marca="${escHtml(m.nombre)}">${escHtml(m.nombre)}<span>${m.modelos.length}</span></button>`
        ).join('');
    }

    function render() {
        renderMarcas();
        const texto = alfanum(valor('texto'));
        const cliente = clienteElegido();
        if (cliente) renderCliente(cliente, texto);
        else renderCatalogo(texto);
    }

    // Pulsar una marca (chip o enlace "Ver los de ...") filtra por ella; pulsarla otra vez la quita.
    document.addEventListener('click', e => {
        const el = e.target.closest('[data-marca]');
        if (!el) return;
        const input = document.getElementById('f_marca');
        if (el.classList.contains('chip-marca') && normalizar(input.value) === normalizar(el.dataset.marca)) {
            input.value = '';
        } else {
            const marca = marcas.find(m => marcasCompatibles(m.nombre, el.dataset.marca));
            input.value = marca ? marca.nombre : el.dataset.marca;
            if (!el.classList.contains('chip-marca')) {
                // Desde una máquina del cliente: se pasa a ver todo el catálogo de esa marca.
                document.getElementById('f_cliente').value = '';
                document.getElementById('f_maquina').value = '';
                window.scrollTo({top: 0, behavior: 'smooth'});
            }
        }
        alCambiarFiltro();
    });

    document.getElementById('f_texto').addEventListener('input', render);

    function limpiarFiltros() {
        ['cliente', 'marca', 'maquina', 'texto'].forEach(c => { document.getElementById(`f_${c}`).value = ''; });
        alCambiarFiltro();
    }

    async function iniciar(refrescar = false) {
        showLoading();
        try {
            const res = await fetch(`/api/manuales/catalogo${refrescar ? '?refrescar=true' : ''}`);
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || `Error HTTP: ${res.status}`);
            marcas = data.marcas;
            clientes = data.clientes;
            carpetas = {};
            marcas.forEach(m => m.modelos.forEach(c => { carpetas[c.id] = c; }));
            document.getElementById('aviso-excel').innerText = data.error_clientes || '';
            document.getElementById('fuentes').innerText =
                `${data.total_manuales} manuales · ${data.total_modelos} modelos · ${marcas.length} marcas · carpeta Manuales tecnicos de Drive`;

            if (!dropdowns.length) {
                // Filtros que llegan en la dirección (botón "Ver todos los manuales" de adjudicados).
                const params = new URLSearchParams(location.search);
                ['cliente', 'marca', 'maquina'].forEach(c => { if (params.get(c)) document.getElementById(`f_${c}`).value = params.get(c); });
                dropdowns = [
                    setupCustomDropdown('f_cliente', 'lista-clientes', opcionesClientes, alCambiarFiltro),
                    setupCustomDropdown('f_marca', 'lista-marcas', opcionesMarcas, alCambiarFiltro),
                    setupCustomDropdown('f_maquina', 'lista-maquinas', opcionesMaquinas, alCambiarFiltro),
                ];
                const marca = marcas.find(m => marcasCompatibles(m.nombre, valor('marca')));
                if (valor('marca') && marca) document.getElementById('f_marca').value = marca.nombre;
                dropdowns.forEach(d => d.sincronizar());
            }
            render();
        } catch (e) {
            document.getElementById('resumen-txt').innerText = '';
            document.getElementById('lista').innerHTML = `<p class="empty-msg" style="color:#fca5a5;">Error: ${escHtml(e.message)}</p>`;
        } finally {
            hideLoading();
        }
    }

    window.sugrafBotListo = iniciar();

    // Manuales y máquinas en pantalla, para el asistente IA (chatbot.js).
    function manualesVisiblesBot() {
        const lista = [];
        document.querySelectorAll('#lista .item').forEach(item => {
            const maquina = [item.querySelector('.item-marca'), item.querySelector('.item-titulo')]
                .filter(Boolean).map(el => el.textContent.trim()).join(' · ');
            item.querySelectorAll('a.manual').forEach(a => {
                const carpeta = a.closest('[data-carpeta]');
                lista.push({
                    grupo: (carpeta && carpeta.dataset.grupo) || maquina, carpeta_id: carpeta ? carpeta.dataset.carpeta : '',
                    titulo: a.querySelector('.manual-nombre').textContent.trim(), url: a.getAttribute('href'),
                });
            });
        });
        return lista;
    }

    function sinManualesBot() {
        return [...document.querySelectorAll('#lista .item')].filter(item => item.querySelector('.item-vacio'))
            .map(item => item.querySelector('.item-titulo').textContent.trim());
    }

    window.sugrafBotContexto = function () {
        const filtros = {};
        ['cliente', 'marca', 'maquina', 'texto'].forEach(c => { if (valor(c)) filtros[c] = valor(c); });
        return {
            filtros,
            resumen: document.getElementById('resumen-txt').innerText,
            manuales: manualesVisiblesBot().slice(0, 40),
            sin_manuales: sinManualesBot(),
            etiqueta: [filtros.cliente, filtros.marca, filtros.maquina].filter(Boolean).join(' · '),
        };
    };

    // ---------------- Acciones del asistente (modo control de chatbot.js) ----------------
    function resultadoBot() {
        return {ok: true, resumen: document.getElementById('resumen-txt').innerText,
                manuales: manualesVisiblesBot().slice(0, 40), sin_manuales: sinManualesBot()};
    }

    window.sugrafBotAcciones = {
        filtrar_manuales: {
            descripcion: 'Filtra los manuales por cliente (sus máquinas), marca, máquina/modelo o nombre del manual. '
                + 'Solo cambia los filtros que se indiquen ("" quita un filtro). Devuelve los manuales con su enlace.',
            parametros: {type: 'object', additionalProperties: false, properties: {
                cliente: {type: 'string'},
                marca: {type: 'string'},
                maquina: {type: 'string', description: 'Máquina del cliente o modelo de la carpeta'},
                texto: {type: 'string', description: 'Palabras del nombre del manual (usuario, mantenimiento, instalación...)'},
            }},
            etiqueta: a => `Buscando manuales${a.marca ? ` de ${a.marca}` : ''}${a.cliente ? ` de ${a.cliente}` : ''}`,
            ejecutar: async (a) => {
                if (a.cliente) {
                    const buscado = normalizar(a.cliente);
                    const candidatos = clientes.filter(c => normalizar(c.nombre).includes(buscado));
                    const exacto = clientes.find(c => normalizar(c.nombre) === buscado) || (candidatos.length === 1 ? candidatos[0] : null);
                    if (!exacto) {
                        return {ok: false, error: candidatos.length
                            ? `Varios clientes coinciden: ${candidatos.slice(0, 8).map(c => c.nombre).join('; ')}. Pregunta cuál es.`
                            : `No hay ningún cliente que coincida con "${a.cliente}".`};
                    }
                    a.cliente = exacto.nombre;
                }
                if (a.marca) {
                    const marca = marcas.find(m => marcasCompatibles(m.nombre, a.marca));
                    if (marca) a.marca = marca.nombre;
                }
                for (const campo of ['cliente', 'marca', 'maquina', 'texto']) {
                    if (a[campo] !== undefined) await SugrafBot.escribir(document.getElementById(`f_${campo}`), a[campo], {eventos: false});
                }
                alCambiarFiltro();
                await SugrafBot.resaltar(document.getElementById('resumen-txt'));
                return resultadoBot();
            },
        },
        limpiar_filtros: {
            descripcion: 'Quita todos los filtros de manuales.',
            parametros: {type: 'object', properties: {}, additionalProperties: false},
            etiqueta: () => 'Quitando los filtros',
            ejecutar: async () => { limpiarFiltros(); return resultadoBot(); },
        },
    };
  </script>
  <script src="/chatbot.js"></script>
</body>
</html>
